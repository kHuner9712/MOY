# 探针用最小 nginx 配置（不是交付编排的 nginx 配置）
# 验三件事：① 反代可用 ② SSE 不被缓冲 ③ /metrics 与 /api 同源分流
upstream oa_adapter { server adapter:8000; }
upstream oa_web     { server web:3000; }

server {
    listen 80;
    server_name _;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # SSE 必须关缓冲，否则流式字会攒着一次性吐出
    location /api/ {
        proxy_pass http://oa_adapter;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location = /metrics {
        proxy_pass http://oa_adapter;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://oa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
