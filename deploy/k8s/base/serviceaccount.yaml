# ---------------------------------------------------------------------------
# ServiceAccount officeai —— 为什么不用 default：
#
# 1. 把工作负载与集群默认 SA 解绑。default SA 常被集群插件、运维机器人复用，
#    权限边界不清；专用 SA 让「谁需要什么权限」有明确落点，未来接 RBAC 时
#    不用回头改 workload。
# 2. automountServiceAccountToken: false —— adapter 与 web **都不调用
#    Kubernetes API**，令牌自动挂载等于给每个 Pod 发一张进 API Server 的
#    入场券：纯风险无收益。Deployment 侧会再写一遍同名字段（双保险），
#    防止有人只复制 workload 模板、漏掉 SA 上的这行。
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: officeai
  namespace: officeai
  labels:
    app.kubernetes.io/part-of: officeai
automountServiceAccountToken: false
