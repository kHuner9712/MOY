# ---------------------------------------------------------------------------
# web Service —— ClusterIP（与 adapter/service.yaml 同一口径）
#
# 端口不裸暴露：web 只在集群内可寻址（http: 3000），外部流量一律走
# Ingress（ingress.yaml）→ 与 compose 侧「只有边缘 80/443 对外」一致。
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: officeai
  labels:
    app: web
    app.kubernetes.io/part-of: officeai
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
