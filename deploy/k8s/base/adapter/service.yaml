# ---------------------------------------------------------------------------
# adapter Service —— ClusterIP（规格 §3.3.5）
#
# 为什么只给 ClusterIP：端口不裸暴露是与 compose 侧 P0-4 收口后的同一口径
# （compose 里 adapter/web 已改 expose，只有边缘 80/443 对外）。流量入口是
# Ingress（ingress.yaml），Service 只做集群内稳定寻址；不要改成 LoadBalancer
# 或 NodePort——那等于把 /metrics、/readyz 又裸回公网。
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: adapter
  namespace: officeai
  labels:
    app: adapter
    app.kubernetes.io/part-of: officeai
spec:
  type: ClusterIP
  selector:
    app: adapter
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
