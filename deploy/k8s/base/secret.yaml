# ---------------------------------------------------------------------------
# Secret officeai-secrets —— **只声明形状与生成方式，禁止提交任何密钥值**
#
# 为什么文件里不写 data：仓库里出现过的密钥 = 已泄露的密钥（本项目审计
# OA-AUDIT-001 就是编排里的明文兜底值被提交公开，最后全员轮换）。本清单
# 只固定「名字与形状」，值由部署侧从 deploy/.env 生成——
#
# 单一真源（design-2026-11-02-security-deploy.md §3.3.6）：
#   键集合 = deploy/.env.example（app.env.keys 是它的镜像清单）；
#   值     = deploy/.env（本地生成，不入库）。
#
# 生成 / 更新（幂等，可重复执行；注意 -n officeai）：
#
#   kubectl -n officeai create secret generic officeai-secrets \
#     --from-env-file=deploy/.env --dry-run=client -o yaml | kubectl apply -f -
#
# 为什么用 --from-env-file 而不是逐个 --from-literal：
#   逐个手写 = 把「k8s 与 compose 各维护一份键清单」，迟早漂移；
#   from-env-file 让 compose 与 k8s 吃**同一个 deploy/.env**，键漂移从
#   根上消失，validate_deploy.py 只需机械断言子集关系。
#
# 敏感键判定（与 §3.3.6 门禁同一条判据，宁多勿少）：
#   命名含 PASSWORD / SECRET / _KEY / TOKEN 的一律只走本 Secret，
#   不得出现在 configmap.yaml —— 包括名字命中但语义非密钥的
#   OA_KEYCLOAK_REALM / OA_KEYCLOAK_CLIENT_ID / OA_KEYCLOAK_DB / OA_KEYCLOAK_ADMIN
#   （含 "_KEY" 字面命中，保守归 Secret），以及值里嵌了口令的 OA_DATABASE_URL。
#
# ⚠️ 禁止手工把真实值填进本文件再 apply；也禁止把生成结果存回仓库。
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: officeai-secrets
  namespace: officeai
  labels:
    app.kubernetes.io/part-of: officeai
type: Opaque
# data: 由上面的命令填充，禁止手工填写、禁止入库
