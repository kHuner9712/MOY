# ===========================================================================
# 轻量版编排（阶段四 T4-05.4，架构 §9.1 / §9.4）
#
# 目标：一台 8 GB 4 核机器跑完整功能栈，**常驻 9 个容器**、实测空载 1.93 GiB
# （Docker 工作集口径，见 `docs/lite-container-baseline.md` §2.3）。
#
#   常驻 9 个：proxy / adapter / web / postgres / valkey / keycloak
#              / dify-api / dify-worker / plugin_daemon
#   非常驻 2 个：dify-web（profile `admin`）、migrate（profile `migrate`）
#
# 与标准版（docker-compose.yml）的实质差异，每一条都是为了砍容器：
#
#   1. **向量库 = pgvector**：不再有 milvus + milvus-etcd + milvus-object-store。
#      镜像内实测 `dify_vdb_pgvector/pgvector.py:269` 会自己执行
#      `CREATE EXTENSION vector`，而本栈 Dify 用的库账号就是超级用户 officeai，
#      所以建库时无需额外手工步骤（每个**库**仍各要一次，见架构 §9.3.1）。
#   2. **对象存储 = 本地卷**：不再有 SeaweedFS。
#      镜像内实测 `extensions/ext_storage.py:32-35`
#      `case StorageType.LOCAL → OpenDALStorage(scheme="fs", root=STORAGE_LOCAL_PATH)`。
#      单机部署下对象存储只是"比本地盘多一次网络往返"，不值得多一个容器。
#   3. **不含 dify-sandbox / ssrf_proxy**：容器预算固定 9 个。缺失后果写在文件末尾
#      「已知限制」，**不是遗漏**。
#
# Dify 与平台**共用同一个 PG 与同一个 Valkey**，靠"不同库 + 不同 REDIS_DB"隔离：
#   PG    ：officeai（业务）/ keycloak（身份）/ dify（Dify）/ dify_plugin（插件守护）
#   Valkey：db0（适配层）/ db1（Dify celery）/ db2（plugin_daemon）
# 三套 PG 会直接吃掉 1.5 GiB 以上，所以轻量版必须共库。
#
# 四组硬约束（全部来自实测，改之前先读 `docs/lite-container-baseline.md`）：
#   ① Keycloak 必须限堆 `JAVA_OPTS_APPEND=-Xms64m -Xmx384m`：不限堆时 JVM 按
#      宿主内存推算上限，实测整机 1.93 GiB → 3.30 GiB（+72%），8G 结论直接作废。
#   ② PG 健康检查必须断言 `schema_migration` 表，**不能只 pg_isready**：
#      docker-entrypoint 会先起临时实例跑 initdb.d（此时 pg_isready 为真）再停掉重启，
#      plugin_daemon 在这个窗口连上又被断开 → `panic: failed to init dify plugin db`。
#   ③ `CODE_EXECUTION_ENDPOINT` / `SSRF_PROXY_*` **只能整条不设，绝不能设成空串**：
#      前者在镜像内是 `HttpUrl` 字段，空串触发
#      `ValidationError: CODE_EXECUTION_ENDPOINT Input should be a valid URL` →
#      dify-api 进程直接退出；后者是 `str | None`，空串会让 httpx 报
#      "unknown scheme for proxy URL"，模型 provider 出站全挂。
#   ④ 只暴露 proxy 一个端口。postgres / valkey / keycloak / adapter 一律不映射
#      宿主端口——它们没有面向公网的鉴权模型。
#
# 验收：`bash deploy/validate_lite_up.sh`（含静态断言 + 真起栈，详见脚本头部）。
# ===========================================================================

name: officeai-lite

x-logging: &default-logging
  driver: json-file
  options:
    # 轻量版宿主磁盘通常也不宽裕：单文件 20m × 3 份足够定位一次故障
    max-size: "20m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------
  # 基础设施层（两个容器，被其余全部复用）
  # ---------------------------------------------------------------------
  postgres:
    # 必须是 **pgvector 官方镜像**：迁移 0009 第一步是 `CREATE EXTENSION vector`，
    # 纯 postgres:18 镜像的 extension 目录里没有 vector（实测只有 pg_trgm）。
    # R2-ARC-14（2026-10-29）：tag 由滚动的 `pg18` 改为**精确标签**（PG 版本 + 扩展
    # 版本都可追溯到具体构建）；digest 已在 deploy/images.lock 登记，`docker pull` 实测通过。
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    container_name: oal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OA_POSTGRES_USER:-officeai}
      POSTGRES_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env.lite 中设置}
      POSTGRES_DB: ${OA_POSTGRES_DB:-officeai}
      LANG: C.UTF-8
    volumes:
      # PG 18+ 镜像要求挂到 /var/lib/postgresql（数据在其下 data/ 子目录），
      # 挂 /var/lib/postgresql/data 会被镜像入口拒绝启动（2026-10-21 实测）
      - postgres-data:/var/lib/postgresql
      # 首次启动（空数据目录）建 dify / keycloak / dify_plugin 三个逻辑库
      - ./init-databases.sql:/docker-entrypoint-initdb.d/00-init-databases.sql:ro
      # 以下四份的顺序由**字典序**决定，改文件名会让授权先于建表执行，
      # 表现为"表建好了、应用角色却无权读写"（initdb 日志里只有一行 NOTICE）
      - ./init-schema-phase2.sql:/docker-entrypoint-initdb.d/20-init-schema-phase2.sql:ro
      - ./init-schema-phase3.sql:/docker-entrypoint-initdb.d/22-init-schema-phase3.sql:ro
      - ./init-schema-phase4.sql:/docker-entrypoint-initdb.d/30-init-schema-phase4.sql:ro
      - ./init-app-role.sql:/docker-entrypoint-initdb.d/30-init-app-role.sql:ro
    command:
      - postgres
      # 默认值按宿主内存推算，8 GB 机器上 shared_buffers 会给到 2 GB，
      # 光 PG 就吃掉三分之一预算；轻量版显式压到 128 MB。
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=100
      - -c
      - effective_cache_size=256MB
    healthcheck:
      # ⚠ 不能只 pg_isready（见文件头约束②）。READY 的真实语义是"业务表已建出来"，
      # 所以直接断言迁移台账表存在——它由 init-schema-phase2.sql 建、migrate.py 写。
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${OA_POSTGRES_USER:-officeai} -d ${OA_POSTGRES_DB:-officeai} &&
          psql -U ${OA_POSTGRES_USER:-officeai} -d ${OA_POSTGRES_DB:-officeai}
          -tAc "SELECT to_regclass('public.schema_migration') IS NOT NULL" | grep -q t
      interval: 10s
      timeout: 5s
      retries: 30
      # 首次 initdb 要跑 4 份脚本（建 4 库 + 34 表 + RLS + 应用角色），实测 ~13 s
      start_period: 30s
    deploy:
      resources:
        limits:
          # 实测 cgroup 上界 191 MiB（shared_buffers 128 MB 时），留 2.5 倍余量
          memory: 512M
    networks: [officeai-lite]
    logging: *default-logging

  valkey:
    image: valkey/valkey:9.2-alpine
    container_name: oal-valkey
    restart: unless-stopped
    command: >
      valkey-server
      --appendonly yes
      --requirepass ${OA_VALKEY_PASSWORD:?必须在 .env.lite 中设置}
      --maxmemory 256mb
      # R2-ENG-13（审计 2026-10-29）：与全量栈对齐为 volatile-lru。
      # 原 allkeys-lru 会**优先淘汰没有 TTL 的键**（如幂等记录被踢掉 → 重复请求
      # 被当首次处理），而 volatile-lru 只淘汰带 TTL 的键，语义更贴合"缓存"定位。
      # 代价：若存在大量无 TTL 键会退化为"不淘汰直接 OOM"——256mb 下需关注
      # `used_memory` 与 keyspace 的 TTL 覆盖，扩容优先级见 docs/ 的容量说明。
      --maxmemory-policy volatile-lru
    volumes:
      - valkey-data:/data
    healthcheck:
      # 不带密码的 ping 在 requirepass 下返回 NOAUTH，所以必须带 -a
      test: ["CMD-SHELL", "valkey-cli -a ${OA_VALKEY_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          # 必须大于 --maxmemory（256mb），否则 OOM killer 会先于淘汰策略动手
          memory: 384M
    networks: [officeai-lite]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 业务能力层：身份与权限（令牌签发方，没有它没人能登录）
  # ---------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: oal-keycloak
    restart: unless-stopped
    # 首次启动**不能**带 `--optimized`，否则报
    # `--optimized was used for first ever server start` 直接退出。
    # 健康端点在 Keycloak 25+ 迁到了**管理端口 9000**，探 8080 会拿到 404。
    command:
      - start
      - --http-enabled=true
      - --http-port=8080
      - --http-management-port=9000
      - --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${OA_KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      KC_DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env.lite 中设置}
      # R4 / K2（2026-11-02）：固定对外基址。
      # 这不只是「生成正确的端点」——`KC_HOSTNAME_STRICT=false` 且**不设**
      # `KC_HOSTNAME` 时，issuer 会随请求的 `Host` 头变化：攻击者用自己的域名
      # 访问登录端点，就能拿到一枚 iss 指向该域名的令牌（Host 注入）。
      # 取值来自 `OA_PUBLIC_BASE_URL`（单一真源）；缺失即拒绝启动——
      # 静默回落到某个默认域名比启动失败更难排查。
      # lite 的对外基址插值自 OA_LITE_PUBLIC_URL（`.env.lite` 里没有独立键）。
      KC_HOSTNAME: ${OA_LITE_PUBLIC_URL:?必须在 .env.lite 中设置（对外基址）}
      # 边缘反代后必须声明信任 `X-Forwarded-*`，否则 Keycloak 看到的是
      # http + 内网主机名，拼出的跳转会把浏览器打回内网地址。
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # 命令行已带 --health-enabled=true，这里再显式给一份：环境变量是"契约"，
      # 命令行是"当前入口"。validate_lite_up.sh 从 compose config 解析本键断言。
      KC_HEALTH_ENABLED: "true"
      # Keycloak 26 起 KEYCLOAK_ADMIN/PASSWORD 已移除，改用 KC_BOOTSTRAP_ADMIN_*
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OA_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OA_KEYCLOAK_ADMIN_PASSWORD:?必须在 .env.lite 中设置}
      # ⚠ 硬要求（见文件头约束①）：不限堆时整机 1.93 → 3.30 GiB。
      # 384m 实测足够 ≤500 用户签发与管理；上调必须按 baseline §2.5 重测。
      JAVA_OPTS_APPEND: "-Xms64m -Xmx384m"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 镜像内没有 curl（只有 bash 与 grep），所以用 bash 的 /dev/tcp 手写 HTTP。
      # CMD-SHELL 的 /bin/sh 在 UBI9 里是 bash，但显式 `bash -c` 更稳。
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1
          printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      # JVM 起来 + 建表 + 初始化 realm 实测 81 s（二次启动 48 s）
      start_period: 90s
    deploy:
      resources:
        limits:
          # 实测 docker stats 797.6 MiB / cgroup 909.1 MiB。
          # **不能按架构文档早先的 768M 写**：那样会被 OOM killer 杀掉，
          # 表现为"容器反复重启、日志无异常"（数字以 baseline §2.5 为准）。
          memory: 1024M
    networks: [officeai-lite]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # realm 一次性导入器（K5 / R5）
  #
  # **刻意不用 `--import-realm`**（语义是"每次启动都尝试导入"，且已存在 realm 时的
  # 行为依赖导入策略默认值）——客户已有 realm 被覆盖是不可挽回的事故，故改用
  # `kcadm get` 显式探测，存在则 `[skip]` 退出 0。
  # 用法：`docker compose --profile install up -d keycloak-import`
  # ---------------------------------------------------------------------
  keycloak-import:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: oa-keycloak-import
    profiles: ["install"]
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/rendered/realm-officeai.json:/tmp/realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OA_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OA_KEYCLOAK_ADMIN_PASSWORD:?必须在 .env.lite 中设置}
    networks: [officeai-lite]
    logging: *default-logging
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/keycloak/bin/kcadm.sh config credentials \
          --server http://keycloak:8080 --realm master \
          --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" \
          --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD"
        if /opt/keycloak/bin/kcadm.sh get realms/officeai >/dev/null 2>&1; then
          echo "[skip] realm officeai 已存在，不覆盖（客户既有配置优先）"
          exit 0
        fi
        /opt/keycloak/bin/kcadm.sh create realms -f /tmp/realm.json
        echo "[ok] realm officeai 已创建"

  # ---------------------------------------------------------------------
  # 底座层：Dify（api / worker，共用本栈 PG + Valkey）
  # ---------------------------------------------------------------------
  dify-api:
    image: langgenius/dify-api:1.17.1
    container_name: oal-dify-api
    restart: unless-stopped
    environment:
      MODE: api
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env.lite 中设置}
      # 轻量版只有 proxy 一个入口：Dify 生成的文件/回调链接必须指向它，否则
      # 浏览器拿到 `http://dify-api:5001/...` 这种内网名，必然打不开。
      CONSOLE_API_URL: ${OA_LITE_PUBLIC_URL:-http://localhost}
      CONSOLE_WEB_URL: ${OA_LITE_PUBLIC_URL:-http://localhost}
      SERVICE_API_URL: ${OA_LITE_PUBLIC_URL:-http://localhost}
      APP_API_URL: ${OA_LITE_PUBLIC_URL:-http://localhost}
      APP_WEB_URL: ${OA_LITE_PUBLIC_URL:-http://localhost}
      FILES_URL: ${OA_LITE_PUBLIC_URL:-http://localhost}
      # 必须 true（见 baseline §1.3 坑 2）：否则 dify 库没有表，第一个请求就 500
      MIGRATION_ENABLED: "true"
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env.lite 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${OA_DIFY_DB:-dify}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env.lite 中设置}
      REDIS_DB: "1"
      CELERY_BROKER_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/1
      # --- 向量库 = pgvector（省掉 milvus/etcd/object-store 三个容器）---------
      # 7 个 PGVECTOR_* 键逐字取自镜像内 dify_vdb_pgvector/pgvector.py:39-53，
      # 缺一个就抛 `ValueError: config PGVECTOR_XXX is required`。
      # MIN 必须 < MAX，否则同一个文件里第 53 行直接拒绝启动。
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: ${OA_POSTGRES_USER:-officeai}
      PGVECTOR_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env.lite 中设置}
      # 独立库：向量表不落业务库，避免与 RLS 策略混库
      PGVECTOR_DATABASE: ${OA_DIFY_DB:-dify}
      PGVECTOR_MIN_CONNECTION: "2"
      PGVECTOR_MAX_CONNECTION: "10"
      # --- 对象存储 = 本地卷（省掉 SeaweedFS 容器）-------------------------
      # 镜像内 ext_storage.py:32-35 实测：local → OpenDALStorage(scheme="fs")
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      # --- 以下三个键**故意不设**（见文件头约束③）------------------------
      # CODE_EXECUTION_ENDPOINT / CODE_EXECUTION_API_KEY（无 sandbox）
      # SSRF_PROXY_HTTP_URL / SSRF_PROXY_HTTPS_URL（无出站代理）
      CONSOLE_CORS_ALLOW_ORIGINS: "*"
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: ${OA_PLUGIN_DAEMON_KEY:?必须在 .env.lite 中设置}
      PLUGIN_DIFY_INNER_API_URL: http://dify-api:5001
      PLUGIN_DIFY_INNER_API_KEY: ${OA_PLUGIN_INNER_API_KEY:?必须在 .env.lite 中设置}
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # 只等 started：plugin_daemon 没有"就绪"语义，串行等它 healthy 会白等，
      # 而 Dify 启动期并不需要它在线（模型 provider 是运行期才查）。
      plugin_daemon:
        condition: service_started
    healthcheck:
      # 镜像内有 curl（实测 /usr/bin/curl）；/health 路由见 extensions/ext_app_metrics.py:20
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      # ⚠ 实测首启 **78.1 s**、二次 84.4 s（固有开销，与迁移无关）。
      # start_period 若按 60 s 写，会在正常启动期就判 unhealthy 并连带卡住 adapter。
      start_period: 120s
    deploy:
      resources:
        limits:
          # 实测 422.9 MiB（冷启动）/ 490.9 MiB（cgroup 上界）
          memory: 1024M
    networks: [officeai-lite]
    logging: *default-logging

  dify-worker:
    image: langgenius/dify-api:1.17.1
    container_name: oal-dify-worker
    restart: unless-stopped
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env.lite 中设置}
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env.lite 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${OA_DIFY_DB:-dify}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env.lite 中设置}
      REDIS_DB: "1"
      CELERY_BROKER_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/1
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: ${OA_POSTGRES_USER:-officeai}
      PGVECTOR_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env.lite 中设置}
      PGVECTOR_DATABASE: ${OA_DIFY_DB:-dify}
      PGVECTOR_MIN_CONNECTION: "2"
      PGVECTOR_MAX_CONNECTION: "10"
      STORAGE_TYPE: local
      # 与 dify-api 共用同一个卷：索引任务写入的分段文件，api 侧要能读到
      STORAGE_LOCAL_PATH: /app/api/storage
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: ${OA_PLUGIN_DAEMON_KEY:?必须在 .env.lite 中设置}
      PLUGIN_DIFY_INNER_API_URL: http://dify-api:5001
      PLUGIN_DIFY_INNER_API_KEY: ${OA_PLUGIN_INNER_API_KEY:?必须在 .env.lite 中设置}
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # worker 没有 HTTP 端点（baseline §3.3：无就绪语义，只做进程存在判定）。
      # entrypoint.sh 用 `exec celery -A celery_entrypoint.celery worker ...` 启动，
      # 所以 PID 1 就是 celery 本体；镜像内**没有 ps**（实测），只能读 /proc。
      test: ["CMD-SHELL", "grep -qa 'celery_entrypoint.celery' /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          # 实测 427.7 MiB（冷启动）/ 503.8 MiB（cgroup 上界）
          memory: 768M
    networks: [officeai-lite]
    logging: *default-logging

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    container_name: oal-plugin-daemon
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env.lite 中设置}
      DEPLOY_ENV: PRODUCTION
      # 独立库（init-databases.sql 建）；与 dify 库分开，
      # 否则插件守护的 gorm 迁移会与 Dify 的 alembic 抢同一张表空间
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env.lite 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dify_plugin
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env.lite 中设置}
      REDIS_DB: "2"
      SERVER_PORT: "5002"
      SERVER_KEY: ${OA_PLUGIN_DAEMON_KEY:?必须在 .env.lite 中设置}
      # 回呼 Dify api：注意服务名是本栈的 dify-api，不是官方编排里的 api
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${OA_PLUGIN_INNER_API_KEY:?必须在 .env.lite 中设置}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: "false"
    volumes:
      - plugin-daemon-data:/app/storage
    depends_on:
      # ⚠ 必须等 postgres **healthy**（本栈 healthy 断言了 schema_migration 表）：
      # 只等 started 会让它在 initdb 临时实例窗口连上去，然后
      # `panic: failed to init dify plugin db` 退出（baseline §3.3 实测）。
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # 镜像内有 curl（实测）；路由见二进制内 /internal/server/controllers/health_check.go
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5002/health/check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          # 空载实测仅 18.9 MiB，但"安装模型 provider 插件"时会解包 + 起子进程，
          # 一次性冲到几百 MB；限太小会让首次配 provider 失败。
          memory: 512M
    networks: [officeai-lite]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 自研层：统一适配层（唯一允许接触底座的应用）
  # ---------------------------------------------------------------------
  adapter:
    build:
      context: ../apps/adapter
      dockerfile: Dockerfile
    image: officeai/adapter:${OA_IMAGE_TAG:-1.0.0}
    container_name: oal-adapter
    restart: unless-stopped
    env_file:
      # required: false 是为了让 `docker compose config -q` 在还没生成 .env.lite
      # 时也能通过（QA 的静态验收就是这条命令）。真正必需的项在下面
      # environment 里用 `:?` 声明，缺了在起栈时立刻失败，不会静默用默认值。
      - path: .env.lite
        required: false
    environment:
      # S1 硬约束：production + stub 会被 validate_auth_startup 拒绝启动（30004）。
      # 这里显式写死生产 + OIDC，不给"忘了配就退化成不验签"的机会。
      OA_ENV: production
      OA_AUTH_MODE: oidc
      # ⚠ 必须是 private：SaaS 多租户依赖请求头里的租户上下文，
      # 私有化单租户下走 private 才是正确口径。
      OA_DEPLOY_MODE: private
      OA_API_PREFIX: /api/v1
      # 离线/在线「镜像来源」开关只在宿主机侧（install.sh 读 .env），不注入容器：
      # 适配层无对应字段，注入会被静默丢弃
      # 底座地址：只在本 compose 网络内可达，不经 proxy 出去
      OA_DIFY_BASE_URL: http://dify-api:5001
      # 键名必须与 `Settings.keycloak_base_url` 对齐（`OA_` + 字段名大写），
      # 否则 pydantic 静默忽略、回落到默认值（见 deploy/validate_config_names.py）
      # K1 / R4（2026-11-02）：对外基址——**单一真源**。
      # 适配层用它决定会话 Cookie 的 `Secure` 属性；编排用它给 Keycloak 设
      # `KC_HOSTNAME`（= 令牌 `iss` 的域名）。两处必须同源，故只留这一个变量。
      # 缺失即拒绝启动（`validate_auth_startup` → 30004）：空值不会报错，
      # 只会让 Cookie 静默丢掉 Secure —— 那比启动失败难查得多。
      # lite 的对外基址**插值**自 OA_LITE_PUBLIC_URL（单一事实来源）：
      # 不再多一个独立键。两处各写一份是"配了、看起来生效了、其实没生效"的
      # 最坏形态——install.sh 只维护旧的那个，新的恒空，`Secure` 永远缺席。
      OA_PUBLIC_BASE_URL: ${OA_LITE_PUBLIC_URL:?必须在 .env.lite 中设置（对外基址）}
      # 会话 Cookie 开关（P0-5 路线 A）：**回滚开关**，不是功能开关。
      # 关掉后 `/sso/*` 五个端点返回 503，适配层回到只认 `Authorization: Bearer`
      # 的旧形态——现场 Cookie 轨出问题时不回滚镜像也能退回，这是灰度期最后一道退路。
      # 缺省 true：目标态就是"令牌只在 httpOnly Cookie 里"；双轨期内 Bearer 仍然接受，
      # 旧前端（localStorage 形态）不受影响。
      OA_AUTH_COOKIE_ENABLED: ${OA_AUTH_COOKIE_ENABLED:-true}
      OA_KEYCLOAK_BASE_URL: http://keycloak:8080
      OA_REDIS_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/0
      # 业务库必须用**应用角色**（NOSUPERUSER + NOBYPASSRLS）：
      # 用库属主会绕过行级安全，/readyz 的 db_privilege 自检随即判 not_ready，
      # 容器永远不 healthy——而 RLS 对超级用户根本不生效。
      # **迁移用属主/迁移角色 DSN，不是应用角色**（2026-11-04 修正）：
      # `CREATE TABLE` 需要 `public` 上的 CREATE 权限，而应用角色 officeai_app 是
      # NOSUPERUSER + NOBYPASSRLS 且无该权限（这是 RLS 隔离的前提）。用它跑 DDL
      # 只在"全新库"上侥幸通过（表已由 initdb 建好），一遇到"已装版本升级"就报
      # `permission denied for schema public` —— CI 路径 B（模拟真实升级）实测命中。
      # 运行期（adapter）仍用应用角色 DSN，两个角色分离是硬要求：
      # 不能靠"给应用角色授 CREATE"让迁移跑通，那会把 DDL 权限永久留给运行角色。
      OA_DATABASE_URL: postgresql://${OA_POSTGRES_USER:-officeai}:${OA_POSTGRES_PASSWORD:?必须在 .env.lite 中设置}@postgres:5432/${OA_POSTGRES_DB:-officeai}
      # 私有化部署面向本机 Dify，必须真实联调
      OA_DOWNSTREAM_ENABLED: "true"
      OA_DIFY_DEFAULT_APP_KEY: ${OA_DIFY_DEFAULT_APP_KEY:-}
      OA_DIFY_AGENT_APP_KEY: ${OA_DIFY_AGENT_APP_KEY:-}
      # B2（2026-11-05）：xlsx 导出默认开；离线预览默认关，部署验收后再开
      # （见 docs/delivery-2026-11-05-b2-xlsx-preview.md）。
      OA_ARTIFACT_XLSX_ENABLED: ${OA_ARTIFACT_XLSX_ENABLED:-true}
      OA_OFFICE_PREVIEW_ENABLED: ${OA_OFFICE_PREVIEW_ENABLED:-false}
      # 矩阵第 2 项（2026-11-06）：计划确认默认关
      OA_TASK_PLAN_ENABLED: ${OA_TASK_PLAN_ENABLED:-false}
      OA_TASK_PLAN_TIMEOUT_SECONDS: ${OA_TASK_PLAN_TIMEOUT_SECONDS:-900}
      # 迁移**不进 Web 启动**（架构 §9.4）：由 profiles:[migrate] 的一次性 Job 执行。
      # 这里**故意不设** OA_DB_AUTO_MIGRATE，保持 Settings 默认 false（T4-01.4）——
      # 显式写 "false" 反而会掩盖"默认值被改"的风险。
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # dify-api 只等 started：它首启就要 78-85 s，等 healthy 会把
      # `up` 到 adapter 就绪的链路无谓地串长；且适配层启动期不依赖底座在线
      # （`/readyz` 的 5 项检查里下游是"软失败"，靠 OA_DOWNSTREAM_ENABLED 控制）。
      dify-api:
        condition: service_started
    healthcheck:
      # 必须打 /readyz（不是 /healthz）：它同时校验业务库连通性与**数据库权限自检**
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u, sys;
          sys.exit(0 if u.urlopen('http://127.0.0.1:8000/readyz', timeout=5).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          # 实测 87.5 MiB（空载）/ 92.2 MiB（cgroup），2 MiB 级别的链路增量
          memory: 512M
    networks: [officeai-lite]
    logging: *default-logging

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      # R2-ARC-01（审计 2026-10-29）：lockroot 指向仓库根，供 Dockerfile 的
      # `COPY --from=lockroot package.json / package-lock.json` 取 workspaces 根
      # 布局。**三套编排都必须声明**——漏配会在解析 Dockerfile 时直接报
      # `invalid from flag value lockroot`，镜像产不出来。
      additional_contexts:
        lockroot: ..
      args:
        # ⚠ NEXT_PUBLIC_* 是**构建期**常量（Next.js 会把值内联进 bundle），
        # 运行期改环境变量无效。轻量版一律走**相对路径**（空串 → `/api/v1/...`），
        # 由 proxy 同源转发：这样镜像不绑域名，换 IP/换端口都不用重新构建，
        # 也不会把内网地址漏进前端产物。
        NEXT_PUBLIC_ADAPTER_BASE_URL: ""
        # 统一登录：公开接入信息（不含密钥），**构建期内联**进 bundle。
        # ⚠ 改完必须 `docker compose build web`（重新构建），`restart` 不生效。
        # 轻量版同样不接受空值——留空即登录入口不可达（登录页只显示「未配置」）。
        NEXT_PUBLIC_OIDC_ISSUER: ${OA_WEB_OIDC_ISSUER:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${OA_WEB_OIDC_CLIENT_ID:-}
    image: officeai/web:${OA_IMAGE_TAG:-1.0.0}
    container_name: oal-web
    restart: unless-stopped
    environment:
      # 仅为运维可读性保留；真正生效的是上面的构建期参数
      NEXT_PUBLIC_ADAPTER_BASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      adapter:
        condition: service_healthy
    healthcheck:
      # web 镜像是 alpine（实测有 busybox wget、没有 curl）
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          # 实测 41.0 MiB（Next.js standalone 运行期很小）
          memory: 384M
    networks: [officeai-lite]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 唯一入口（**只有它映射宿主端口**）
  # ---------------------------------------------------------------------
  proxy:
    # R2-ARC-14（2026-10-29）：1.29 是 **mainline（奇数分支，开发线）**，
    # 稳定线是 1.28 —— 改为 `1.28-alpine`（实测镜像内 nginx/1.28.3）。
    image: nginx:1.28-alpine
    container_name: oal-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # K4-min：与 full/saas 共用同一份边缘路由（多 /sso/、/realms/、/resources/ 三条）。
      # lite.conf 保留为历史参考；两套配置并存会漂移，故统一挂 edge.conf。
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      # G1：edge.conf 已升级为 TLS 变体（80 探活+301 / 443 终止），三套编排同一
      # 口径。证书外部挂载（deploy/gen-selfsigned-cert.sh 生成自签仅限验证）；
      # 若现场由前置负载均衡终止 TLS，本容器证书仅作内网/验证用，公网仍只开 443。
      - ./nginx/tls/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./nginx/tls/privkey.pem:/etc/nginx/tls/privkey.pem:ro
    ports:
      # G1：80 只做探活与 301 跳转，443 终止 TLS（此前"轻量版单 80"的明文口径作废）
      - "${OA_LITE_PROXY_PORT:-80}:80"
      - "${OA_LITE_PROXY_TLS_PORT:-443}:443"
    depends_on:
      adapter:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          # 实测 29.4 MiB；SSE 长连接会留一点缓冲
          memory: 128M
    networks: [officeai-lite]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 非常驻：Dify 控制台（profile `admin`，默认不起）
  #
  # 只在三种场景需要：① 首次填模型 provider 的 API Key ② 导入/升级 4 个档位应用
  # ③ 客户要自己改提示词。实测依据：本机标准栈连续运行 29 小时**从未启动
  # dify-web**，同期 M1 请求正常返回（baseline §1.2）。
  # 用法：docker compose -f deploy/docker-compose.lite.yml --profile admin up -d dify-web
  #      配完：docker compose -f deploy/docker-compose.lite.yml --profile admin down
  # ---------------------------------------------------------------------
  dify-web:
    image: langgenius/dify-web:1.17.1
    container_name: oal-dify-web
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      # 走 proxy 同源：控制台的 XHR 才能打到本栈 dify-api
      CONSOLE_API_URL: ${OA_LITE_PUBLIC_URL:-http://localhost}
      APP_API_URL: ${OA_LITE_PUBLIC_URL:-http://localhost}
      MARKETPLACE_API_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # 管理端口只用回环发布：它带完整控制台，绝不能被公网扫到
      - "127.0.0.1:${OA_LITE_DIFY_WEB_PORT:-3001}:3000"
    depends_on:
      dify-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [officeai-lite]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 非常驻：一次性迁移 Job（profile `migrate`）
  #
  # `docker compose -f deploy/docker-compose.lite.yml run --rm migrate`
  # （validate_lite_up.sh 会在 `up -d` **之前**执行它，升级脚本同理）
  #
  # 为什么单独一个服务，而不是让 adapter 启动时自动迁移：
  # 迁移要拿 advisory lock、要跑 DDL。放在 Web 启动路径上，多副本同时上线会
  # 互相等待、把启动探针拖超时；私有化现场就是"一个人在升级"，Job 更可控。
  # ---------------------------------------------------------------------
  migrate:
    image: officeai/adapter:${OA_IMAGE_TAG:-1.0.0}
    container_name: oal-migrate
    profiles: ["migrate"]
    restart: "no"
    # 镜像内**不带** deploy/ 目录（实测 /app 下只有 app / pyproject.toml / README.md），
    # 所以必须把 SQL 目录挂进来，并用 OA_DB_SQL_DIR 显式指路
    command: ["python", "-m", "app.db.migrate", "--apply"]
    env_file:
      - path: .env.lite
        required: false
    environment:
      OA_ENV: production
      OA_AUTH_MODE: oidc
      OA_DEPLOY_MODE: private
      # **迁移用属主/迁移角色 DSN，不是应用角色**（2026-11-04 修正）：
      # `CREATE TABLE` 需要 `public` 上的 CREATE 权限，而应用角色 officeai_app 是
      # NOSUPERUSER + NOBYPASSRLS 且无该权限（这是 RLS 隔离的前提）。用它跑 DDL
      # 只在"全新库"上侥幸通过（表已由 initdb 建好），一遇到"已装版本升级"就报
      # `permission denied for schema public` —— CI 路径 B（模拟真实升级）实测命中。
      # 运行期（adapter）仍用应用角色 DSN，两个角色分离是硬要求：
      # 不能靠"给应用角色授 CREATE"让迁移跑通，那会把 DDL 权限永久留给运行角色。
      OA_DATABASE_URL: postgresql://${OA_POSTGRES_USER:-officeai}:${OA_POSTGRES_PASSWORD:?必须在 .env.lite 中设置}@postgres:5432/${OA_POSTGRES_DB:-officeai}
      # 迁移 CLI 硬性要求业务库模式为 postgres，否则直接 30004 退出。
      # 这里显式给：env_file 是 required:false，缺文件时也得能起。
      OA_BUSINESS_STORE: postgres
      OA_DB_SQL_DIR: /app/deploy
      # 迁移由本 Job 的 command 触发，不靠启动期自动迁移
      OA_DB_AUTO_MIGRATE: "false"
    volumes:
      # 只读挂载：--apply 只读 SQL、写库；`--rollback` 的备份文件才需要写，
      # 而那是运维手工动作，不该由这个 Job 静默写宿主目录
      - ./:/app/deploy:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [officeai-lite]
    logging: *default-logging

# ===========================================================================
# 已知限制（容器预算固定 9 个的代价，**不是遗漏**）
#
#   1. **代码执行节点不可用**：不含 dify-sandbox（`CODE_EXECUTION_ENDPOINT` 不设）。
#      影响：Dify 工作流里的"代码执行"节点会报不可用。业务侧自研工具
#      （apps/adapter 的四个连接器）走适配层，不受影响。
#   2. **出站不走统一代理**：不含 ssrf_proxy。私有化的出站应由网络策略
#      （安全组/防火墙）控制——那才是这类部署真正的边界，而不是一个自维护容器。
#      若客户的知识库要抓 URL，加回 `--profile with-ssrf` 后再起（后续批次补）。
#   3. **Dify 控制台默认不启动**：`dify-web` 在 `profiles: [admin]` 下，
#      且只发布到 127.0.0.1（见该服务注释）。
#   4. **对象存储是本地卷**：多机部署不适用（轻量版本就是单机）。
#   5. **无 dify-worker-beat**：Dify 侧的历史清理不自动跑 → 运维手册"季度手工清理"。
#
# 以上 5 条同步写进 docs/phase4-batch-log.md 与部署手册（T4-05.6）。
# ===========================================================================

volumes:
  postgres-data:
  valkey-data:
  dify-storage:
  plugin-daemon-data:

networks:
  officeai-lite:
    driver: bridge
