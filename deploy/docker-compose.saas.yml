# SaaS 本地联调编排（DEPLOY_MODE=saas）
#
# 与私有化编排的差异（架构文档 1.3）：
#   - 租户隔离：PostgreSQL 行级安全策略（RLS）+ 应用层 tenant_id 双保险；
#   - 外网依赖：允许调用闭源模型 API（由适配层路由表配置）；
#   - 对外暴露：仅暴露 web 与 adapter，底座与基础设施不对公网暴露；
#   - 容量：本文件为单机联调用，真实生产走 K8s（deploy/k8s，S4）。
#
# 用法：docker compose -f docker-compose.saas.yml up -d
# ===========================================================================

name: officeai-saas

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: oa-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OA_POSTGRES_USER:-officeai}
      POSTGRES_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      POSTGRES_DB: ${OA_POSTGRES_DB:-officeai}
      LANG: C.UTF-8
    volumes:
      # PostgreSQL 18+ 镜像要求挂载到 /var/lib/postgresql（数据在 data/ 子目录），
      # 挂 /var/lib/postgresql/data 会被镜像入口拒绝启动（私有化编排已修，SaaS 漏改）
      - saas-postgres-data:/var/lib/postgresql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/00-init-databases.sql:ro
      # 历史文件 init-rls.sql 已停止挂载（M16，2026-10-23）：
      # 它建的是阶段一的旧租户策略，与阶段二的 p_tenant_isolation 会同时存在
      # （均为 permissive OR），导致两套部署产出的库结构不一致。
      # 保留文件作为历史存档，不再参与初始化。
      # 阶段二业务库表结构（D-02）：最后执行，统一重建 p_tenant_isolation 策略
      - ./init-schema-phase2.sql:/docker-entrypoint-initdb.d/20-init-schema-phase2.sql:ro
      # 阶段三业务库表结构（B17）：插件域 9 张表 + RLS 重声明 + 目录种子。
      # **必须排在 20-init-schema-phase2.sql 之后**：它依赖阶段二建好的 tenant 表
      # 与 p_tenant_isolation 体例，并把 plugin_catalog/plugin_version 并入共享分组。
      - ./init-schema-phase3.sql:/docker-entrypoint-initdb.d/22-init-schema-phase3.sql:ro
      # 阶段四：会话/消息表（迁移 0008 的入网落点）。必须在阶段三之后：
      # initdb 以超级用户执行，应用角色对 public 无 CREATE 权限，
      # 若只靠迁移建表，新装环境的第一次 --apply 会 permission denied。
      - ./init-schema-phase4.sql:/docker-entrypoint-initdb.d/30-init-schema-phase4.sql:ro
      # 应用连接角色（非超级用户）：排在 20- 之后（先有表才能授权）
      - ./init-app-role.sql:/docker-entrypoint-initdb.d/30-init-app-role.sql:ro
    networks: [officeai]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OA_POSTGRES_USER:-officeai}"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.2-alpine
    container_name: oa-saas-valkey
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      --maxmemory ${OA_VALKEY_MAXMEMORY:-4gb}
      --maxmemory-policy allkeys-lru
    volumes:
      - saas-valkey-data:/data
    networks: [officeai]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${OA_VALKEY_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.7.2
    container_name: oa-saas-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_DATA_DIR: /etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379
    volumes:
      - saas-etcd-data:/etcd
    networks: [officeai]
    logging: *default-logging

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.7.2
    container_name: oa-saas-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_DATA_DIR: /etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379
    volumes:
      - saas-milvus-etcd-data:/etcd
    networks: [officeai]
    logging: *default-logging

  # MinIO 锁定 AGPL 之前的版本线，独立容器运行（⚠️ D-06 待决）
  milvus-object-store:
    # S3 兼容对象存储（SeaweedFS，Apache-2.0 白名单协议，独立容器运行）
    #
    # 为何不用 MinIO：minio/minio 的 Docker Hub 仓库已整体下架（QA BLK-03 实测：
    # 任何 tag 拉取均返回 401），即使锁定 AGPL 之前的版本线也无法部署。
    # ⚠️ D-06 待决：对象存储最终选型需主理人与法务/合规确认
    image: chrislusf/seaweedfs:4.48
    container_name: oa-saas-milvus-object-store
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      AWS_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - saas-milvus-object-store-data:/data
    networks: [officeai]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8333/ || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5

  milvus:
    image: milvusdb/milvus:v3.0.3
    container_name: oa-saas-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-object-store:8333
      MINIO_REGION: ${OA_OBJECT_STORE_REGION:-us-east-1}
      MINIO_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      MINIO_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
    volumes:
      - saas-milvus-data:/var/lib/milvus
    ports:
      - "${OA_MILVUS_PORT:-19530}:19530"
    depends_on: [milvus-etcd, milvus-object-store]
    networks: [officeai]
    logging: *default-logging

  object-store:
    # 业务对象存储（文档原文件）：S3 兼容，独立容器运行
    # ⚠️ D-06 待决：最终选型需合规确认
    image: chrislusf/seaweedfs:4.48
    container_name: oa-saas-object-store
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      AWS_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - saas-object-store-data:/data
    ports:
      - "${OA_OBJECT_STORE_API_PORT:-8333}:8333"
      - "${OA_OBJECT_STORE_ADMIN_PORT:-23646}:23646"
    networks: [officeai]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8333/ || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5

  dify-api:
    image: langgenius/dify-api:1.17.1
    container_name: oa-saas-dify-api
    restart: unless-stopped
    environment:
      MODE: api
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env 中设置}
      CONSOLE_API_URL: http://dify-api:5001
      CONSOLE_WEB_URL: http://dify-web:3000
      SERVICE_API_URL: http://dify-api:5001
      APP_API_URL: http://dify-api:5001
      FILES_URL: http://dify-api:5001
      MIGRATION_ENABLED: "true"
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${OA_DIFY_DB:-dify}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      REDIS_DB: "0"
      CELERY_BROKER_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: s3
      OPENDAL_S3_ENDPOINT: http://object-store:8333
      OPENDAL_S3_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      OPENDAL_S3_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
      OPENDAL_S3_BUCKET: ${OA_DIFY_S3_BUCKET:-dify}
      OPENDAL_S3_REGION: ${OA_OBJECT_STORE_REGION:-us-east-1}
      VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
      SSRF_PROXY_HTTP_URL: ${OA_SSRF_PROXY_URL:-http://ssrf_proxy:3128}
      SSRF_PROXY_HTTPS_URL: ${OA_SSRF_PROXY_URL:-http://ssrf_proxy:3128}
      PLUGIN_DAEMON_URL: ${OA_PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
      # 审计 OA-AUDIT-001 / P0-3：移除明文兜底，缺失即拒绝启动（同私有化编排）
      PLUGIN_DAEMON_KEY: ${OA_PLUGIN_DAEMON_KEY:?必须在 .env 中设置}
      PLUGIN_DIFY_INNER_API_URL: http://dify-api:5001
      PLUGIN_DIFY_INNER_API_KEY: ${OA_PLUGIN_INNER_API_KEY:?必须在 .env 中设置}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [officeai]
    logging: *default-logging

  dify-worker:
    image: langgenius/dify-api:1.17.1
    container_name: oa-saas-dify-worker
    restart: unless-stopped
    environment:
      MODE: worker
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env 中设置}
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${OA_DIFY_DB:-dify}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      CELERY_BROKER_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: s3
      OPENDAL_S3_ENDPOINT: http://object-store:8333
      OPENDAL_S3_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      OPENDAL_S3_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
      OPENDAL_S3_BUCKET: ${OA_DIFY_S3_BUCKET:-dify}
      OPENDAL_S3_REGION: ${OA_OBJECT_STORE_REGION:-us-east-1}
      VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
    depends_on: [postgres, valkey]
    networks: [officeai]
    logging: *default-logging

  dify-web:
    image: langgenius/dify-web:1.17.1
    container_name: oa-saas-dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on: [dify-api]
    networks: [officeai]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 底座层：插件守护进程 + 代码沙箱（Dify 1.17 模型提供方管理与代码执行必需）
  # 2026-10-21 补齐：SaaS 编排此前遗漏 INF-07 修复，与私有化编排对齐
  # ---------------------------------------------------------------------
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    container_name: oa-saas-plugin-daemon
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env 中设置}
      DEPLOY_ENV: PRODUCTION
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dify_plugin
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      REDIS_DB: "2"
      SERVER_PORT: "5002"
      SERVER_KEY: ${OA_PLUGIN_DAEMON_KEY:?必须在 .env 中设置}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${OA_PLUGIN_INNER_API_KEY:?必须在 .env 中设置}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: "false"
    volumes:
      - saas-plugin-daemon-data:/app/storage
    networks: [officeai]
    logging: *default-logging

  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.15
    container_name: oa-saas-dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: ${OA_DIFY_SANDBOX_KEY:?必须在 .env 中设置}
      WORKER_TIMEOUT: "15"
      ENABLE_NETWORK: "true"
      SSRF_PROXY_HTTP_URL: ${OA_SSRF_PROXY_URL:-http://ssrf_proxy:3128}
      SSRF_PROXY_HTTPS_URL: ${OA_SSRF_PROXY_URL:-http://ssrf_proxy:3128}
    networks: [officeai]
    logging: *default-logging

  ssrf_proxy:
    image: ubuntu/squid:6.13-25.04_beta
    container_name: oa-saas-ssrf-proxy
    restart: unless-stopped
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks: [officeai]
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: oa-saas-keycloak
    restart: unless-stopped
    command: ["start", "--http-enabled=true", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${OA_KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      KC_DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      KC_HOSTNAME_STRICT: "false"
      # Keycloak 26 起 KEYCLOAK_ADMIN/PASSWORD 已移除，改用 KC_BOOTSTRAP_ADMIN_*
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OA_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OA_KEYCLOAK_ADMIN_PASSWORD:?必须在 .env 中设置}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [officeai]
    logging: *default-logging

  adapter:
    build:
      context: ../apps/adapter
      dockerfile: Dockerfile
    image: officeai/adapter:${OA_IMAGE_TAG:-1.0.0}
    container_name: oa-saas-adapter
    restart: unless-stopped
    healthcheck:
      # 就绪探针必须打 /readyz（不是 /healthz）：它同时校验业务库连通性与
      # **数据库权限自检**（连接账号带 BYPASSRLS 时行级安全策略形同虚设）
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u, sys;
          sys.exit(0 if u.urlopen('http://127.0.0.1:8000/readyz', timeout=5).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    env_file:
      - .env
    environment:
      # 环境名与鉴权模式都从 .env 取值：缺省按生产 + OIDC 处理。
      # **不再依赖代码默认值**（auth_mode 默认 stub = 不验签，S1）。
      OA_ENV: ${OA_ENV:-production}
      OA_AUTH_MODE: ${OA_AUTH_MODE:-oidc}
      OA_DEPLOY_MODE: saas
      OA_OFFLINE_MODE: "false"
      OA_DIFY_BASE_URL: http://dify-api:5001
      OA_KEYCLOAK_URL: http://keycloak:8080
      OA_REDIS_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/0
      # SaaS 同样必须使用 officeai_app（NOSUPERUSER + NOBYPASSRLS）：
      # 此前写死 ${OA_POSTGRES_USER}（库属主/超级用户），RLS 对该角色永久失效，
      # 等于把多租户隔离关掉。缺失即拒绝启动，不回落超级用户（S6，2026-10-23）。
      OA_DATABASE_URL: ${OA_DATABASE_URL:?SaaS 必须提供应用角色 DSN（officeai_app），不得使用库属主}
      OA_MILVUS_URI: http://milvus:19530
      OA_OBJECT_STORE_ENDPOINT: http://object-store:8333
      # SaaS 模式：允许调用外部闭源模型 API（路由表见 registry/profile_routes.yaml）
      OA_DOWNSTREAM_ENABLED: "true"
    ports:
      - "${OA_ADAPTER_PORT:-8000}:8000"
    depends_on:
      valkey:
        condition: service_healthy
    networks: [officeai]
    logging: *default-logging

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADAPTER_BASE_URL: ${OA_WEB_ADAPTER_BASE_URL:-http://localhost:8000}
    image: officeai/web:${OA_IMAGE_TAG:-1.0.0}
    container_name: oa-saas-web
    restart: unless-stopped
    ports:
      - "${OA_WEB_PORT:-3000}:3000"
    depends_on: [adapter]
    networks: [officeai]
    logging: *default-logging

volumes:
  saas-postgres-data:
  saas-valkey-data:
  saas-etcd-data:
  saas-milvus-etcd-data:
  saas-milvus-object-store-data:
  saas-milvus-data:
  saas-object-store-data:
  saas-plugin-daemon-data:

networks:
  officeai:
    driver: bridge
