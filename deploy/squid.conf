# ===========================================================================
# 出站代理配置（SSRF 防护）
#
# 用途（架构文档 3.6 / 5.2）：
#   - 私有化模式禁止底座访问内网与本机地址，防止 SSRF；
#   - 私有化模式禁止任何外网请求，纯本地运行。
#
# 白名单策略：仅允许容器网络段与镜像仓库，其余一律拒绝。
# SaaS 模式下由编排层改为允许外部模型 API 域名。
# ===========================================================================

# 监听端口（2026-10-21 实跑修复：原配置缺少 http_port，
# squid 以「No forward-proxy ports configured」FATAL 退出，
# ssrf_proxy 容器无限重启）
http_port 3128

acl localnet src 0.0.0.1-0.255.255.255
acl localnet src 10.0.0.0-10.255.255.255
acl localnet src 100.64.0.0-100.127.255.255
acl localnet src 127.0.0.0-127.255.255.255
acl localnet src 169.254.0.0-169.254.255.255
acl localnet src 172.16.0.0-172.31.255.255
acl localnet src 192.168.0.0-192.168.255.255
acl localnet src fc00::/7
acl localnet src fe80::/10

# 允许容器网络内部访问（底座、数据库、对象存储等）
acl localnet src 172.16.0.0/12

# 内网与本机地址一律拒绝（防 SSRF）
acl deny_localnet dst 0.0.0.1-0.255.255.255
acl deny_localnet dst 10.0.0.0-10.255.255.255
acl deny_localnet dst 100.64.0.0-100.127.255.255
acl deny_localnet dst 127.0.0.0-127.255.255.255
acl deny_localnet dst 169.254.0.0-169.254.255.255
acl deny_localnet dst 172.16.0.0-172.31.255.255
acl deny_localnet dst 192.168.0.0-192.168.255.255
acl deny_localnet dst ::1/128
acl deny_localnet dst fe80::/10
acl deny_localnet dst fc00::/7

# 出站策略（squid 规则顺序即优先级）：
#   1. 先挡 SSRF 敏感目标（云元数据 169.254.169.254、环回、其他内网段），
#      与来源无关——沙箱与工具调用不得借代理触达内网；
#   2. 再放行容器网络内的合法使用方；
#   3. 私有化模式最后拒绝一切外网（纯本地运行，总方案 3.6）。
http_access deny deny_localnet
http_access allow localnet
http_access deny all
