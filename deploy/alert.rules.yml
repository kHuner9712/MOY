# ===========================================================================
# 告警规则（阶段四 T4-05.2，架构 §8.4；H-01 补齐 2026-11-07）
#
# 10 条。前 5 条表达式**逐字取自架构 §8.4**（不改写、不"优化"）：
#   ApiErrorRateHigh      —— 5xx 占比 > 5%（2m 窗口 + for 2m ≈ 4 分钟才 firing）
#   ApiLatencyP95High     —— P95 > 3s（**排除流式路由**：流式时长取决于回答长度，
#                            把它算进 P95 会让告警永远在响）
#   TaskQueueBacklog      —— 排队深度 > 50
#   TenantBudgetNearlyLimit —— 租户预算使用比例 > 0.8（仅私有化模式注册该指标）
#   TargetDown            —— 任一抓取目标失联
#
# H-01 补齐的 5 条（审计要求「至少覆盖」的缺口）：
#   PgConnectionSaturation        —— PG 连接数 / max_connections > 80%
#   ArtifactAccessFailureHigh     —— 产物导出/预览路由 5xx 占比 > 5%
#   EdgeCertificateExpiringSoon   —— 边缘证书 < 30 天（warning）
#   EdgeCertificateExpiringCritical —— 边缘证书 < 7 天（critical）
#   EdgeProbeFailing              —— blackbox 探针失败（证书指标随之不可信）
#
# ⚠ **`ApiErrorRateHigh` 的"2 分钟"是 PRD 的笔误**：2m 窗口 + `for 2m` 实际约 4 分钟
#   才 firing。判据以"4 分钟内 firing"或"注入 30 次 5xx"为准——**不要为了对齐 2 分钟
#   去改表达式**：改窗口会让偶发抖动频繁误报，改 `for` 会让真故障晚发现。
#
# 可达性：本文件由 `deploy/prometheus.yml` 的 `rule_files` 加载，Prometheus 的
# `alerting.alertmanagers` 指向 compose 的 `alertmanager:9093`（H-01）。
# `promtool check rules` 是 CI 硬门禁（`.github/workflows/ci-adapter.yml`）。
# ===========================================================================

groups:
  - name: officeai-api
    rules:
      - alert: ApiErrorRateHigh
        expr: >-
          sum(rate(http_requests_total{status=~"5.."}[2m]))
          / clamp_min(sum(rate(http_requests_total[2m])), 0.001) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "接口 5xx 占比超过 5%"
          description: "近 2 分钟 5xx 占比 > 5%（含 1 分钟评价窗口，实际约 4 分钟触发）。"

      - alert: ApiLatencyP95High
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{route!~".*stream.*"}[5m]))
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "接口 P95 延迟超过 3 秒"
          description: "已排除流式路由（流式耗时取决于回答长度，纳入会长期误报）。"

      - alert: ArtifactAccessFailureHigh
        # H-01：产物导出 / 在线预览是交付主链路的末端，失败时用户拿到的是空文件或
        # 打不开的页面。只统计这两条路由，不与全站 5xx 混在一起（后者已被
        # ApiErrorRateHigh 覆盖，重复告警只会制造噪音）。
        expr: >-
          sum(rate(http_requests_total{route=~"/files/artifacts/{token}/(export|preview)",status=~"5.."}[5m]))
          / clamp_min(
              sum(rate(http_requests_total{route=~"/files/artifacts/{token}/(export|preview)"}[5m])),
              0.001
            ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "产物导出/预览失败率超过 5%"
          description: "近 5 分钟 `/files/artifacts/{token}/export|preview` 的 5xx 占比 > 5%：检查 LibreOffice 转换、产物存储与磁盘水位。"

  - name: officeai-capacity
    rules:
      - alert: TaskQueueBacklog
        expr: task_queue_depth > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "后台任务积压超过 50"
          description: "队列深度持续 5 分钟 > 50：检查 JobRunner 是否在跑、是否有任务卡住租约。"

      - alert: PgConnectionSaturation
        # H-01：连接耗尽是"服务整体失能"的前兆——应用拿不到连接时所有请求都会
        # 卡在池排队，HTTP 层却还可能是 200。按实例比较，避免把多实例的分子分母
        # 混算成"看起来很低"。
        expr: >-
          sum by (instance) (pg_stat_database_numbackends)
          / clamp_min(max by (instance) (pg_settings_max_connections), 1) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 连接数已用超过 80%"
          description: "`pg_stat_database_numbackends` 已达到 `max_connections` 的 80%（实例见 `instance` 标签）：检查连接池配置与是否有连接泄漏。"

      - alert: TenantBudgetNearlyLimit
        expr: tenant_budget_used_ratio > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "租户月度预算已用超 80%"
          description: "仅私有化模式注册该指标；SaaS 下按租户预算看板人工跟进。"

  - name: officeai-availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "抓取目标失联"
          description: "{{ $labels.job }} / {{ $labels.instance }} 连续 2 分钟抓取失败。"

      - alert: EdgeProbeFailing
        # H-01：blackbox 自身 `up` 正常不代表探针成功（目标不可达时 up 仍是 1）。
        # 探针失败时 `probe_ssl_earliest_cert_expiry` 不可信，证书告警会静默失明，
        # 因此单独告警，不能只靠 TargetDown。
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "边缘 TLS 探针失败"
          description: "`blackbox-exporter` 无法完成对 `https://edge/healthz` 的探测（证书指标随之不可信）：检查 edge 容器与 443 端口。"

      - alert: EdgeCertificateExpiringSoon
        # H-01：30 天预警留出换证与灰度窗口；证书过期后浏览器与统一登录回调
        # 都会直接失败，且属于"可以提前 30 天完全避免"的故障。
        expr: probe_ssl_earliest_cert_expiry - time() < 30 * 24 * 3600 and probe_success == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "边缘 TLS 证书将在 30 天内到期"
          description: "`probe_ssl_earliest_cert_expiry` 距当前不足 30 天：请换发并覆盖 `deploy/nginx/tls/{fullchain,privkey}.pem`。"

      - alert: EdgeCertificateExpiringCritical
        expr: probe_ssl_earliest_cert_expiry - time() < 7 * 24 * 3600 and probe_success == 1
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "边缘 TLS 证书将在 7 天内到期"
          description: "距证书到期不足 7 天：立即换证；过期后统一登录与全部 HTTPS 入口会不可用。"
