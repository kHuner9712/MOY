# ===========================================================================
# 基础设施镜像锁文件 —— 唯一事实来源（ADR-0002 §2.4）
#
# 规则（强制）：
#   1. `docker-compose*.yml` 中出现的每个 `image:` 引用**必须**能在本清单中找到
#      `name:tag` 精确匹配项，否则 CI 红灯；
#   2. 每个 tag 必须**经上游存在性核验**（Registry API / git ls-remote）；
#   3. 禁止 `latest` 等浮动标签；
#   4. 禁止任何**合成标签**——即「日期取自 A 标签、时间戳取自 B 标签」的拼接产物。
#      教训（NEW-P0）：`RELEASE.2021-04-22T23-11-00Z` 即为此类拼接，
#      上游从不存在，导致私有化部署直接拉取失败。
#
# 维护动作：新增/升级镜像必须先在此登记 + 核验上游存在，再改编排文件。
# ===========================================================================

version: 1

images:
  # ---------------------------------------------------------------------
  # 底座层（Dify，Apache-2.0 修改版）
  #
  # ⚠️ 协议事实（QA 附录 A P1-2 实测）：Dify LICENSE 为 Apache-2.0 修改版，
  #    附带「多租户特性限制」与「商标/LOGO 限制」。三条规避约束已拍板
  #    （docs/decisions/0004 第三章）：
  #    1. SaaS 禁用 Dify 多租户特性 —— 租户隔离由自研适配层 + Postgres RLS 实现；
  #    2. 不修改 Dify 代码（附加限制只对修改后分发与多租户使用生效）；
  #    3. 不展示 Dify 品牌标识（前端黑盒化 + 开源声明如实列明）。
  # ---------------------------------------------------------------------
  - name: langgenius/dify-api
    tag: "1.0.0"
    license: Apache-2.0（修改版：多租户与商标限制，见上方说明）
    role: 底座 API 与 Worker
    source: docker-hub

  - name: langgenius/dify-web
    tag: "1.0.0"
    license: Apache-2.0（修改版：多租户与商标限制，见上方说明）
    role: 底座控制台
    source: docker-hub

  - name: langgenius/dify-sandbox
    tag: "0.2.10"
    license: Apache-2.0（修改版：多租户与商标限制，见上方说明）
    role: 代码沙箱
    source: docker-hub

  # ---------------------------------------------------------------------
  # 业务能力层
  # ---------------------------------------------------------------------
  - name: quay.io/keycloak/keycloak
    tag: "25.0.6"
    license: Apache-2.0
    role: 身份与权限
    source: quay

  # ---------------------------------------------------------------------
  # 基础设施层
  # ---------------------------------------------------------------------
  - name: postgres
    tag: "16-alpine"
    license: PostgreSQL-License
    role: 关系库
    source: docker-hub

  # Valkey 取代 Redis（BSD-3-Clause），规避 RSALv2/SSPL 双许可风险
  # ✅ D-06 已于 2026-10-21 由创始人授权主理人正式批准（docs/decisions/0004）
  - name: valkey/valkey
    tag: "7.2-alpine"
    license: BSD-3-Clause
    role: 缓存与幂等键
    source: docker-hub
    note: D-06 已批准；若改回 Redis 须保持独立进程运行

  - name: milvusdb/milvus
    tag: "v2.4.6"
    license: Apache-2.0
    role: 向量库
    source: docker-hub

  - name: quay.io/coreos/etcd
    tag: "v3.5.16"
    license: Apache-2.0
    role: 分布式 KV（Milvus 依赖）
    source: quay

  # S3 兼容对象存储（SeaweedFS）
  #
  # 为何不用 MinIO（实测结论，勿轻易回退）：
  #   1. minio/minio 的 Docker Hub 仓库已**整体下架**——按真实 pull 路径
  #      （auth.docker.io 取 token → registry-1.docker.io 取 manifest）实测，
  #      任意 tag（含 AGPL 前的 RELEASE.2021-04-22T15-44-28Z）均返回 HTTP 401；
  #      对照组 library/postgres:16-alpine 同法返回 200，证实探测方法有效；
  #   2. 即便锁定 AGPL 之前的版本线，镜像也**拉不下来**，私有化部署直接失败；
  #   3. SeaweedFS 提供等价 S3 兼容接口，协议为 **Apache-2.0**（白名单），
  #      且上游持续分发，Docker Hub 实测可拉取。
  #
  # ✅ D-06 已于 2026-10-21 由创始人授权主理人正式批准（docs/decisions/0004）
  - name: chrislusf/seaweedfs
    tag: "3.80"
    license: Apache-2.0
    role: S3 兼容对象存储（Milvus 依赖 + 业务对象存储）
    source: docker-hub
    note: 替代已下架的 minio/minio；Apache-2.0 白名单协议，独立容器运行

  # ---------------------------------------------------------------------
  # 网络与监控
  # ---------------------------------------------------------------------
  # squid 为 GPL-2.0，按灰名单规则「仅可独立进程调用、不可引入核心代码」处理
  # 原引用 squidly/squid:5.2 —— 实测该仓库在 Docker Hub 不存在（连 latest 均 404），
  # 已更换为 Canonical 官方维护的 ubuntu/squid（squid 5.2 / Ubuntu 22.04）
  - name: ubuntu/squid
    tag: "5.2-22.04_beta"
    license: GPL-2.0
    role: 出站代理（SSRF 防护）
    source: docker-hub
    note: 灰名单，仅独立进程调用；标签已核验存在（HTTP 200）

  - name: prom/prometheus
    tag: "v2.54.0"
    license: Apache-2.0
    role: 指标采集
    source: docker-hub

  # Grafana 已于 V1.0 移除（2026-10-21 拍板，docs/decisions/0004 第二章）：
  # grafana/grafana 自 8.0 起为 AGPL-3.0，AGPL 前的 7.5.x 版本线在
  # Docker Hub 已不存在（实测 7.5.31/32/33 均 404），锁版本线路径不可行；
  # 可视化看板不属 V1.0 验收项，V1.1 再评估 Perses（Apache-2.0）等替代。

  # ---------------------------------------------------------------------
  # 自研层（本地构建，不从上游拉取）
  #
  # 门禁说明：自研镜像由 `apps/*/Dockerfile` 本地构建，
  # 上游不存在可比对的 tag，故 `source: local`，门禁跳过其存在性核验
  # （只校验「compose 引用 ⊆ lock 登记」这一条）。
  # ---------------------------------------------------------------------
  - name: officeai/adapter
    tag: "1.0.0"
    license: UNLICENSED
    role: 自研统一适配层
    source: local
    note: 本地构建，版本由 OA_IMAGE_TAG 控制

  - name: officeai/web
    tag: "1.0.0"
    license: UNLICENSED
    role: 前端交互层
    source: local
    note: 本地构建，版本由 OA_IMAGE_TAG 控制
