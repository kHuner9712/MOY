# ===========================================================================
# 基础设施镜像锁文件 —— 唯一事实来源（ADR-0002 §2.4）
#
# 规则（强制）：
#   1. `docker-compose*.yml` 中出现的每个 `image:` 引用**必须**能在本清单中找到
#      `name:tag` 精确匹配项，否则 CI 红灯；
#   2. 每个 tag 必须**经上游存在性核验**（Registry API / git ls-remote）；
#   3. 禁止 `latest` 等浮动标签；
#   4. 禁止任何**合成标签**——即「日期取自 A 标签、时间戳取自 B 标签」的拼接产物。
#      教训（NEW-P0）：`RELEASE.2021-04-22T23-11-00Z` 即为此类拼接，
#      上游从不存在，导致私有化部署直接拉取失败。
#
# 维护动作：新增/升级镜像必须先在此登记 + 核验上游存在，再改编排文件。
# ===========================================================================

version: 1

images:
  # ---------------------------------------------------------------------
  # 底座层（Dify，Apache-2.0）
  # ---------------------------------------------------------------------
  - name: langgenius/dify-api
    tag: "1.0.0"
    license: Apache-2.0
    role: 底座 API 与 Worker
    source: docker-hub

  - name: langgenius/dify-web
    tag: "1.0.0"
    license: Apache-2.0
    role: 底座控制台
    source: docker-hub

  - name: langgenius/dify-sandbox
    tag: "0.2.10"
    license: Apache-2.0
    role: 代码沙箱
    source: docker-hub

  # ---------------------------------------------------------------------
  # 业务能力层
  # ---------------------------------------------------------------------
  - name: quay.io/keycloak/keycloak
    tag: "25.0.6"
    license: Apache-2.0
    role: 身份与权限
    source: quay

  # ---------------------------------------------------------------------
  # 基础设施层
  # ---------------------------------------------------------------------
  - name: postgres
    tag: "16-alpine"
    license: PostgreSQL-License
    role: 关系库
    source: docker-hub

  # Valkey 取代 Redis（BSD-3-Clause），规避 RSALv2/SSPL 双许可风险
  # ⚠️ D-06 待决：最终选型需主理人与法务/合规确认
  - name: valkey/valkey
    tag: "7.2-alpine"
    license: BSD-3-Clause
    role: 缓存与幂等键
    source: docker-hub
    note: D-06 待决；若改回 Redis 须保持独立进程运行

  - name: milvusdb/milvus
    tag: "v2.4.6"
    license: Apache-2.0
    role: 向量库
    source: docker-hub

  - name: quay.io/coreos/etcd
    tag: "v3.5.16"
    license: Apache-2.0
    role: 分布式 KV（Milvus 依赖）
    source: quay

  # MinIO 锁定 AGPL 之前的最后版本线（Apache-2.0），独立容器运行
  # 已核验：git ls-remote --tags https://github.com/minio/minio.git
  #   → refs/tags/RELEASE.2021-04-22T15-44-28Z（存在）
  #   → raw.githubusercontent.com/minio/minio/<tag>/LICENSE 首行为 Apache License 2.0
  # 上游自 RELEASE.2021-05-11T23-27-41Z 起转为 AGPL-3.0，故 04-22 为最后可用版本线
  # ⚠️ D-06 待决：版本线与独立进程方式需合规确认
  - name: minio/minio
    tag: "RELEASE.2021-04-22T15-44-28Z"
    license: Apache-2.0
    role: 对象存储（Milvus 依赖 + 业务对象存储）
    source: docker-hub
    note: AGPL 前的最后版本线，独立容器运行；上游自 2021-05-11 起为 AGPL-3.0

  # ---------------------------------------------------------------------
  # 网络与监控
  # ---------------------------------------------------------------------
  # squid 为 GPL-2.0，按灰名单规则「仅可独立进程调用、不可引入核心代码」处理
  - name: squidly/squid
    tag: "5.2"
    license: GPL-2.0
    role: 出站代理（SSRF 防护）
    source: docker-hub
    note: 灰名单，仅独立进程调用；如需收紧可替换为 ubuntu/squid

  - name: prom/prometheus
    tag: "v2.54.0"
    license: Apache-2.0
    role: 指标采集
    source: docker-hub

  - name: grafana/grafana
    tag: "11.1.0"
    license: Apache-2.0
    role: 监控看板
    source: docker-hub

  # ---------------------------------------------------------------------
  # 自研层（本地构建，不从上游拉取）
  #
  # 门禁说明：自研镜像由 `apps/*/Dockerfile` 本地构建，
  # 上游不存在可比对的 tag，故 `source: local`，门禁跳过其存在性核验
  # （只校验「compose 引用 ⊆ lock 登记」这一条）。
  # ---------------------------------------------------------------------
  - name: officeai/adapter
    tag: "1.0.0"
    license: UNLICENSED
    role: 自研统一适配层
    source: local
    note: 本地构建，版本由 OA_IMAGE_TAG 控制

  - name: officeai/web
    tag: "1.0.0"
    license: UNLICENSED
    role: 前端交互层
    source: local
    note: 本地构建，版本由 OA_IMAGE_TAG 控制
