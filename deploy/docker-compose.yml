# ===========================================================================
# 私有化一键部署编排（DEPLOY_MODE=private）
#
# 组成：
#   - 底座层：dify-api / dify-worker / dify-web（Dify Apache-2.0）
#   - 业务能力层：keycloak（身份与权限）
#   - 基础设施层：postgres / valkey / milvus / seaweedfs / etcd
#   - 自研层：adapter（统一适配层）/ web（前端交互层）
#
# 合规说明（总方案 5.3 / 架构文档 2.1）：
#   - Redis 使用 **Valkey**（BSD-3-Clause）。原 Redis 7 为 RSALv2/SSPL 双许可，
#     按灰名单规则「仅独立进程调用」处理；此处直接选用 Valkey 以规避协议风险。
#     ⚠️ 待决项 D-06：Redis 与 Valkey 的最终选型需主理人与法务/合规确认。
#   - MinIO 锁定 **AGPL 之前的版本线**（RELEASE.2021-04-22 系列，Apache-2.0），
#     并以**独立容器**方式运行，不引入其代码到核心代码库。
#     ⚠️ 待决项 D-06：MinIO 版本线与运行方式的最终方案需合规确认。
#   - 其余组件协议：PostgreSQL（类 BSD/MIT）、Milvus（Apache-2.0）、
#     Keycloak（Apache-2.0）、Dify（Apache-2.0）。
#
# 离线支持：OA_OFFLINE_MODE=true 时所有镜像从本地离线包加载（deploy/offline/images）。
# ===========================================================================

name: officeai-private

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------
  # 基础设施层
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: oa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OA_POSTGRES_USER:-officeai}
      POSTGRES_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      POSTGRES_DB: ${OA_POSTGRES_DB:-officeai}
      # 中文排序与大小写不敏感检索
      LANG: C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [officeai]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OA_POSTGRES_USER:-officeai}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis 的 BSD-3 替代实现（⚠️ D-06 待决）
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: oa-valkey
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      --maxmemory ${OA_VALKEY_MAXMEMORY:-2gb}
      --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data
    networks: [officeai]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${OA_VALKEY_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: oa-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    networks: [officeai]
    logging: *default-logging

  milvus-object-store:
    # S3 兼容对象存储（SeaweedFS，Apache-2.0 白名单协议，独立容器运行）
    #
    # 为何不用 MinIO：minio/minio 的 Docker Hub 仓库已整体下架（QA BLK-03 实测：
    # 任何 tag 拉取均返回 401），即使锁定 AGPL 之前的版本线也无法部署；
    # 且其 S3 网关 API 与 MinIO 有差异。SeaweedFS 提供等价 S3 兼容接口，
    # 协议为 Apache-2.0，属总方案 5.3 白名单，且上游持续分发。
    # ⚠️ D-06 待决：对象存储最终选型需主理人与法务/合规确认
    image: chrislusf/seaweedfs:3.80
    container_name: oa-milvus-object-store
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      AWS_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - milvus-object-store-data:/data
    networks: [officeai]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8333/ || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: oa-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_DATA_DIR: /etcd
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
    volumes:
      - milvus-etcd-data:/etcd
    networks: [officeai]
    logging: *default-logging

  milvus:
    image: milvusdb/milvus:v2.4.6
    container_name: oa-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-object-store:8333
      MINIO_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      MINIO_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "${OA_MILVUS_PORT:-19530}:19530"
      - "${OA_MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      - milvus-etcd
      - milvus-object-store
    networks: [officeai]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 3

  # 业务对象存储（文档原文件）：S3 兼容，独立容器运行
  # ⚠️ D-06 待决：最终选型需合规确认
  object-store:
    image: chrislusf/seaweedfs:3.80
    container_name: oa-object-store
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      AWS_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - object-store-data:/data
    ports:
      - "${OA_OBJECT_STORE_API_PORT:-8333}:8333"
      - "${OA_OBJECT_STORE_ADMIN_PORT:-23646}:23646"
    networks: [officeai]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8333/ || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5

  # ---------------------------------------------------------------------
  # 底座层（Dify，Apache-2.0）
  # 说明：底座仅对适配层可见；不对外暴露端口，由内部网络访问。
  # ---------------------------------------------------------------------
  dify-api:
    image: langgenius/dify-api:1.0.0
    container_name: oa-dify-api
    restart: unless-stopped
    environment:
      MODE: ${OA_DIFY_MODE:-api}
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env 中设置}
      CONSOLE_API_URL: http://dify-api:5001
      CONSOLE_WEB_URL: http://dify-web:3000
      SERVICE_API_URL: http://dify-api:5001
      APP_API_URL: http://dify-api:5001
      APP_WEB_URL: http://dify-web:3000
      FILES_URL: http://dify-api:5001
      MIGRATION_ENABLED: "true"
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${OA_DIFY_DB:-dify}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      REDIS_DB: "0"
      CELERY_BROKER_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: s3
      OPENDAL_S3_ENDPOINT: http://object-store:8333
      OPENDAL_S3_ACCESS_KEY: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      OPENDAL_S3_SECRET_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
      OPENDAL_S3_BUCKET: ${OA_DIFY_S3_BUCKET:-dify}
      VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${OA_DIFY_SANDBOX_KEY:?必须在 .env 中设置}
      # 私有化模式：禁止任何外网回调
      CONSOLE_CORS_ALLOW_ORIGINS: "*"
      SSRF_PROXY_HTTP_URL: ${OA_SSRF_PROXY_URL:-http://ssrf_proxy:3128}
      SSRF_PROXY_HTTPS_URL: ${OA_SSRF_PROXY_URL:-http://ssrf_proxy:3128}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [officeai]
    logging: *default-logging

  dify-worker:
    image: langgenius/dify-api:1.0.0
    container_name: oa-dify-worker
    restart: unless-stopped
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env 中设置}
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${OA_DIFY_DB:-dify}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      CELERY_BROKER_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: s3
      OPENDAL_S3_ENDPOINT: http://object-store:8333
      OPENDAL_S3_ACCESS_KEY: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      OPENDAL_S3_SECRET_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
      VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
    depends_on:
      - postgres
      - valkey
    networks: [officeai]
    logging: *default-logging

  dify-web:
    image: langgenius/dify-web:1.0.0
    container_name: oa-dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      MARKETPLACE_API_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - dify-api
    networks: [officeai]
    logging: *default-logging

  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.10
    container_name: oa-dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: ${OA_DIFY_SANDBOX_KEY:?必须在 .env 中设置}
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
    networks: [officeai]
    logging: *default-logging

  ssrf_proxy:
    image: ubuntu/squid:5.2-22.04_beta
    container_name: oa-ssrf-proxy
    restart: unless-stopped
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks: [officeai]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 业务能力层：身份与权限（Keycloak，Apache-2.0）
  # ---------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: oa-keycloak
    restart: unless-stopped
    command: ["start", "--optimized", "--http-enabled=true", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${OA_KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      KC_DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${OA_KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${OA_KEYCLOAK_ADMIN_PASSWORD:?必须在 .env 中设置}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [officeai]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 自研层：统一适配层（唯一允许接触底座的应用）
  # ---------------------------------------------------------------------
  adapter:
    build:
      context: ../apps/adapter
      dockerfile: Dockerfile
    image: officeai/adapter:${OA_IMAGE_TAG:-1.0.0}
    container_name: oa-adapter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OA_ENV: production
      OA_DEPLOY_MODE: private
      OA_OFFLINE_MODE: ${OA_OFFLINE_MODE:-true}
      OA_API_PREFIX: /api/v1
      # 底座地址：仅适配层可见，不对外暴露
      OA_DIFY_BASE_URL: http://dify-api:5001
      OA_KEYCLOAK_URL: http://keycloak:8080
      OA_REDIS_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/0
      OA_DATABASE_URL: postgresql+asyncpg://${OA_POSTGRES_USER:-officeai}:${OA_POSTGRES_PASSWORD}@postgres:5432/${OA_POSTGRES_DB:-officeai}
      OA_MILVUS_URI: http://milvus:19530
      OA_OBJECT_STORE_ENDPOINT: http://object-store:8333
    ports:
      - "${OA_ADAPTER_PORT:-8000}:8000"
    depends_on:
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [officeai]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 自研层：前端交互层
  # ---------------------------------------------------------------------
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADAPTER_BASE_URL: ${OA_WEB_ADAPTER_BASE_URL:-http://localhost:8000}
    image: officeai/web:${OA_IMAGE_TAG:-1.0.0}
    container_name: oa-web
    restart: unless-stopped
    ports:
      - "${OA_WEB_PORT:-3000}:3000"
    depends_on:
      - adapter
    networks: [officeai]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 监控告警（Prometheus，Apache-2.0）
  #
  # Grafana 已于 V1.0 移除（2026-10-21 拍板，见 docs/decisions/0004）：
  # grafana/grafana 自 8.0 起为 AGPL-3.0，且 AGPL 前的 7.5.x 版本线
  # 在 Docker Hub 已整体不存在（实测 7.5.31/32/33 均 404），
  # 「锁 AGPL 前版本线」路径不可行；可视化看板不属 V1.0 验收项，
  # 指标采集 + 告警规则足以支撑可用率度量。看板列 V1.1
  # （候选：Perses，Apache-2.0）。
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: oa-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${OA_PROMETHEUS_PORT:-9090}:9090"
    networks: [officeai]
    logging: *default-logging

volumes:
  postgres-data:
  valkey-data:
  etcd-data:
  milvus-etcd-data:
  milvus-object-store-data:
  milvus-data:
  object-store-data:
  prometheus-data:

networks:
  officeai:
    driver: bridge
