# ===========================================================================
# 私有化一键部署编排（DEPLOY_MODE=private）
#
# 组成：
#   - 底座层：dify-api / dify-worker / dify-web（Dify Apache-2.0）
#   - 业务能力层：keycloak（身份与权限）
#   - 基础设施层：postgres / valkey / milvus / seaweedfs
#   - 自研层：adapter（统一适配层）/ web（前端交互层）
#
# 合规说明（总方案 5.3 / 架构文档 2.1）：
#   - 缓存使用 **Valkey**（BSD-3-Clause 白名单）。原 Redis 7 为 RSALv2/SSPL
#     双许可（黑名单），直接选用协议兼容的 Valkey 以规避协议风险。
#     ✅ D-06 已于 2026-10-21 由创始人授权主理人正式批准（docs/decisions/0004）。
#   - 对象存储使用 **SeaweedFS**（Apache-2.0 白名单，独立容器运行）——MinIO
#     上游 Docker Hub 仓库已整体下架，制品不可获取，ADR-0002 v1.3 已决策替换。
#     ✅ D-06 已于 2026-10-21 由创始人授权主理人正式批准（docs/decisions/0004）。
#   - 其余组件协议：PostgreSQL（类 BSD/MIT）、Milvus（Apache-2.0）、
#     Keycloak（Apache-2.0）、Dify（Apache-2.0）。
#
# 离线支持：镜像从本地离线包加载（deploy/offline/images）由 `install.sh --offline`
# 完成——本文件只消费 `images.lock` 里钉住的 tag，不读任何离线开关；
# 安装脚本会把所选模式记录进 `.env`，供运维核对，**不注入容器**。
# ===========================================================================

name: officeai-private

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------
  # 基础设施层
  # ---------------------------------------------------------------------
  postgres:
    # 阶段四 T4-03 起改为 **pgvector 官方镜像**：迁移 0009 第一步是
    # `CREATE EXTENSION vector`，纯 postgres 镜像没有该扩展 → 记忆三表建不出来。
    # 同一 PG 大版本（18），只多一个扩展；登记见 deploy/images.lock。
    # R2-ARC-14（2026-10-29）：滚动 tag `pg18` → 精确标签 `0.8.7-pg18-bookworm`。
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    container_name: oa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OA_POSTGRES_USER:-officeai}
      POSTGRES_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      POSTGRES_DB: ${OA_POSTGRES_DB:-officeai}
      # 中文排序与大小写不敏感检索
      LANG: C.UTF-8
    volumes:
      # PostgreSQL 18+ 镜像要求挂载到 /var/lib/postgresql（数据在其下 data/ 子目录），
      # 直接挂 /var/lib/postgresql/data 会被镜像入口拒绝启动（2026-10-21 实测）
      - postgres-data:/var/lib/postgresql
      # 首次启动（空数据目录）时创建 dify / keycloak 逻辑库
      - ./init-databases.sql:/docker-entrypoint-initdb.d/00-init-databases.sql:ro
      # 阶段二业务库表结构（D-02）：必须排在 00-/10- 之后执行，
      # 其 DROP POLICY IF EXISTS + CREATE POLICY p_tenant_isolation 会统一旧策略名
      # （用 01- 会先于 10-init-rls.sql 执行，导致新旧策略共存，见主理人裁决 1）
      - ./init-schema-phase2.sql:/docker-entrypoint-initdb.d/20-init-schema-phase2.sql:ro
      # 阶段三业务库表结构（B17）：插件域 9 张表 + RLS 重声明 + 目录种子。
      # **必须排在 20-init-schema-phase2.sql 之后**：它依赖阶段二建好的 tenant 表
      # 与 p_tenant_isolation 体例，并把 plugin_catalog/plugin_version 并入共享分组。
      - ./init-schema-phase3.sql:/docker-entrypoint-initdb.d/22-init-schema-phase3.sql:ro
      # 阶段四：会话/消息表（迁移 0008 的入网落点）。必须在阶段三之后：
      # initdb 以超级用户执行，应用角色对 public 无 CREATE 权限，
      # 若只靠迁移建表，新装环境的第一次 --apply 会 permission denied。
      # ⚠ 还必须排在 `30-init-app-role.sql` **之后**（字典序依赖：
      #   `30-init-app-role` < `30-init-schema-phase4` 才恰好成立）。
      #   改文件名会让授权在角色创建前执行、静默跳过 GRANT——表现为
      #   「表建好了、应用角色却无权读写」，initdb 日志里只有一行 NOTICE。
      - ./init-schema-phase4.sql:/docker-entrypoint-initdb.d/30-init-schema-phase4.sql:ro
      # 应用连接角色（非超级用户）：必须排在 20- 之后（先有表才能授权）。
      # 用 officeai（超级用户）连库会绕过行级安全，多租户隔离失效；
      # /readyz 的 db_privilege 自检会因此判 not_ready。
      - ./init-app-role.sql:/docker-entrypoint-initdb.d/30-init-app-role.sql:ro
    networks: [officeai-backend]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OA_POSTGRES_USER:-officeai}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ARC-02（审计 2026-10-28）：资源限额照抄 lite 栈实测口径（docker-compose.lite.yml）
    deploy:
      resources:
        limits:
          # 实测 cgroup 上界 191 MiB（shared_buffers 128 MB 时），留 2.5 倍余量
          memory: 512M

  # Redis 的 BSD-3 替代实现（✅ D-06 已批准）
  valkey:
    image: valkey/valkey:9.2-alpine
    container_name: oa-valkey
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      --maxmemory ${OA_VALKEY_MAXMEMORY:-2gb}
      # ARC-14（审计 2026-10-28）：allkeys-lru → volatile-lru——只淘汰带 TTL 的 key，
      # 无 TTL 的业务键（若误写入）不会被静默驱逐。前提：限流/幂等/队列各 key
      # 写入处均显式带 TTL（审计已逐处核实）。队列 key 迁独立 db 的方案暂缓
      # （涉及业务代码与连接配置，收益待多副本阶段再评估）。
      --maxmemory-policy volatile-lru
    volumes:
      - valkey-data:/data
    networks: [officeai-backend]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${OA_VALKEY_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ARC-02：限额照抄 lite 栈实测口径
    deploy:
      resources:
        limits:
          # 必须大于 --maxmemory（2gb 时同比例上调；lite 为 256mb→384M）。
          # ⚠ 全量栈 maxmemory 默认 2gb，限额须覆盖之，否则 OOM killer 先于淘汰动手
          memory: 3g

  # ARC-04（审计 2026-10-28）：孤儿 etcd 服务已删除——milvus 实际使用
  # `milvus-etcd`（见下方 ETCD_ENDPOINTS），此处的独立 etcd 无人依赖，
  # 其数据卷 etcd-data 内数据无消费者。残留卷可用
  # `docker volume rm deploy_etcd-data` 清理（卷名前缀以实际 project 名为准）。

  milvus-object-store:
    # S3 兼容对象存储（SeaweedFS，Apache-2.0 白名单协议，独立容器运行）
    #
    # 为何不用 MinIO：minio/minio 的 Docker Hub 仓库已整体下架（QA BLK-03 实测：
    # 任何 tag 拉取均返回 401），即使锁定 AGPL 之前的版本线也无法部署；
    # 且其 S3 网关 API 与 MinIO 有差异。SeaweedFS 提供等价 S3 兼容接口，
    # 协议为 Apache-2.0，属总方案 5.3 白名单，且上游持续分发。
    # ⚠️ D-06 待决：对象存储最终选型需主理人与法务/合规确认
    image: chrislusf/seaweedfs:4.48
    container_name: oa-milvus-object-store
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      AWS_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - milvus-object-store-data:/data
    networks: [officeai-backend]
    logging: *default-logging
    # 镜像为 BusyBox 基础，无 curl（2026-10-21 实跑修正：原 curl 探针
    # 令容器恒判 unhealthy，实际 S3 网关跨容器可达）；必须显式用
    # 127.0.0.1，busybox wget 解析 localhost 会优先走 IPv6 而误报失败。
    # SeaweedFS 4.x 起 S3 根路径对匿名请求返回 403（安全加固），
    # 故探针改测 master /cluster/status（同进程，200，稳定）
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.7.2
    container_name: oa-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_DATA_DIR: /etcd
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
    volumes:
      - milvus-etcd-data:/etcd
    networks: [officeai-backend]
    logging: *default-logging

  milvus:
    image: milvusdb/milvus:v3.0.3
    container_name: oa-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-object-store:8333
      MINIO_REGION: ${OA_OBJECT_STORE_REGION:-us-east-1}
      MINIO_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      MINIO_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      # ARC-01（审计 2026-10-28）：基础设施组件端口收敛为绑回环——仅本机调试可达，
      # 不再向外部网卡暴露（milvus 与其 metrics 端口均无鉴权）
      - "127.0.0.1:${OA_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${OA_MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      - milvus-etcd
      - milvus-object-store
    networks: [officeai-backend]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 3
    # ARC-02：lite 栈无 milvus 条目可抄——按官方 standalone 建议 ≥2G 预留，
    # 上线后按 `docker stats --no-stream` 观测校准（登记：无 lite 实测基线）
    deploy:
      resources:
        limits:
          memory: 2g

  # 业务对象存储（文档原文件）：S3 兼容，独立容器运行
  # ⚠️ D-06 待决：最终选型需合规确认
  object-store:
    image: chrislusf/seaweedfs:4.48
    container_name: oa-object-store
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      AWS_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - object-store-data:/data
    ports:
      # ARC-01：绑回环，仅本机调试可达（S3 网关凭 AK/SK 鉴权，但 admin 口无鉴权）
      - "127.0.0.1:${OA_OBJECT_STORE_API_PORT:-8333}:8333"
      - "127.0.0.1:${OA_OBJECT_STORE_ADMIN_PORT:-23646}:23646"
    networks: [officeai-backend]
    logging: *default-logging
    # 镜像为 BusyBox 基础，无 curl（2026-10-21 实跑修正：原 curl 探针
    # 令容器恒判 unhealthy，实际 S3 网关跨容器可达）；必须显式用
    # 127.0.0.1，busybox wget 解析 localhost 会优先走 IPv6 而误报失败。
    # SeaweedFS 4.x 起 S3 根路径对匿名请求返回 403（安全加固），
    # 故探针改测 master /cluster/status（同进程，200，稳定）
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5

  # ---------------------------------------------------------------------
  # 底座层（Dify，Apache-2.0）
  # 说明：底座仅对适配层可见；不对外暴露端口，由内部网络访问。
  # ---------------------------------------------------------------------
  dify-api:
    image: langgenius/dify-api:1.17.1
    container_name: oa-dify-api
    restart: unless-stopped
    environment:
      MODE: ${OA_DIFY_MODE:-api}
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env 中设置}
      CONSOLE_API_URL: http://dify-api:5001
      CONSOLE_WEB_URL: http://dify-web:3000
      SERVICE_API_URL: http://dify-api:5001
      APP_API_URL: http://dify-api:5001
      APP_WEB_URL: http://dify-web:3000
      FILES_URL: http://dify-api:5001
      MIGRATION_ENABLED: "true"
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${OA_DIFY_DB:-dify}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      REDIS_DB: "0"
      CELERY_BROKER_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: s3
      OPENDAL_S3_ENDPOINT: http://object-store:8333
      OPENDAL_S3_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      OPENDAL_S3_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
      OPENDAL_S3_BUCKET: ${OA_DIFY_S3_BUCKET:-dify}
      OPENDAL_S3_REGION: ${OA_OBJECT_STORE_REGION:-us-east-1}
      VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${OA_DIFY_SANDBOX_KEY:?必须在 .env 中设置}
      # 私有化模式：禁止任何外网回调
      CONSOLE_CORS_ALLOW_ORIGINS: "*"
      SSRF_PROXY_HTTP_URL: ${OA_SSRF_PROXY_URL:-http://ssrf_proxy:3128}
      SSRF_PROXY_HTTPS_URL: ${OA_SSRF_PROXY_URL:-http://ssrf_proxy:3128}
      PLUGIN_DAEMON_URL: ${OA_PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
      # 审计 OA-AUDIT-001 / P0-3：这两枚内部 API 密钥**曾带明文兜底值**（形如
      # `${VAR:-<常量>}`），即不配 .env 也能启动——而该常量已随仓库提交公开，
      # 等同于把 plugin_daemon 与 Dify 内部 API 对所有人敞开。
      # 现改为与其它密钥一致：缺失即拒绝启动。`.env.example` 已登记两变量。
      PLUGIN_DAEMON_KEY: ${OA_PLUGIN_DAEMON_KEY:?必须在 .env 中设置}
      PLUGIN_DIFY_INNER_API_URL: http://dify-api:5001
      PLUGIN_DIFY_INNER_API_KEY: ${OA_PLUGIN_INNER_API_KEY:?必须在 .env 中设置}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [officeai-backend]
    logging: *default-logging
    # ARC-03（审计 2026-10-28）：healthcheck 照抄 lite 栈实跑口径
    healthcheck:
      # 镜像内有 curl（实测 /usr/bin/curl）；/health 路由见 extensions/ext_app_metrics.py:20
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      # ⚠ 实测首启 78.1 s、二次 84.4 s（固有开销，与迁移无关）；
      # start_period 过短会在正常启动期判 unhealthy 并连带卡住 adapter
      start_period: 120s
    deploy:
      resources:
        limits:
          # ARC-02：实测 422.9 MiB（冷启动）/ 490.9 MiB（cgroup 上界），抄 lite
          memory: 1024M

  dify-worker:
    image: langgenius/dify-api:1.17.1
    container_name: oa-dify-worker
    restart: unless-stopped
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env 中设置}
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${OA_DIFY_DB:-dify}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      CELERY_BROKER_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: s3
      OPENDAL_S3_ENDPOINT: http://object-store:8333
      OPENDAL_S3_ACCESS_KEY_ID: ${OA_OBJECT_STORE_ACCESS_KEY:?必须在 .env 中设置}
      OPENDAL_S3_SECRET_ACCESS_KEY: ${OA_OBJECT_STORE_SECRET_KEY:?必须在 .env 中设置}
      OPENDAL_S3_BUCKET: ${OA_DIFY_S3_BUCKET:-dify}
      OPENDAL_S3_REGION: ${OA_OBJECT_STORE_REGION:-us-east-1}
      VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
    depends_on:
      - postgres
      - valkey
    networks: [officeai-backend]
    logging: *default-logging
    # ARC-03：worker 无 HTTP 端点，用 lite 栈实跑的进程存在性探针：
    # entrypoint `exec celery ...` 使 PID 1 即 celery 本体；镜像内没有 ps，只能读 /proc
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'celery_entrypoint.celery' /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          # ARC-02：实测 427.7 MiB（冷启动）/ 503.8 MiB（cgroup 上界），抄 lite
          memory: 768M

  dify-worker-beat:
    image: langgenius/dify-api:1.17.1
    container_name: oa-dify-worker-beat
    restart: unless-stopped
    environment:
      MODE: beat
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env 中设置}
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${OA_DIFY_DB:-dify}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      CELERY_BROKER_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/1
    depends_on:
      - postgres
      - valkey
    networks: [officeai-backend]
    logging: *default-logging
    # ARC-03：beat 无 HTTP 端点且 lite 栈无对应探针可抄——**刻意不加 healthcheck**
    # （与 Dify 官方 compose 一致），避免后人当缺陷再报。

  dify-web:
    image: langgenius/dify-web:1.17.1
    container_name: oa-dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      MARKETPLACE_API_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - dify-api
    networks: [officeai-backend]
    logging: *default-logging

  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.15
    container_name: oa-dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: ${OA_DIFY_SANDBOX_KEY:?必须在 .env 中设置}
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
    networks: [officeai-backend]
    logging: *default-logging
    # ARC-03：sandbox 无标准健康端点且镜像工具集未实测——不加探针，登记说明
    # （lite 栈亦无）；误配探针会导致容器恒 unhealthy（SeaweedFS curl 的前车之鉴）。

  ssrf_proxy:
    image: ubuntu/squid:6.13-25.04_beta
    container_name: oa-ssrf-proxy
    restart: unless-stopped
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks: [officeai-backend]
    logging: *default-logging
    # ARC-03：squid 无标准 HTTP 健康端点——不加探针，登记说明（lite 栈亦无）。

  # ---------------------------------------------------------------------
  # 业务能力层：身份与权限（Keycloak，Apache-2.0）
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # 底座层：插件守护进程（Dify 1.0 模型提供方管理的必需组件）
  #
  # 背景（2026-10-21 实跑发现）：Dify 1.0 的模型提供方配置 API
  # （/console/api/workspaces/current/model-providers）由插件守护进程
  # 代理实现，缺失该服务时提供方列表返回 500（PluginDaemonInnerError）。
  # 官方 1.0.0 docker-compose 同款配置：0.0.3-local，端口 5002，
  # 独立库 dify_plugin，本地卷 /app/storage。
  # ---------------------------------------------------------------------
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    container_name: oa-plugin-daemon
    restart: unless-stopped
    environment:
      # 共享配置（与 api/worker 对齐）
      LOG_LEVEL: INFO
      SECRET_KEY: ${OA_DIFY_SECRET_KEY:?必须在 .env 中设置}
      DEPLOY_ENV: PRODUCTION
      # 独立库（init-databases.sql 创建）
      DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dify_plugin
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
      REDIS_DB: "2"
      # 守护进程自身（审计 OA-AUDIT-001 / P0-3：同样移除明文兜底，缺失即拒绝启动）
      SERVER_PORT: "5002"
      SERVER_KEY: ${OA_PLUGIN_DAEMON_KEY:?必须在 .env 中设置}
      # 回呼 Dify api（注意服务名是本栈的 dify-api，非官方的 api）
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${OA_PLUGIN_INNER_API_KEY:?必须在 .env 中设置}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: "false"
    volumes:
      - plugin-daemon-data:/app/storage
    networks: [officeai-backend]
    logging: *default-logging
    # ARC-03：探针照抄 lite 栈实跑口径（镜像内有 curl，实测）
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5002/health/check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          # ARC-02：空载 18.9 MiB，但装 provider 插件会冲到几百 MB，抄 lite
          memory: 512M

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: oa-keycloak
    restart: unless-stopped
    command: ["start", "--http-enabled=true", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${OA_KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${OA_POSTGRES_USER:-officeai}
      KC_DB_PASSWORD: ${OA_POSTGRES_PASSWORD:?必须在 .env 中设置}
      # R4 / K2（2026-11-02）：固定对外基址。
      # 这不只是「生成正确的端点」——`KC_HOSTNAME_STRICT=false` 且**不设**
      # `KC_HOSTNAME` 时，issuer 会随请求的 `Host` 头变化：攻击者用自己的域名
      # 访问登录端点，就能拿到一枚 iss 指向该域名的令牌（Host 注入）。
      # 取值来自 `OA_PUBLIC_BASE_URL`（单一真源）；缺失即拒绝启动——
      # 静默回落到某个默认域名比启动失败更难排查。
      KC_HOSTNAME: ${OA_PUBLIC_BASE_URL:?必须在 .env 中设置（对外基址）}
      # 边缘反代后必须声明信任 `X-Forwarded-*`，否则 Keycloak 看到的是
      # http + 内网主机名，拼出的跳转会把浏览器打回内网地址。
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Keycloak 26 起 KEYCLOAK_ADMIN/PASSWORD 已移除，改用 KC_BOOTSTRAP_ADMIN_*
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OA_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OA_KEYCLOAK_ADMIN_PASSWORD:?必须在 .env 中设置}
      # ARC-03：health 探针打管理端口 9000，必须显式开启（lite 栈同款，实测）
      KC_HEALTH_ENABLED: "true"
      # ARC-02：限堆是 1024M 内存限额的前提——不限堆时 JVM 按容器内存 25% 取堆，
      # 仍可能冲破限额；lite 栈实测 384m 堆足够 ≤500 用户签发与管理
      JAVA_OPTS_APPEND: "-Xms64m -Xmx384m"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [officeai-backend, officeai-frontend]
    logging: *default-logging
    # ARC-03：探针照抄 lite 栈实跑口径——镜像内没有 curl（只有 bash 与 grep），
    # 用 bash 的 /dev/tcp 手写 HTTP；/health/ready 在管理端口 9000
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1
          printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      # JVM 起来 + 建表 + 初始化 realm 实测 81 s（二次启动 48 s）
      start_period: 90s
    deploy:
      resources:
        limits:
          # ARC-02：实测 docker stats 797.6 MiB / cgroup 909.1 MiB；
          # 不能按 768M 写（会被 OOM killer 反复杀且日志无异常），抄 lite
          memory: 1024M

  # ---------------------------------------------------------------------
  # realm 一次性导入器（K5 / R5）
  #
  # **刻意不用 `--import-realm`**：那是「服务每次启动都尝试导入」的语义，而我们要的
  # 是「安装期一次性动作」；更要紧的是，已存在 realm 时 `--import-realm` 的行为
  # 依赖导入策略默认值——客户已有 realm **被覆盖是不可挽回的事故**，不能把安全性
  # 押在工具默认值上。这里的「不覆盖」由 `kcadm get` 显式探测保证（见 command）。
  #
  # 用法：`docker compose --profile install up -d keycloak-import`
  # 前置：先渲染模板（`sh deploy/keycloak/render-realm.sh`，install.sh 会自动调用）。
  # ---------------------------------------------------------------------
  keycloak-import:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: oa-keycloak-import
    profiles: ["install"]
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/rendered/realm-officeai.json:/tmp/realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OA_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OA_KEYCLOAK_ADMIN_PASSWORD:?必须在 .env 中设置}
    networks: [officeai-backend]
    logging: *default-logging
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/keycloak/bin/kcadm.sh config credentials \
          --server http://keycloak:8080 --realm master \
          --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" \
          --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD"
        if /opt/keycloak/bin/kcadm.sh get realms/officeai >/dev/null 2>&1; then
          echo "[skip] realm officeai 已存在，不覆盖（客户既有配置优先）"
          exit 0
        fi
        /opt/keycloak/bin/kcadm.sh create realms -f /tmp/realm.json
        echo "[ok] realm officeai 已创建"

  # ---------------------------------------------------------------------
  # 自研层：统一适配层（唯一允许接触底座的应用）
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # 通用边缘（K4-min / R4）：**唯一对外入口**
  #
  # 为什么 full/saas 现在必须有它：Keycloak 没有任何宿主端口映射，浏览器要打开
  # 登录页就必须有一个对外入口把 `/realms/**` 转出去。给 keycloak 加
  # `8080:8080` 等于把身份底座明文端口裸绑 0.0.0.0，比加边缘明显更糟（且与
  # 端口收口方向相反）。同理 P0-5 的 `/sso/*` 是同源相对路径设计，没有边缘无处落地。
  #
  # 路由口径见 `nginx/edge.conf`（与 lite 共用同一份，避免两套漂移）。
  # ⚠ 其中 `^~ /files/artifacts/` 一条**不可删**：该端点不带 `/api` 前缀，
  #   漏掉会被 `location /` 转给 Next.js → 生产恒定 404（审计 S-03 / e074372）。
  # ---------------------------------------------------------------------
  edge:
    image: nginx:1.28-alpine
    container_name: oa-edge
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      # G1：TLS 证书**外部挂载**（不入镜像、不入库）。生产放真证书，
      # 本地验证用 deploy/gen-selfsigned-cert.sh 生成自签（仅限验证）。
      - ./nginx/tls/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./nginx/tls/privkey.pem:/etc/nginx/tls/privkey.pem:ro
    ports:
      # G1：80 只做探活与 301 跳转，443 终止 TLS。多栈并存或宿主端口被占时
      # 用 OA_EDGE_HTTP_PORT / OA_EDGE_HTTPS_PORT 覆盖
      - "${OA_EDGE_HTTP_PORT:-80}:80"
      - "${OA_EDGE_HTTPS_PORT:-443}:443"
    depends_on:
      adapter:
        condition: service_healthy
      web:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [officeai-frontend]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  adapter:
    build:
      context: ../apps/adapter
      dockerfile: Dockerfile
    image: officeai/adapter:${OA_IMAGE_TAG:-1.0.0}
    container_name: oa-adapter
    restart: unless-stopped
    healthcheck:
      # 就绪探针必须打 /readyz（不是 /healthz）：它同时校验业务库连通性与
      # **数据库权限自检**（连接账号带 BYPASSRLS 时行级安全策略形同虚设）
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u, sys;
          sys.exit(0 if u.urlopen('http://127.0.0.1:8000/readyz', timeout=5).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    env_file:
      - .env
    environment:
      # 环境名与鉴权模式从 .env 取值：缺省按生产 + OIDC 处理。
      # 本地演示若要用桩模式，必须在 .env 显式写 OA_ENV=development + OA_AUTH_MODE=stub，
      # 让「不验签」成为一次有意识的配置，而不是代码默认值（S1，2026-10-23）。
      OA_ENV: ${OA_ENV:-production}
      OA_AUTH_MODE: ${OA_AUTH_MODE:-oidc}
      OA_DEPLOY_MODE: private
      # 离线/在线「镜像来源」开关不注入容器：它只供 install.sh 在宿主机侧读 .env
      # 决定从哪里取镜像，适配层没有对应字段，注入等于静默丢弃
      # （与改名前的 IAM 地址键同一类缺陷，见 deploy/validate_config_names.py）。
      OA_API_PREFIX: /api/v1
      # 底座地址：仅适配层可见，不对外暴露
      OA_DIFY_BASE_URL: http://dify-api:5001
      # **必须是 `OA_KEYCLOAK_BASE_URL`**：`Settings` 的字段名是 `keycloak_base_url`，
      # 环境变量 = `OA_` + 字段名大写。此前这里写成 `OA_KEYCLOAK_URL`，无 alias 承接，
      # pydantic 直接忽略 → 静默回落到默认值（恰好同值，所以一直没炸）。改名前请确认
      # `deploy/validate_config_names.py` 为绿，它是这条约束的机械防线。
      # K1 / R4（2026-11-02）：对外基址——**单一真源**。
      # 适配层用它决定会话 Cookie 的 `Secure` 属性；编排用它给 Keycloak 设
      # `KC_HOSTNAME`（= 令牌 `iss` 的域名）。两处必须同源，故只留这一个变量。
      # 缺失即拒绝启动（`validate_auth_startup` → 30004）：空值不会报错，
      # 只会让 Cookie 静默丢掉 Secure —— 那比启动失败难查得多。
      OA_PUBLIC_BASE_URL: ${OA_PUBLIC_BASE_URL:?必须在 .env 中设置（对外基址）}
      # 会话 Cookie 开关（P0-5 路线 A）：**回滚开关**，不是功能开关。
      # 关掉后 `/sso/*` 五个端点返回 503，适配层回到只认 `Authorization: Bearer`
      # 的旧形态——现场 Cookie 轨出问题时不回滚镜像也能退回，这是灰度期最后一道退路。
      # 缺省 true：目标态就是"令牌只在 httpOnly Cookie 里"；双轨期内 Bearer 仍然接受，
      # 旧前端（localStorage 形态）不受影响。
      OA_AUTH_COOKIE_ENABLED: ${OA_AUTH_COOKIE_ENABLED:-true}
      OA_KEYCLOAK_BASE_URL: http://keycloak:8080
      OA_REDIS_URL: redis://:${OA_VALKEY_PASSWORD}@valkey:6379/0
      # **业务库连接串必须取 `.env` 的 `OA_DATABASE_URL`**（`.env.example:160` 要求用
      # `officeai_app`：NOSUPERUSER + NOBYPASSRLS）。此前这里写死用 `${OA_POSTGRES_USER}`
      # （库属主/超级用户），会把 .env 里配好的应用角色串**静默覆盖**掉；
      # 适配层的 `/readyz` 权限自检随即判 `db_privilege=false`，容器永远不 healthy——
      # 而 RLS 对超级用户根本不生效，等于把多租户隔离关掉了。
      # 缺失即拒绝启动：不回落超级用户（R1，2026-10-23）。
      OA_DATABASE_URL: ${OA_DATABASE_URL:?私有化部署必须提供应用角色 DSN（officeai_app）}
      OA_MILVUS_URI: http://milvus:19530
      OA_OBJECT_STORE_ENDPOINT: http://object-store:8333
      # 私有化部署面向本机 Dify，必须真实联调（T01 桩模式仅用于无底座开发）
      OA_DOWNSTREAM_ENABLED: "true"
      # 底座默认应用密钥（会话类应用，安装时由部署工具注入，仅适配层可见）
      OA_DIFY_DEFAULT_APP_KEY: ${OA_DIFY_DEFAULT_APP_KEY:-}
      # Agent 任务专用工作流应用密钥（与对话应用分离；缺省回退默认密钥）
      OA_DIFY_AGENT_APP_KEY: ${OA_DIFY_AGENT_APP_KEY:-}
      # B2（2026-11-05）：产物按需导出 xlsx（默认开，只读加性）与离线 Office 预览
      # （默认关——镜像未装 LibreOffice 时端点只会 503）。开启预览前先执行
      # `docker compose exec adapter soffice --version`，再按
      # docs/delivery-2026-11-05-b2-xlsx-preview.md 的 5 分钟步骤验收；**CI 绿不等于预览可用**。
      OA_ARTIFACT_XLSX_ENABLED: ${OA_ARTIFACT_XLSX_ENABLED:-true}
      OA_OFFICE_PREVIEW_ENABLED: ${OA_OFFICE_PREVIEW_ENABLED:-false}
      # 矩阵第 2 项（2026-11-06）：通用任务计划生成 → 确认。默认关，
      # 关闭时建任务即执行（行为与存量一致）；开启后需前端确认才会真正执行。
      OA_TASK_PLAN_ENABLED: ${OA_TASK_PLAN_ENABLED:-false}
      OA_TASK_PLAN_TIMEOUT_SECONDS: ${OA_TASK_PLAN_TIMEOUT_SECONDS:-900}
    ports:
      # G1（审计 2026-11-02 P0-4）：绑回环，仅本机调试可达——对外只走 edge（TLS）。
      # 明文 8000/3000 不得裸绑全网卡：那会绕过边缘限流/安全头/证书。
      - "127.0.0.1:${OA_ADAPTER_PORT:-8000}:8000"
    depends_on:
      # ARC-03（审计 2026-10-28）：启动依赖补全——数据库/向量库/对象存储就绪前
      # 不启动 adapter，不再靠运气
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      milvus:
        condition: service_healthy
      object-store:
        condition: service_healthy
      keycloak:
        condition: service_started
    # ARC-01（审计 2026-10-28）：adapter 是唯一双挂网的服务——backend 承载
    # 它对基础设施/底座的全部出向调用，frontend 承载 web 服务端的入向调用
    networks: [officeai-backend, officeai-frontend]
    logging: *default-logging
    deploy:
      resources:
        limits:
          # ARC-02：实测 87.5 MiB（空载）/ 92.2 MiB（cgroup），抄 lite
          memory: 512M

  # ---------------------------------------------------------------------
  # 自研层：前端交互层
  # ---------------------------------------------------------------------
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      # H-3（审计 2026-10-28）：npm workspaces 锁在仓库根，build context 只圈了
      # apps/web。把仓库根挂为额外 context `lockroot`，Dockerfile 用
      # COPY --from=lockroot 取根锁；锁缺失时 npm ci 构建失败（fail loud），
      # 不再静默回退 npm install。需 Docker Compose v2.17+。
      additional_contexts:
        lockroot: ..
      args:
        # K4-min：边缘化后浏览器必须走**同源相对路径**（/api/v1/*），不再直连 8000。
        # 置空 = 前端用相对路径；配成 http://host:8000 会绕过边缘（也绕过限流与
        # 安全头），且在轮 2 端口收口后直接不可达。
        NEXT_PUBLIC_ADAPTER_BASE_URL: ""
        # 统一登录：公开接入信息（不含密钥），**构建期内联**进 bundle。
        # ⚠ 改完必须 `docker compose build web`（重新构建），`restart` 不生效——
        #   运行期改环境变量对 NEXT_PUBLIC_* 无效。
        # 留空 = 登录页只显示「统一登录尚未配置」，登录入口不可达。
        NEXT_PUBLIC_OIDC_ISSUER: ${OA_WEB_OIDC_ISSUER:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${OA_WEB_OIDC_CLIENT_ID:-}
    image: officeai/web:${OA_IMAGE_TAG:-1.0.0}
    container_name: oa-web
    restart: unless-stopped
    ports:
      # G1（审计 2026-11-02 P0-4）：绑回环，仅本机调试可达——对外只走 edge（TLS）
      - "127.0.0.1:${OA_WEB_PORT:-3000}:3000"
    depends_on:
      - adapter
    # ARC-01：web 只挂 frontend——服务端调用 adapter 走 frontend 网；
    # 浏览器侧经宿主机端口直达，不受影响（OIDC 兑换在浏览器侧发起）
    networks: [officeai-frontend]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # 监控告警（Prometheus，Apache-2.0）
  #
  # Grafana 已于 V1.0 移除（2026-10-21 拍板，见 docs/decisions/0004）：
  # grafana/grafana 自 8.0 起为 AGPL-3.0，且 AGPL 前的 7.5.x 版本线
  # 在 Docker Hub 已整体不存在（实测 7.5.31/32/33 均 404），
  # 「锁 AGPL 前版本线」路径不可行；可视化看板不属 V1.0 验收项，
  # 指标采集 + 告警规则足以支撑可用率度量。看板列 V1.1
  # （候选：Perses，Apache-2.0）。
  # ---------------------------------------------------------------------
  # 阶段四 T4-05.2：数据库与缓存指标由**独立 exporter** 采集（只读、单连接）。
  #
  # 两条纪律：
  #   1. **不映射宿主机端口**：exporter 无鉴权，暴露到公网等于把库的结构与负载画像
  #      白送；Prometheus 通过 compose 内网直连即可。
  #   2. **用应用角色连库**（`OA_DB_APP_USER`，NOSUPERUSER/NOBYPASSRLS）：
  #      采集读 `pg_stat_*` 视图，不需要超级用户；用超级用户会在监控侧开一个绕过
  #      RLS 的口子（S6 的教训）。
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: oa-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${OA_DB_APP_USER:-officeai_app}:${OA_DB_APP_PASSWORD:?必须在 .env 中设置}@postgres:5432/${OA_POSTGRES_DB:-officeai}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [officeai-backend]
    logging: *default-logging

  valkey-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: oa-valkey-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://valkey:6379"
      REDIS_PASSWORD: ${OA_VALKEY_PASSWORD:?必须在 .env 中设置}
    depends_on:
      valkey:
        condition: service_healthy
    networks: [officeai-backend]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: oa-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 阶段四 T4-05.2：5 条告警规则（§8.4 表达式原样）
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      # ARC-01：Prometheus 无鉴权，绑回环——保留本机调试能力，不对外暴露
      - "127.0.0.1:${OA_PROMETHEUS_PORT:-9090}:9090"
    networks: [officeai-backend]
    logging: *default-logging
    # ARC-03：镜像内实测有 wget（无 curl）
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  valkey-data:
  milvus-etcd-data:
  milvus-object-store-data:
  milvus-data:
  object-store-data:
  prometheus-data:
  plugin-daemon-data:

networks:
  # ARC-01（审计 2026-10-28）：单一扁平网拆分为双网——
  #   officeai-backend：postgres/valkey/milvus/object-store/dify 全家/keycloak/
  #                     exporters/prometheus/adapter（adapter 亦挂 frontend）
  #   officeai-frontend：adapter、web（对外面收敛到最小）
  # 隔离的直接证据：从 web 容器解析不到 postgres（`wget postgres:5432` 不可达）。
  officeai-backend:
    driver: bridge
  officeai-frontend:
    driver: bridge
