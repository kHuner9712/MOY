# ===========================================================================
# 轻量版站点配置 · TLS 变体（P1，审计 2026-10-30 M8，SaaS 对外前置）
#
# 与 lite.conf 同一套路由，但以 TLS 对外服务。**二选一挂载**：
#   - 纯 HTTP / 内网 / TLS 由上游负载均衡终结 → 挂 lite.conf（默认）
#   - nginx 直接对公网/跨网段服务          → 挂本文件
#
# 挂载方式（docker-compose.lite.yml 的 nginx 服务，替换 lite.conf 一行）：
#   - ./nginx/lite-tls.conf:/etc/nginx/conf.d/default.conf:ro
#   - ./nginx/tls/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
#   - ./nginx/tls/privkey.pem:/etc/nginx/tls/privkey.pem:ro
# 证书由现场提供（私有化 CA / ACME 均可），**不入库**；路径固定为
# /etc/nginx/tls/{fullchain,privkey}.pem。
#
# 路由与安全约定（鉴权在适配层、add_header 不继承等）与 lite.conf 一致，
# 详见 lite.conf 头部注释，此处不重复。
# ===========================================================================

resolver 127.0.0.11 valid=30s ipv6=off;

# ---- 80：只做一件事——301 到 HTTPS -------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # healthcheck 走明文（compose 探活不需要证书），其余全部跳转
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        add_header X-Content-Type-Options nosniff always;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：业务站点 ------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    server_tokens off;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 起步（1.0/1.1 已废），优先 1.3；会话复用省一次握手
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头：CSP 由 Next.js 自己发（见 lite.conf 注释）；
    # HSTS 只在 TLS 站点发——max-age 半年，含子域（preload 慎用，需评审后加）
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    set $adapter_backend "adapter:8000";
    set $web_backend     "web:3000";

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://$adapter_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering    off;
        proxy_cache        off;
        add_header X-Accel-Buffering no always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------------------------------------------------------------
    # 产物下载：`/files/artifacts/{token}`
    #
    # 端点故意不带 `/api/v1` 前缀，不会被上面的 `location /api/` 命中；缺这段就
    # 落到最后的 `location /` 转给 Next.js → 生产恒定 404（2026-11-02 审计 S-03）。
    # 安全头就地重复的理由同 `/api/`：本层一旦出现 add_header，就不再继承 server 级。
    # ---------------------------------------------------------------------
    # ⚠️ 预览链路（2026-11-05 B2）：`/files/artifacts/{token}/preview` 返回 **PDF**，
    # 必须 `inline` + 允许同源内嵌；下载块的 `sandbox` / `DENY` 会让 PDF 阅读器
    # （Chromium 插件）整个失效。正则 location 优先于普通前缀命中；下载块因此
    # **不能带 `^~`**（带 `^~` 会跳过正则匹配，这段就永远不生效）。
    location ~ ^/files/artifacts/[^/]+/preview$ {
        proxy_pass http://$adapter_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # 只声明可被谁内嵌；**刻意不含 sandbox**（见上方注释）
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location /files/artifacts/ {
        proxy_pass http://$adapter_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "sandbox" always;
    }

    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://$adapter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://$adapter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://$web_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 120s;
    }
}
