# ===========================================================================
# 轻量版站点配置（阶段四 T4-05.4，挂到 /etc/nginx/conf.d/default.conf）
#
# 路由只有四条，故意保持极简——nginx 的 location 匹配规则（前缀/正则/精确
# 的优先级）比大多数人记得的复杂，"漏配一条 location"就变成"绕过鉴权"或
# "底座端口被直连"。新增路由前先问：能不能放到适配层？
#
#   /healthz   → 本机 200 ok（只给 compose healthcheck 用）
#   /api/      → adapter:8000（业务全部在这里，含 SSE 流式）
#   /readyz    → adapter:8000/readyz（运维探针，限内网）
#   /metrics   → adapter:8000/metrics（Prometheus 拉取，限内网）
#   /          → web:3000（自研前端，Next.js 有服务端进程）
#
# **不在 nginx 做鉴权**：鉴权在适配层（Bearer/OIDC）。把鉴权放进代理，
# 会让你在改一行 location 时不小心把某个路径变成免鉴权。
# ===========================================================================

# Docker 内置 DNS（127.0.0.11）。用变量 + resolver 而不是静态 upstream：
#   - 静态 upstream 在**启动时**解析一次，容器重建换 IP 后 nginx 会一直打旧 IP，
#     表现为 502 直到手工 reload；
#   - 私有化现场没有运维会记得 reload。
# valid=30s 让 nginx 每 30 秒重新解析，代价可忽略。
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # 不对外暴露 nginx 版本号（扫描器第一件事就是看 Server 头）
    server_tokens off;

    # 安全响应头（P1，审计 2026-10-30 M8）。
    # CSP 由 Next.js 自己发（next.config.js，含 RSC 内联所需的 unsafe-inline，
    # 见其注释），nginx 不重复发以免两套 CSP 叠加出难排查的拦截。
    # HSTS 只在 TLS 站点生效，见 lite-tls.conf；纯 HTTP 部署发 HSTS 无意义。
    #
    # ⚠️ nginx 的 add_header **不继承**：下层 location 一旦有自己的 add_header，
    # server 级的头就全部丢失。因此 /healthz 与 /api/（有自己的 add_header）
    # 必须逐点重复这三行——漏一处就是一个裸奔端点。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端地址放变量里：只有走变量时 nginx 才会用上面的 resolver 重新解析
    # （静态写死 `proxy_pass http://adapter:8000` 是启动时解析一次，换 IP 就 502）。
    set $adapter_backend "adapter:8000";
    set $web_backend     "web:3000";

    # ---------------------------------------------------------------------
    # 健康检查：只回答"nginx 自己活着"，不代理到后端
    # 早期写成代理到 adapter 是错的——adapter 挂掉会让 proxy 也被判 unhealthy，
    # 而这两件事的处置方式完全不同（proxy 挂了要 reload，adapter 挂了要查业务）。
    # ---------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # 业务入口：适配层
    #
    # SSE（流式对话）三件套，缺一不可：
    #   proxy_buffering off        —— 不攒包，否则回答会"憋到最后一次性吐出"
    #   X-Accel-Buffering: no      —— 后端也能显式关掉缓冲
    #   proxy_http_version 1.1 + Connection "" —— 长连接，否则每条消息重建连接
    # ---------------------------------------------------------------------
    location /api/ {
        # 边缘限流（P1，审计 2026-10-30 M8）：10r/s + 突发 20 不延迟排队。
        # SSE 是单条长请求，不受每秒速率影响；业务配额仍由适配层限流裁决。
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://$adapter_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        add_header X-Accel-Buffering no always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # 长回答 + 工具调用链：读超时给足（http 级已设 300s，这里显式再标一次，
        # 避免有人改 http 级的值时把流式砍掉）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------------------------------------------------------------
    # 运维探针与指标：**限内网**
    #
    # /readyz 会返回每一项检查的名字与结果（含 db_privilege 等内部信息），
    # /metrics 会暴露端点级流量画像。两者对私有化客户是运维必需，对公网是白送情报。
    # Docker Desktop / bridge 网络下来源 IP 落在 172.16/12，宿主上用 curl 能通。
    # ---------------------------------------------------------------------
    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://$adapter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://$adapter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------
    # 前端：其余全部交给 web（Next.js standalone）
    #
    # 用 `$` 变量形式同样是为了 DNS 跟随容器重建；这里必须用 $request_uri
    # 传原始路径（含查询串），否则 Next 的动态路由与 _next/static 会 404。
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://$web_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js 的 RSC/静态资源有大量小文件，短超时足够；长连接交给 /api/
        proxy_read_timeout 120s;
    }
}
