# ===========================================================================
# 轻量版 nginx 主配置（阶段四 T4-05.4）
#
# 全局只做三件事：日志格式、压缩、把 conf.d/ 里的站点配置读进来。
# **不在 nginx 里做鉴权**：鉴权在适配层（Bearer/OIDC）。把鉴权放进代理会让
# "漏配一条 location"变成"绕过鉴权"，而 nginx 的 location 匹配规则比大多数人
# 记得的复杂。
# ===========================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志带 upstream 耗时：排查"到底是 nginx 慢还是后端慢"只看这一列就够
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    # 上传上限与适配层的 413（PAYLOAD_TOO_LARGE，50MB）**必须一致**：
    # nginx 若比后端小，用户拿到的是 nginx 的纯文本 413（没有 JSON 信封，
    # 前端 unwrap 会崩）；若比后端大，请求会白走一趟再被后端拒。
    client_max_body_size 50m;
    client_body_timeout  60s;

    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/xml application/x-font-ttf
                      application/vnd.ms-fontobject image/svg+xml;

    # SSE（对话流式输出）与长连接的兜底超时：默认 60s 会在长回答时把连接掐掉，
    # 而流式断开在客户端表现为"回答突然截断"，最容易被当成模型问题。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # API 限流区（P1，审计 2026-10-30 M8）：按客户端 IP 限速，站点配置里
    # 用 limit_req 引用。业务侧另有适配层限流（core/ratelimit），这里是
    # 边缘兜底——两层限流阈值不必相等，nginx 挡洪水、适配层做业务配额。
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
