# ===========================================================================
# 通用边缘站点配置（K4-min / R4）—— 挂到 /etc/nginx/conf.d/default.conf
#
# 与 `lite.conf` 的关系：
#   - `lite.conf` 是轻量版历史配置，只有 4 条路由（无身份底座入口）；
#   - 本文件是它的**超集**：多出 `/sso/`、`/realms/`、`/resources/` 三条，
#     让浏览器能在**同源**下打开 Keycloak 登录页（Keycloak 没有任何宿主端口，
#     不给它一个对外入口，登录页根本跳不出去）。
#   - 2026-11-02 起重轻量版的 `proxy` 也换挂本文件（一套路由一套口径，避免两套漂移）。
#   - G1（审计 2026-11-02 P0-4）：本文件升级为 **TLS 变体**——80 只做探活与 301
#     跳转，443 终止 TLS 后承载全部路由；TLS 参数与证书挂载口径与 `lite-tls.conf`
#     逐字一致（`/etc/nginx/tls/{fullchain,privkey}.pem`，外部挂载、不入库）。
#
# 路由（按 nginx 匹配优先级：`= ` > `^~ ` > `/`）：
#
#   = /healthz            → 本机 200 ok（compose healthcheck 用）
#   = /readyz  = /metrics → adapter（**限内网**，见文件内注释）
#   ^~ /files/artifacts/  → adapter（产物下载，**不带 /api 前缀**，见下方回归陷阱）
#   ^~ /sso/              → adapter（服务端会话端点，P0-5）
#   ^~ /realms/           → keycloak（登录页 / token / JWKS）
#   ^~ /resources/        → keycloak（登录页静态资源）
#   /api/                 → adapter（业务全部在这里，含 SSE 流式）
#   /                     → web（Next.js）
#
# **不在 nginx 做鉴权**：鉴权在适配层（Bearer / OIDC）。把鉴权放进代理，
# 会让你在改一行 location 时不小心把某个路径变成免鉴权。
# ===========================================================================

# Docker 内置 DNS（127.0.0.11）。用变量 + resolver 而不是静态 upstream：
#   - 静态 upstream 在**启动时**解析一次，容器重建换 IP 后 nginx 一直打旧 IP，
#     表现为 502 直到手工 reload；
#   - 私有化现场没有运维会记得 reload。
resolver 127.0.0.11 valid=30s ipv6=off;

# ---- 80：只做两件事——探活 + 301 到 HTTPS（G1，审计 2026-11-02 P0-4）----
# 与 lite-tls.conf 同一套口径：healthcheck 走明文（探活不需要证书），其余全部跳转。
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    server_tokens off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        add_header X-Content-Type-Options nosniff always;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：TLS 终止 + 全部路由（G1）------------------------------------
# 证书由现场提供（外部挂载 /etc/nginx/tls/{fullchain,privkey}.pem，**不入库**，
# 与 lite-tls.conf 同一挂载口径；自签仅限验证，见部署指南 §12.5.2）。
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    # 不对外暴露 nginx 版本号（扫描器第一件事就是看 Server 头）
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 起步（1.0/1.1 已废），优先 1.3；会话复用省一次握手
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头。CSP 由 Next.js 自己发（next.config.js，含 RSC 内联所需的
    # unsafe-inline），nginx 不重复发以免两套 CSP 叠加出难排查的拦截。
    #
    # ⚠️ nginx 的 add_header **不继承**：下层 location 一旦有自己的 add_header，
    # server 级的头就全部丢失。因此下面每个带 add_header 的 location 都必须
    # 逐点重复这四行（HSTS + 三件套）——漏一处就是一个裸奔端点。
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端地址放变量里：只有走变量时 nginx 才会用上面的 resolver 重新解析
    set $adapter_backend  "adapter:8000";
    set $web_backend      "web:3000";
    set $keycloak_backend "keycloak:8080";

    # ---------------------------------------------------------------------
    # 边缘自身探活：只回答"nginx 活着"，不代理到后端
    # 代理到 adapter 是错的——adapter 挂掉会让 proxy 也被判 unhealthy，
    # 而两者处置方式完全不同（proxy 挂了 reload，adapter 挂了查业务）。
    # ---------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # 运维探针与指标：**限内网**
    #
    # /readyz 返回每项检查的名字与结果（含 db_privilege 等内部信息），
    # /metrics 暴露端点级流量画像。对私有化客户是运维必需，对公网是白送情报。
    # ---------------------------------------------------------------------
    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://$adapter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://$adapter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------
    # 产物下载：`/files/artifacts/{token}`
    #
    # ⚠️ **回归陷阱（必读）**：该端点**故意不带 `/api/v1` 前缀**
    # （见 `artifact_files.py` 的路由前缀），所以不会被下面的 `location /api/` 命中。
    # 漏掉这段，请求就落到最后的 `location /` 被转给 Next.js → 生产环境恒定 404。
    # 这正是 2026-11-02 审计 S-03（提交 e074372 修复）的缺陷。本文件从 lite.conf
    # 提升时**必须**带上它；full/saas 此前没有这条，是本轮新增。
    #
    # ⚠️ 安全头必须**就地重复**（理由见文件顶部 add_header 不继承的警告）。
    # ---------------------------------------------------------------------
    # ⚠️ 预览链路（2026-11-05 B2）：`/files/artifacts/{token}/preview` 返回 **PDF**，
    # 必须 `inline` + 允许同源内嵌；下载块的 `sandbox` / `DENY` 会让 PDF 阅读器
    # （Chromium 插件）整个失效。正则 location 优先于普通前缀命中；下载块因此
    # **不能带 `^~`**（带 `^~` 会跳过正则匹配，这段就永远不生效）。
    location ~ ^/files/artifacts/[^/]+/preview$ {
        proxy_pass http://$adapter_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # 只声明可被谁内嵌；**刻意不含 sandbox**（见上方注释）
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location /files/artifacts/ {
        proxy_pass http://$adapter_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 产物可能是几十 MB 的 zip/docx：关缓冲直接流式回传，避免先落临时盘
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # 下载响应进沙箱：即使内容被误判为可渲染类型，也不给脚本执行上下文
        add_header Content-Security-Policy "sandbox" always;
    }

    # ---------------------------------------------------------------------
    # 服务端会话端点（P0-5）：`/sso/login|callback|complete|session|logout`
    #
    # 走适配层。**同样不带 `/api` 前缀**——它与 `/files/artifacts/` 是同一类
    # 「根路径下的自研端点」，落进 `location /` 会被 Next.js 吃成 404。
    # 当前轮（1a）适配层尚未实现这些端点，先占位：路径不存在时适配层返 404，
    # 不会误落到前端（那是更难排查的形态：页面能开但功能没有）。
    # ---------------------------------------------------------------------
    location ^~ /sso/ {
        proxy_pass http://$adapter_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---------------------------------------------------------------------
    # 身份底座（R4）：`/realms/**` 是**登录页本身**与 token / JWKS 端点
    #
    # 没有这条，浏览器在边缘上打开 `/realms/officeai/protocol/openid-connect/auth`
    # 会落到 `location /` 被 Next.js 吃成 404 —— 用户点「登录」后看到前端 404 页。
    #
    # `Host $host` 必须原样传：Keycloak 用它拼相对跳转。issuer 的**权威来源**是
    # `KC_HOSTNAME`（编排里由 `OA_PUBLIC_BASE_URL` 固定），不是 Host 头——
    # 这也正是必须设 `KC_HOSTNAME` 的安全理由：`KC_HOSTNAME_STRICT=false` 时不设它，
    # issuer 会随请求的 Host 头变化（Host 注入 → 令牌 iss 可被伪造）。
    # ---------------------------------------------------------------------
    location ^~ /realms/ {
        proxy_pass http://$keycloak_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 登录表单是普通请求，不需要长连接；但 token 端点偶尔慢，给 60s
        proxy_read_timeout 60s;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 登录页静态资源（主题 CSS/JS/图片）。Keycloak 把资源挂在根路径 `/resources/`，
    # 与前端自己的静态资源路径不冲突（Next 用 `/_next/`）。
    location ^~ /resources/ {
        proxy_pass http://$keycloak_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 静态资源可缓存：Keycloak 版本变化时 URL 带版本段，不会读到旧文件
        proxy_read_timeout 30s;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---------------------------------------------------------------------
    # 业务入口：适配层
    #
    # SSE（流式对话）三件套，缺一不可：
    #   proxy_buffering off        —— 不攒包，否则回答会"憋到最后一次性吐出"
    #   X-Accel-Buffering: no      —— 后端也能显式关掉缓冲
    #   proxy_http_version 1.1 + Connection "" —— 长连接，否则每条消息重建连接
    # ---------------------------------------------------------------------
    location /api/ {
        # 边缘限流：10r/s + 突发 20 不延迟排队。
        # SSE 是单条长请求，不受每秒速率影响；业务配额仍由适配层限流裁决。
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://$adapter_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        add_header X-Accel-Buffering no always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # 长回答 + 工具调用链：读超时给足（http 级已设 300s，这里显式再标一次，
        # 避免有人改 http 级的值时把流式砍掉）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------------------------------------------------------------
    # 前端：其余全部交给 web（Next.js standalone）
    #
    # 用 `$` 变量形式同样是为了 DNS 跟随容器重建；这里必须用 $request_uri
    # 传原始路径（含查询串），否则 Next 的动态路由与 _next/static 会 404。
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://$web_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js 的 RSC/静态资源有大量小文件，短超时足够；长连接交给 /api/
        proxy_read_timeout 120s;
    }
}
