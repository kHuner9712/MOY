# 能力档位 → 底座应用路由表（架构文档 3.1.3 / 4.2 Q2）
#
# 设计意图：
#   - 对上层只暴露 model_profile 枚举（general / code / long_context / reasoning）；
#   - 真实模型名与路由矩阵仅存在于本文件，接口契约不随模型选型变化；
#   - 新增模型只需在本文件扩充「档位 → 应用」映射，M3 目录内容随配置动态变化；
#   - fallback 为降级链，Q2 决策变化时只改本文件，不动代码。
#
# 字段说明：
#   profile              对外能力档位（契约枚举，禁止新增真实模型名作为枚举值）
#   display_name         业务化展示名（前端直接展示，禁止出现模型名称）
#   description          业务化描述
#   max_context_turns    最大上下文轮数
#   status               available / unavailable
#   default_app_env      默认路由对应的底座应用密钥环境变量名（密钥值不落文件）
#   fallback_app_env     降级链：主路由不可用时依次尝试
#
# 密钥说明：真实密钥值一律通过环境变量注入（deploy/.env.example），本文件只登记变量名。

version: 1

profiles:
  - profile: general
    display_name: 通用助手
    description: 日常问答、文档写作、信息整理
    max_context_turns: 20
    status: available
    default_app_env: OA_DIFY_DEFAULT_APP_KEY
    fallback_app_env:
      - OA_DIFY_FALLBACK_APP_KEY

  - profile: code
    display_name: 编程助手
    description: 代码编写、解释与调试
    max_context_turns: 10
    status: available
    default_app_env: OA_DIFY_CODE_APP_KEY
    fallback_app_env:
      - OA_DIFY_DEFAULT_APP_KEY

  - profile: long_context
    display_name: 长文档助手
    description: 超长文档阅读与摘要
    max_context_turns: 5
    status: available
    default_app_env: OA_DIFY_LONG_CONTEXT_APP_KEY
    fallback_app_env:
      - OA_DIFY_DEFAULT_APP_KEY

  - profile: reasoning
    display_name: 深度推理助手
    description: 复杂问题拆解与多步推理
    max_context_turns: 12
    status: available
    default_app_env: OA_DIFY_REASONING_APP_KEY
    fallback_app_env:
      - OA_DIFY_DEFAULT_APP_KEY

# 知识库检索默认策略（附录 A-3：召回参数封装在适配层，不对外暴露）
retrieval_defaults:
  top_k: 5
  score_threshold: 0.5
  search_method: hybrid_search

# 文档分块策略默认值（R3 chunk_policy 缺省值）
chunk_policy_defaults:
  default:
    chunk_size: 800
    overlap: 80
  fine:
    chunk_size: 400
    overlap: 40

# 支持上传的文档格式白名单（架构文档 3.2.3）
allowed_document_extensions:
  - pdf
  - docx
  - xlsx
  - md
  - txt
