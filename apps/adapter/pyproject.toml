[build-system]
# R2-ARC-02（审计 2026-10-29）：构建期依赖也要有上界。无上界意味着同一个
# pyproject 在不同时间可能用不同版本的 setuptools 打包，产物（尤其是
# wheel 内的元数据与 package discovery 行为）不可复现。上界取宽松值即可——
# 目的是"可复现 + 不被破坏性大版本突袭"，不是追逐最新。
requires = ["setuptools>=68,<85", "wheel>=0.44,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "officeai-adapter"
version = "1.0.0"
description = "Moy（麦子）· 自研统一适配层"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

# 依赖严格限定在架构文档 8.1 清单及其版本约束内；
# 许可证实测口径（2026-10-30 审计 M4）：直接依赖 MIT / Apache-2.0 / BSD-3-Clause，
# 传递链含 MPL-2.0（certifi，灰名单：随交付保留许可证文本）/ PSF-2.0 / MIT-0 /
# BSD-2-Clause 等宽松协议；无 GPL/AGPL/SSPL。旧表述「全部为 MIT / Apache-2.0 /
# BSD-3-Clause」经 pip-licenses 全量实测证伪，已修正。
#
# 版本约束说明（架构文档 8.1 / 8.1.1）：
# - fastapi `^0.156`：修复 starlette 传递依赖带来的 14 项漏洞；
# - starlette `^1.3`：**须 ≥ 1.3.1**，1.3.0 仍含 PYSEC-2026-1941
#   （大文件 multipart 解析阻塞事件循环 DoS，**直接命中 R3 文档上传接口**）。
#   starlette 由 fastapi 传递引入，此处显式声明以锁定下界、防止随上游漂移。
dependencies = [
    "fastapi>=0.156,<0.157",
    "starlette>=1.3.1,<2.0",
    # H-2（审计 2026-10-28）：以下 7 项由 `>=` 收敛为 `==` 精确版本（与 uv.lock
    # 解析结果一致，可复现性由「pyproject pin + uv.lock」双载体兜底）。
    "uvicorn[standard]==0.54.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "httpx>=0.27,<0.29",
    "redis==8.1.0",
    # `[asyncio]` 额外项用于拉入 greenlet：SQLAlchemy 2.x 的 `ext.asyncio`
    # 在缺少 greenlet 时**导入即失败**（阶段二 B01 引入异步引擎时实测暴露）。
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg==0.32.0",
    # P0（审计 2026-10-30 H1/M7）：JWT 库由 python-jose 迁移至 PyJWT（MIT）。
    # 原因：python-jose 3.5.0 命中 CVE-2026-85394（HMAC 初始化接受 DER 公钥，
    # 可伪造 HS256 令牌通过验签）且**无修复版**，其传递链 ecdsa 另有未修侧信道
    # CVE-2024-23342，整链事实上低维护。PyJWT 活跃维护且 API 兼容
    # （decode/encode 调用签名一致），`app/core/security.py` 显式限定
    # algorithms 单算法的既有缓解行为保持不变。
    "pyjwt>=2.8,<3.0",
    # `app/core/crypto.py` 直接 import cryptography（AES-GCM 封装）：直接 import
    # 的包必须显式声明（审计 2026-10-29 D2；版本与 uv.lock 解析结果一致，
    # H-2 双载体口径）。
    "cryptography==50.0.2",
    "structlog==26.1.0",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    # 指标 exposition（阶段四 T4-05.1）：`/metrics` 的标准文本格式。
    # Apache-2.0；直方图分桶与累积由库保证，手写必然出现"抓了算不出来"的偏差。
    "prometheus-client>=0.20,<1.0",
    # 公文/Offer 导出（D-20）：`render_file` 必须交付**真 docx**（可解压出
    # `word/document.xml`），不能退成 md/csv。只认 `python-docx`（MIT），
    # 禁 `docxtpl`/`python-docx-template`（会拖入 Jinja2）。
    # docx 一律由平台渲染器生成，插件声明不支持也无法 import（G-28 拦截）。
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
officeai-adapter = "app.main:main"

# 包清单**改为自动发现**（审计 OA-AUDIT-001 / P0-1）：
#
# 此前为手工枚举的 `packages = [...]`，漏登了 `app.business`（22 文件）、
# `app.db` + `app.db.repositories`（23 文件）、`app.plugins`（7 文件）——
# 实测 `pip wheel` 产物中这三个包 **0 个文件**。由于 Dockerfile 用
# `pip install .`（**非 editable**），容器一启动即 ImportError，
# 84 个端点中绝大多数起不来；本地 editable 安装掩盖了该缺陷，故测试全绿。
#
# 根因是「手工清单随新增模块漂移」，因此改为 `find:` 自动发现：
# 任何新增子包自动纳入，无需同步维护清单，从机制上消除复发。
[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.registry" = ["*.yaml"]
# 插件声明由 `app/plugins/loader.py::default_manifests_dir()` 按包内相对路径读取
# （`Path(__file__).parent / "manifests"`），**必须**随包分发，否则容器内 6 份插件全丢。
"app.plugins" = ["manifests/*.json"]

# ===========================================================================
# ruff —— Lint 与格式化（架构文档 9.6 强制门禁）
# ===========================================================================
[tool.ruff]
line-length = 100
# ENG-05（审计 2026-10-28）：py311 口径 = requires-python 下限（>=3.11）的最低
# 公共分母；运行时 3.13 向下兼容。升档需与 requires-python 联动，不可单点改。
target-version = "py311"
src = ["app", "tests"]
# 仅检查 Python 源码；README 中的示例代码块不参与格式化
include = ["*.py", "**/*.py"]
# `qa_probe/` 是联调期手工探针工具（非交付包、非测试、不进镜像），
# 其行宽与导入顺序长期未纳入门禁；阶段二 B01 起明确排除，避免噪声掩盖真问题。
# （2026-10-29 审计清理：tests/qa/ 的一次性验收脚本已删除，排除项随之移除。）
extend-exclude = [".venv", "node_modules", "__pycache__", "qa_probe"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # Pyflakes
    "I",    # isort 导入排序
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "ASYNC",
    "S",    # flake8-bandit
    "SLF",  # flake8-self（禁止访问私有成员）
    "RUF",
]
ignore = [
    "ANN401",  # 允许 Any（协议转换层需要动态 dict）
    "B008",    # FastAPI Depends() 调用形式是官方推荐写法
    "RUF001",  # 中英文标点混排属中文项目正常现象
    "RUF002",
    "RUF003",
    "S101",    # assert 在测试中合法
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ANN201", "ANN001"]
"app/core/logging.py" = ["S311"]
"app/services/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ===========================================================================
# mypy —— 静态类型检查（架构文档 9.6 强制门禁）
# ===========================================================================
[tool.mypy]
# ENG-05（审计 2026-10-28）：py311 口径 = requires-python 下限（>=3.11）的最低
# 公共分母；运行时 3.13 向下兼容。升档需与 requires-python 联动，不可单点改。
python_version = "3.11"
files = ["app"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jwt.*", "yaml.*"]
ignore_missing_imports = true

# ===========================================================================
# pytest —— 测试与覆盖率门禁（QA-09，审计 2026-10-28：覆盖率门禁 ≥ 85%
# [G-05 硬地板，与 ci-adapter.yml 门禁 5 一致]；历史 80% 为阶段一口径已废止）
# ===========================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: 单元测试",
    "integration: 契约/集成测试",
    "contract: 接口契约测试",
    "p0: P0 红线用例（测试方案 §7.1，G-24 门禁）",
    "memory: 记忆内核用例（阶段四 T4-03：抽取/去重/上限/降级）",
    "security: 安全红线用例（阶段四 T4-04.6：五类攻击）",
]
filterwarnings = [
    # P0（审计 2026-10-30）：PyJWT 2.15 起对 HMAC 密钥 <32 字节发
    # InsecureKeyLengthWarning。测试夹具刻意使用可读短密钥（15~27 字节），
    # 单轮跑出 142 条告警噪声。本过滤为**类别级**（非 module 级空转配置），
    # 只在 pytest 进程内生效；生产环境密钥过短的告警仍会进运行日志。
    # R2-ARC-17（审计 2026-10-29）：这里原本有一条
    # `ignore::DeprecationWarning:httpx.*`，三个实测证明它是 **no-op 空转配置**：
    # `filterwarnings` 的 module 段匹配的是「告警**发出**模块」，而
    # `StarletteDeprecationWarning: Using httpx with starlette.testclient is
    # deprecated` 由 `fastapi.testclient` 发出，`httpx.*` 根本不匹配
    # （带该过滤器与不带，输出逐字相同）。
    #
    # 空转配置比没有配置更糟：它暗示"弃用噪音已处理"，却在将来 httpx 真开始发
    # 源告警时把它静默吞掉。故删除。starlette → httpx2 的迁移信号改由
    # `docs/dependency-upgrade-watchlist.md` 集中跟踪（带到期判据）。
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
# ===========================================================================
# 并发口径：**必须同时包含 greenlet 与 thread**（阶段四 T4-03 实测，勿删）
#
# 1. `greenlet`：SQLAlchemy 的 async 引擎通过 greenlet 切换执行栈，
#    默认口径（只认 thread）在切换后**丢失追踪**——表现为"代码明明执行了却报未覆盖"。
#    实测：`DELETE /model/memories/{id}` 的工厂函数已执行（日志有 `memory_deleted`），
#    默认口径仍把它报成未覆盖，加多少等价用例都不会变绿。
# 2. `thread`：单加 `greenlet` 会**反向**丢掉 FastAPI async 端点帧的追踪
#    （端点跑在事件循环里，不在 greenlet 上）。
#
# 同一份代码三种口径实测：默认 89.82% / 仅 greenlet 86.95% / 两者 91.28%。
# 因此：
# - **数字不可跨口径比较**：阶段三记录的 90.78 / 90.26 / 80.89 是旧口径（仅 thread），
#   与阶段四起的新口径**不可直接比较**（新口径只会更高，属测量修正、不是放水）；
# - 引用覆盖率时请注明所用口径。
# ===========================================================================
concurrency = ["greenlet", "thread"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
# 与 CI 门禁同源（ci-adapter.yml）：本地跑 `pytest --cov=app` 也按同一门槛判定，
# 避免"CI 85% / 本地无门槛"的口径差（审计 2026-10-31 M6）。
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]

# ===========================================================================
# pip 镜像与构建
# ===========================================================================
[tool.uv]
package = true
