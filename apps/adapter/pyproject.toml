[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "officeai-adapter"
version = "1.0.0"
description = "企业级跨生态办公 AI 平台 · 自研统一适配层"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

# 依赖严格限定在架构文档 8.1 清单及其版本约束内；
# 全部为 MIT / Apache-2.0 / BSD-3-Clause，无 GPL/AGPL/SSPL。
#
# 版本约束说明（架构文档 8.1 / 8.1.1）：
# - fastapi `^0.156`：修复 starlette 传递依赖带来的 14 项漏洞；
# - starlette `^1.3`：**须 ≥ 1.3.1**，1.3.0 仍含 PYSEC-2026-1941
#   （大文件 multipart 解析阻塞事件循环 DoS，**直接命中 R3 文档上传接口**）。
#   starlette 由 fastapi 传递引入，此处显式声明以锁定下界、防止随上游漂移。
dependencies = [
    "fastapi>=0.156,<0.157",
    "starlette>=1.3.1,<2.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "httpx>=0.27,<0.29",
    "redis>=5.0",
    # `[asyncio]` 额外项用于拉入 greenlet：SQLAlchemy 2.x 的 `ext.asyncio`
    # 在缺少 greenlet 时**导入即失败**（阶段二 B01 引入异步引擎时实测暴露）。
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "tenacity>=8.2",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
officeai-adapter = "app.main:main"

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.api.v1",
    "app.clients",
    "app.core",
    "app.middleware",
    "app.registry",
    "app.schemas",
    "app.services",
    "app.tools",
]

[tool.setuptools.package-data]
"app.registry" = ["*.yaml"]

# ===========================================================================
# ruff —— Lint 与格式化（架构文档 9.6 强制门禁）
# ===========================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
# 仅检查 Python 源码；README 中的示例代码块不参与格式化
include = ["*.py", "**/*.py"]
# `qa_probe/` 是联调期手工探针工具（非交付包、非测试、不进镜像），
# 其行宽与导入顺序长期未纳入门禁；阶段二 B01 起明确排除，避免噪声掩盖真问题。
extend-exclude = [".venv", "node_modules", "__pycache__", "qa_probe"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # Pyflakes
    "I",    # isort 导入排序
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "ASYNC",
    "S",    # flake8-bandit
    "SLF",  # flake8-self（禁止访问私有成员）
    "RUF",
]
ignore = [
    "ANN401",  # 允许 Any（协议转换层需要动态 dict）
    "B008",    # FastAPI Depends() 调用形式是官方推荐写法
    "RUF001",  # 中英文标点混排属中文项目正常现象
    "RUF002",
    "RUF003",
    "S101",    # assert 在测试中合法
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ANN201", "ANN001"]
"app/core/logging.py" = ["S311"]
"app/services/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ===========================================================================
# mypy —— 静态类型检查（架构文档 9.6 强制门禁）
# ===========================================================================
[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jose.*", "yaml.*"]
ignore_missing_imports = true

# ===========================================================================
# pytest —— 测试与覆盖率门禁（架构文档 9.6：核心接口覆盖率 ≥ 80%）
# ===========================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: 单元测试",
    "integration: 契约/集成测试",
    "contract: 接口契约测试",
]
filterwarnings = [
    "ignore::DeprecationWarning:httpx.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]

# ===========================================================================
# pip 镜像与构建
# ===========================================================================
[tool.uv]
package = true
