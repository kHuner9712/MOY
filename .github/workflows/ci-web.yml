# ===========================================================================
# 前端 CI 门禁（架构文档 9.6）
#
# 强制项：ESLint 零 error、tsc 零 error
# 任一不过禁合并。
# ===========================================================================

name: CI Web

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'apps/web/**'
      # P2-20：`scripts/check-banned-terms.mjs` 的 PRD_PATH 指向本文件，`scan:words`
      # 从它的 §7 取词表真源。paths 不含它 → **只改 PRD §7 的 PR 不触发 ci-web**，
      # 词表漂移（退出码 3）在合并前不可见。
      - 'docs/prd-phase2-increment.md'
      # P2-20 同族：`scripts/check-capability-consistency.mjs:32-33` 读这两个源，
      # 而 paths 不含 `apps/adapter/**` → 改它们同样不触发本工作流的 scan:capability。
      - 'apps/adapter/app/plugins/actions.py'
      - 'apps/adapter/app/plugins/manifests/**'
      # H-05（2026-11-07 全仓审计）：monorepo 的 npm workspaces 让**根**的
      # `package.json` / `package-lock.json` 成为 `npm ci` 的真源。paths 只写
      # `apps/web/**` 时，只改根锁文件的 PR 不触发本 workflow —— 依赖树变了，
      # eslint/tsc/vitest/next build 一个都不跑，合并前看到的绿是上一次的绿。
      # 判据由 `deploy/validate_ci_paths.py` 机械校验（C-1 输入覆盖 + C-2 死模式）。
      - 'package.json'
      - 'package-lock.json'
      # H-04 起 e2e 账号/角色/回调地址由该 realm 夹具决定；改了它必须重跑主旅程。
      - '.github/e2e/**'
      # 阶段 2：本 workflow 直接执行该脚本的前端侧子集（--checks STD-3）。
      - 'deploy/validate_standards.py'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'docs/prd-phase2-increment.md'
      - 'apps/adapter/app/plugins/actions.py'
      - 'apps/adapter/app/plugins/manifests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/e2e/**'
      - 'deploy/validate_standards.py'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # monorepo 采用 npm workspaces（workspaces: apps/*）：
    # package-lock.json 与 npm ci 均在仓库根，工作目录必须为根，
    # 否则 npm ci 找不到 lock 文件、CI 直接失败。
    working-directory: .

jobs:
  quality-gate:
    name: Lint / 类型 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          # monorepo 采用 npm workspaces：lock 文件在仓库根，workspaces 声明为 apps/*
          # （此前误指向 apps/web/package-lock.json —— 该文件不存在，会导致
          #   setup-node 的缓存步骤直接失败，CI 无法运行）
          cache-dependency-path: package-lock.json

      - name: 安装依赖（根目录 workspaces 安装）
        run: npm ci --no-audit --no-fund

      # ------------------------------------------------------------------
      # 门禁 1：ESLint（零 error）
      # ------------------------------------------------------------------
      - name: eslint
        run: npm run lint:web

      # ------------------------------------------------------------------
      # 门禁 2：TypeScript 类型检查（零 error）
      # ------------------------------------------------------------------
      - name: tsc --noEmit
        run: npm run typecheck:web

      # ------------------------------------------------------------------
      # 门禁 2b：工程规范（前端侧 STD-3 测试纪律）
      #
      # 阶段 2 的 `validate_standards.py` 在 ci-adapter 全量跑六类；但其中
      # STD-3 直接约束 `apps/web/e2e/**`（禁 `.only(`、禁无条件 skip、禁
      # `ALLOW_SKIP` 开关）。只在 adapter 侧接线时，**只改 e2e 的 PR 不会触发
      # 该判据**（apps/web 不在 ci-adapter 的 paths 内）——前端约束等于漏一半。
      # 这里用同一份脚本的 `--checks STD-3` 子集，保证两侧判据同源。
      # ------------------------------------------------------------------
      - name: 工程规范门禁（前端侧 STD-3 测试纪律）
        run: python3 deploy/validate_standards.py --checks STD-3

      # ------------------------------------------------------------------
      # 门禁 3：前端单元测试（vitest，带覆盖率门禁）
      # QA-04（审计 2026-10-28）：阈值 = 实测基线（vitest.config.mts thresholds），
      # 2026-10-29 起分母改算全量源码，只升不降。
      # P0（审计 2026-10-30 H2）+ P1 补测三十六批（2026-10-30 ~ 2026-11-01）后，
      # 当前阈值为四指标全覆盖：statements 88.8 / branches 84.0 /
      # functions 83.9 / lines 90.0（与 apps/web/vitest.config.mts 的 thresholds 一致，只升不降棘轮）。
      # 浏览器级 e2e 见下方门禁 5；本地 `npm run test:e2e`。
      # ------------------------------------------------------------------
      - name: vitest（含覆盖率门禁）
        run: npm run test --workspace apps/web -- --coverage

      # ------------------------------------------------------------------
      # 构建校验（确保产物可生成）
      # ------------------------------------------------------------------
      - name: next build
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_ADAPTER_BASE_URL: http://127.0.0.1:8000

  terminology-gate:
    name: 术语门禁（G-14 / G-15）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # ------------------------------------------------------------------
      # G-14：禁词扫描（用户可见文案零命中，退出码必须为 0）
      # ------------------------------------------------------------------
      - name: G-14 禁词扫描（零命中）
        run: npm run scan:banned --workspace apps/web

      # ------------------------------------------------------------------
      # G-14 词表一致性：脚本内词表必须与 PRD 第 7 章同步（漂移退出码 3）
      # ------------------------------------------------------------------
      - name: G-14 词表与 PRD 一致性
        run: npm run scan:words --workspace apps/web

      # ------------------------------------------------------------------
      # G-15：扫描器自检。**退出码 1 表示自检通过**（12 条负样本全部命中）。
      # 注意：不用管道（`| tee` 之类会吞掉退出码），先重定向再判状态。
      # ------------------------------------------------------------------
      - name: G-15 扫描器自检（期望退出码 1）
        run: |
          set +e
          npm run scan:self-test --workspace apps/web > scan-self-test.log 2>&1
          status=$?
          set -e
          cat scan-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 自检退出码 $status，期望 1（0/2/3 均说明扫描器或词表异常）"
            exit 1
          fi
          echo "[PASS] 自检命中全部负样本，退出码 1 符合约定"

      # ------------------------------------------------------------------
      # G-17：占位词清零（暂不支持 / 敬请期待 等一律拦截，退出码必须为 0）
      # ------------------------------------------------------------------
      - name: G-17 占位词扫描（零命中）
        run: npm run scan:placeholders --workspace apps/web

      # ------------------------------------------------------------------
      # G-17 自检：同样**期望退出码 1**（负样本必须被抓到，否则门禁是假绿灯）
      # ------------------------------------------------------------------
      - name: G-17 占位词扫描器自检（期望退出码 1）
        run: |
          set +e
          npm run scan:placeholders-self-test --workspace apps/web > scan-placeholder-self-test.log 2>&1
          status=$?
          set -e
          cat scan-placeholder-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 占位词自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 占位词自检命中全部负样本，退出码 1 符合约定"

      # ------------------------------------------------------------------
      # G-18：10 个业务页三态齐备（错误态必须可重试）
      # ------------------------------------------------------------------
      - name: G-18 页面三态门禁
        run: npm run scan:pages --workspace apps/web

      - name: G-18 页面三态门禁自检（期望退出码 1）
        run: |
          set +e
          npm run scan:pages-self-test --workspace apps/web > scan-page-states-self-test.log 2>&1
          status=$?
          set -e
          cat scan-page-states-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 页面三态自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 页面三态自检抓到了全部负样本，退出码 1 符合约定"

      # ------------------------------------------------------------------
      # 登录闭环：PKCE 必须 S256、授权参数齐全、校验先行、不带客户端密钥、
      # 失败收敛、本地状态 10 分钟过期（审计 A-01）
      # ------------------------------------------------------------------
      - name: 登录闭环门禁（PKCE S256 / 校验先行）
        run: npm run scan:oidc --workspace apps/web

      # 自检：**期望退出码 1**（8 个故意写错的桩必须全部被抓到）
      - name: 登录闭环门禁自检（期望退出码 1）
        run: |
          set +e
          npm run scan:oidc --workspace apps/web -- --self-test > scan-oidc-self-test.log 2>&1
          status=$?
          set -e
          cat scan-oidc-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 登录闭环自检退出码 $status，期望 1（0 说明门禁失效，2 说明无法装载实现）"
            exit 1
          fi
          echo "[PASS] 登录闭环门禁抓到全部负样本（明文挑战/漏参数/跳过校验/带密钥/GET 兑换/永不过期/兑换后才作废）"

      # ------------------------------------------------------------------
      # G-31：插件契约对齐（types.ts ↔ contracts/phase3.pl.json，逐键比对）
      # ------------------------------------------------------------------
      - name: G-31 插件契约对齐
        run: npm run scan:contract --workspace apps/web

      - name: G-31 契约检查自检（期望退出码 1）
        run: |
          set +e
          npm run scan:contract-self-test --workspace apps/web > scan-contract-self-test.log 2>&1
          status=$?
          set -e
          cat scan-contract-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 契约检查自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 契约检查抓到全部负样本（缺键/多键/可选性翻转/接口缺失），退出码 1 符合约定"

      # ------------------------------------------------------------------
      # G-27：工作台单宿主三项红线（单宿主 / 零按插件分支 / 零自有样式与三方 UI）
      # ------------------------------------------------------------------
      - name: G-27 工作台宿主门禁
        run: npm run scan:workbench --workspace apps/web

      - name: G-27 宿主门禁自检（期望退出码 1）
        run: |
          set +e
          npm run scan:workbench-self-test --workspace apps/web > scan-workbench-self-test.log 2>&1
          status=$?
          set -e
          cat scan-workbench-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 宿主门禁自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 宿主门禁抓到全部负样本（多宿主/非动态段/按插件分支/写死标识/自有样式/三方 UI/跨域引用）"

      # ------------------------------------------------------------------
      # G-30：能力使用一致性（跨层静态校验，枚举与后端 actions.py 同源）
      #
      # 严格模式：多要权限 / 使用未声明能力一律判失败，不放行整改期。
      # ------------------------------------------------------------------
      - name: G-30 能力使用一致性
        run: npm run scan:capability --workspace apps/web

      - name: G-30 一致性门禁自检（期望退出码 1）
        run: |
          set +e
          npm run scan:capability-self-test --workspace apps/web > scan-capability-self-test.log 2>&1
          status=$?
          set -e
          cat scan-capability-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 一致性门禁自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 一致性门禁抓到全部负样本（越权/多要/非法原语/非法能力键）"

  built-artifact-gate:
    name: 产物扫描（G-16）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖（根目录 workspaces 安装）
        run: npm ci --no-audit --no-fund

      - name: 构建产物（产物扫描的前置）
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_ADAPTER_BASE_URL: http://127.0.0.1:8000

      # G-16：扫 .next 产物的可见文本 + 5 位错误码，覆盖 10 个业务路由
      - name: G-16 构建产物禁词扫描
        run: npm run scan:banned-built --workspace apps/web

      - name: G-16 产物扫描器自检（期望退出码 1）
        run: |
          set +e
          npm run scan:banned-built --workspace apps/web -- --self-test > scan-built-self-test.log 2>&1
          status=$?
          set -e
          cat scan-built-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 产物扫描自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 产物扫描器在合成样本上命中禁词与 5 位错误码，退出码 1 符合约定"

  format-check:
    name: Prettier 格式校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: 格式校验
        run: |
          npx --yes prettier@3.3.3 --check \
            "apps/web/src/**/*.{ts,tsx,css}" \
            "apps/web/*.{json,js}" \
            || (echo "[WARN] 格式问题请执行: npx prettier --write ." && exit 1)

  # ------------------------------------------------------------------
  # 门禁 5：浏览器级 e2e（R2-QA-02，审计 2026-10-29）
  #
  # 修复前：`ci-web.yml` 明写「E2E 暂不进 CI」，且 `workflow.spec.ts` 缺凭据时
  # describe 级 skip —— 主链路「登录 → 兑换 → 工作台 → 插件」零浏览器级回归防线，
  # 而所有地方看到的都是"绿"。
  #
  # 修复后（H-04，2026-11-07 再收口）：
  # 1. `workflow.spec.ts` 缺凭据**必红**，且豁免开关 `OA_E2E_ALLOW_SKIP` 已删除
  #    —— 不存在"能永久跳过主旅程"的配置；
  # 2. 本 job 起 Keycloak（`.github/e2e/keycloak-realm-ci.json`）与适配层
  #    （`auth_mode=oidc`、内存存储），由浏览器真跑「统一登录 → 回调兑换 →
  #    工作台 → 安装插件」；
  # 3. 适配层探活失败即 job 失败，不再用 skip 包住前置条件。
  # ------------------------------------------------------------------
  e2e-gate:
    name: E2E 主旅程（真跑 SSO→兑换→工作台→插件安装，无跳过开关）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/adapter/uv.lock

      - name: 安装适配层依赖
        working-directory: apps/adapter
        run: uv sync --frozen

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      # H-04：主旅程不再允许跳过。CI 起一个 Keycloak 测试 realm（账号与重定向
      # 地址都来自 .github/e2e/keycloak-realm-ci.json），适配层切到 auth_mode=oidc，
      # 浏览器里真跑「统一点登录 → Keycloak 登录 → 回调兑换 → 工作台 → 安装插件」。
      - name: 启动 Keycloak 测试 realm（H-04）
        run: |
          set -euo pipefail
          docker run -d --name keycloak-e2e \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=e2e-admin-pass \
            -v "$PWD/.github/e2e:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.8.1 start-dev --import-realm
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/realms/officeai/.well-known/openid-configuration >/dev/null 2>&1; then
              echo "[PASS] Keycloak 测试 realm 就绪（第 ${i} 次探测）"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "[FAIL] Keycloak 180s 内未就绪" >&2
              docker logs keycloak-e2e >&2
              exit 1
            fi
            sleep 2
          done

      - name: 跑 e2e（含适配层生命周期管理）
        env:
          # 适配层健康探测走 IPv4 字面量（Node 的 DNS 解析可能优先 ::1）。
          OA_E2E_ADAPTER_BASE_URL: http://127.0.0.1:8000
          # 真实测试账号：来自 .github/e2e/keycloak-realm-ci.json
          OA_E2E_USERNAME: e2e.user
          OA_E2E_PASSWORD: e2e-pass-2026
          # 适配层切 OIDC：回调地址必须与 realm 里 redirectUris 逐字符一致。
          OA_AUTH_MODE: oidc
          OA_PUBLIC_BASE_URL: http://localhost:3100
          OA_KEYCLOAK_BASE_URL: http://127.0.0.1:8080
          OA_KEYCLOAK_REALM: officeai
          OA_KEYCLOAK_CLIENT_ID: officeai-adapter
          # Keycloak 签 RS256；默认 HS256 会在 token 校验处报 InvalidAlgorithmError
          # （H-04 本地实测：sso_complete 成功但 /sso/session 判无效）。
          OA_JWT_ALGORITHM: RS256
          # 令牌里的 `iss` 必须逐字符相等（deploy/keycloak/README.md 的口径）。
          OA_JWT_ISSUER: http://127.0.0.1:8080/realms/officeai
          # development：允许 http 基址，且 CORS 白名单含 localhost:3100。
          OA_ENV: development
          # B-5 硬化（提交 6cb89cb）：监听地址必须与实际绑定一致。
          OA_HOST: 127.0.0.1
          # 浏览器侧适配层地址用 localhost（与页面同站，Cookie/CSRF 判定通过）。
          NEXT_PUBLIC_ADAPTER_BASE_URL: http://localhost:8000
          PLAYWRIGHT_CHANNEL: chromium
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail

          # 适配层：business_store=memory，不连数据库也能起真实 OIDC 链路。
          cd apps/adapter
          .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/adapter.log 2>&1 &
          ADAPTER_PID=$!
          cd ../..
          trap 'kill "$ADAPTER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "[PASS] adapter /healthz 就绪（第 ${i} 次探测）"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "[FAIL] adapter 120s 内未就绪，e2e 前置不成立" >&2
              cat /tmp/adapter.log >&2
              exit 1
            fi
            sleep 2
          done

          npm run test:e2e --workspace apps/web

      - name: 停止 Keycloak（H-04）
        if: always()
        run: docker rm -f keycloak-e2e || true
