# ===========================================================================
# 前端 CI 门禁（架构文档 9.6）
#
# 强制项：ESLint 零 error、tsc 零 error
# 任一不过禁合并。
# ===========================================================================

name: CI Web

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'apps/web/**'
      # P2-20：`scripts/check-banned-terms.mjs` 的 PRD_PATH 指向本文件，`scan:words`
      # 从它的 §7 取词表真源。paths 不含它 → **只改 PRD §7 的 PR 不触发 ci-web**，
      # 词表漂移（退出码 3）在合并前不可见。
      - 'docs/prd-phase2-increment.md'
      # P2-20 同族：`scripts/check-capability-consistency.mjs:32-33` 读这两个源，
      # 而 paths 不含 `apps/adapter/**` → 改它们同样不触发本工作流的 scan:capability。
      - 'apps/adapter/app/plugins/actions.py'
      - 'apps/adapter/app/plugins/manifests/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'docs/prd-phase2-increment.md'
      - 'apps/adapter/app/plugins/actions.py'
      - 'apps/adapter/app/plugins/manifests/**'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # monorepo 采用 npm workspaces（workspaces: apps/*）：
    # package-lock.json 与 npm ci 均在仓库根，工作目录必须为根，
    # 否则 npm ci 找不到 lock 文件、CI 直接失败。
    working-directory: .

jobs:
  quality-gate:
    name: Lint / 类型 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # monorepo 采用 npm workspaces：lock 文件在仓库根，workspaces 声明为 apps/*
          # （此前误指向 apps/web/package-lock.json —— 该文件不存在，会导致
          #   setup-node 的缓存步骤直接失败，CI 无法运行）
          cache-dependency-path: package-lock.json

      - name: 安装依赖（根目录 workspaces 安装）
        run: npm ci --no-audit --no-fund

      # ------------------------------------------------------------------
      # 门禁 1：ESLint（零 error）
      # ------------------------------------------------------------------
      - name: eslint
        run: npm run lint:web

      # ------------------------------------------------------------------
      # 门禁 2：TypeScript 类型检查（零 error）
      # ------------------------------------------------------------------
      - name: tsc --noEmit
        run: npm run typecheck:web

      # ------------------------------------------------------------------
      # 门禁 3：前端单元测试（vitest）
      # E2E 需要浏览器与运行中的适配层，暂不进 CI；本地 `npm run test:e2e`。
      # ------------------------------------------------------------------
      - name: vitest
        run: npm run test --workspace apps/web

      # ------------------------------------------------------------------
      # 构建校验（确保产物可生成）
      # ------------------------------------------------------------------
      - name: next build
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_ADAPTER_BASE_URL: http://127.0.0.1:8000

  terminology-gate:
    name: 术语门禁（G-14 / G-15）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ------------------------------------------------------------------
      # G-14：禁词扫描（用户可见文案零命中，退出码必须为 0）
      # ------------------------------------------------------------------
      - name: G-14 禁词扫描（零命中）
        run: npm run scan:banned --workspace apps/web

      # ------------------------------------------------------------------
      # G-14 词表一致性：脚本内词表必须与 PRD 第 7 章同步（漂移退出码 3）
      # ------------------------------------------------------------------
      - name: G-14 词表与 PRD 一致性
        run: npm run scan:words --workspace apps/web

      # ------------------------------------------------------------------
      # G-15：扫描器自检。**退出码 1 表示自检通过**（12 条负样本全部命中）。
      # 注意：不用管道（`| tee` 之类会吞掉退出码），先重定向再判状态。
      # ------------------------------------------------------------------
      - name: G-15 扫描器自检（期望退出码 1）
        run: |
          set +e
          npm run scan:self-test --workspace apps/web > scan-self-test.log 2>&1
          status=$?
          set -e
          cat scan-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 自检退出码 $status，期望 1（0/2/3 均说明扫描器或词表异常）"
            exit 1
          fi
          echo "[PASS] 自检命中全部负样本，退出码 1 符合约定"

      # ------------------------------------------------------------------
      # G-17：占位词清零（暂不支持 / 敬请期待 等一律拦截，退出码必须为 0）
      # ------------------------------------------------------------------
      - name: G-17 占位词扫描（零命中）
        run: npm run scan:placeholders --workspace apps/web

      # ------------------------------------------------------------------
      # G-17 自检：同样**期望退出码 1**（负样本必须被抓到，否则门禁是假绿灯）
      # ------------------------------------------------------------------
      - name: G-17 占位词扫描器自检（期望退出码 1）
        run: |
          set +e
          npm run scan:placeholders-self-test --workspace apps/web > scan-placeholder-self-test.log 2>&1
          status=$?
          set -e
          cat scan-placeholder-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 占位词自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 占位词自检命中全部负样本，退出码 1 符合约定"

      # ------------------------------------------------------------------
      # G-18：10 个业务页三态齐备（错误态必须可重试）
      # ------------------------------------------------------------------
      - name: G-18 页面三态门禁
        run: npm run scan:pages --workspace apps/web

      - name: G-18 页面三态门禁自检（期望退出码 1）
        run: |
          set +e
          npm run scan:pages-self-test --workspace apps/web > scan-page-states-self-test.log 2>&1
          status=$?
          set -e
          cat scan-page-states-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 页面三态自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 页面三态自检抓到了全部负样本，退出码 1 符合约定"

      # ------------------------------------------------------------------
      # 登录闭环：PKCE 必须 S256、授权参数齐全、校验先行、不带客户端密钥、
      # 失败收敛、本地状态 10 分钟过期（审计 A-01）
      # ------------------------------------------------------------------
      - name: 登录闭环门禁（PKCE S256 / 校验先行）
        run: npm run scan:oidc --workspace apps/web

      # 自检：**期望退出码 1**（8 个故意写错的桩必须全部被抓到）
      - name: 登录闭环门禁自检（期望退出码 1）
        run: |
          set +e
          npm run scan:oidc --workspace apps/web -- --self-test > scan-oidc-self-test.log 2>&1
          status=$?
          set -e
          cat scan-oidc-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 登录闭环自检退出码 $status，期望 1（0 说明门禁失效，2 说明无法装载实现）"
            exit 1
          fi
          echo "[PASS] 登录闭环门禁抓到全部负样本（明文挑战/漏参数/跳过校验/带密钥/GET 兑换/永不过期/兑换后才作废）"

      # ------------------------------------------------------------------
      # G-31：插件契约对齐（types.ts ↔ contracts/phase3.pl.json，逐键比对）
      # ------------------------------------------------------------------
      - name: G-31 插件契约对齐
        run: npm run scan:contract --workspace apps/web

      - name: G-31 契约检查自检（期望退出码 1）
        run: |
          set +e
          npm run scan:contract-self-test --workspace apps/web > scan-contract-self-test.log 2>&1
          status=$?
          set -e
          cat scan-contract-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 契约检查自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 契约检查抓到全部负样本（缺键/多键/可选性翻转/接口缺失），退出码 1 符合约定"

      # ------------------------------------------------------------------
      # G-27：工作台单宿主三项红线（单宿主 / 零按插件分支 / 零自有样式与三方 UI）
      # ------------------------------------------------------------------
      - name: G-27 工作台宿主门禁
        run: npm run scan:workbench --workspace apps/web

      - name: G-27 宿主门禁自检（期望退出码 1）
        run: |
          set +e
          npm run scan:workbench-self-test --workspace apps/web > scan-workbench-self-test.log 2>&1
          status=$?
          set -e
          cat scan-workbench-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 宿主门禁自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 宿主门禁抓到全部负样本（多宿主/非动态段/按插件分支/写死标识/自有样式/三方 UI/跨域引用）"

      # ------------------------------------------------------------------
      # G-30：能力使用一致性（跨层静态校验，枚举与后端 actions.py 同源）
      #
      # 严格模式：多要权限 / 使用未声明能力一律判失败，不放行整改期。
      # ------------------------------------------------------------------
      - name: G-30 能力使用一致性
        run: npm run scan:capability --workspace apps/web

      - name: G-30 一致性门禁自检（期望退出码 1）
        run: |
          set +e
          npm run scan:capability-self-test --workspace apps/web > scan-capability-self-test.log 2>&1
          status=$?
          set -e
          cat scan-capability-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 一致性门禁自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 一致性门禁抓到全部负样本（越权/多要/非法原语/非法能力键）"

  built-artifact-gate:
    name: 产物扫描（G-16）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖（根目录 workspaces 安装）
        run: npm ci --no-audit --no-fund

      - name: 构建产物（产物扫描的前置）
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_ADAPTER_BASE_URL: http://127.0.0.1:8000

      # G-16：扫 .next 产物的可见文本 + 5 位错误码，覆盖 10 个业务路由
      - name: G-16 构建产物禁词扫描
        run: npm run scan:banned-built --workspace apps/web

      - name: G-16 产物扫描器自检（期望退出码 1）
        run: |
          set +e
          npm run scan:banned-built --workspace apps/web -- --self-test > scan-built-self-test.log 2>&1
          status=$?
          set -e
          cat scan-built-self-test.log
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 产物扫描自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 产物扫描器在合成样本上命中禁词与 5 位错误码，退出码 1 符合约定"

  format-check:
    name: Prettier 格式校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 格式校验
        run: |
          npx --yes prettier@3.3.3 --check \
            "apps/web/src/**/*.{ts,tsx,css}" \
            "apps/web/*.{json,js}" \
            || (echo "[WARN] 格式问题请执行: npx prettier --write ." && exit 1)
