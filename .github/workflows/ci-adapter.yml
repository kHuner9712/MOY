# ===========================================================================
# 适配层 CI 门禁（架构文档 9.6）
#
# 强制项：ruff（lint + format）、mypy（类型检查）、pytest（覆盖率 ≥ 85%）
# 任一不过禁合并。
# ===========================================================================

name: CI Adapter

on:
  # paths 必须覆盖**门禁自己要守的目录**，否则"改 deploy 的 PR 不跑守 deploy 的门禁"：
  # - deploy/**   → validate_config_names（编排注入的键名）/ validate_openapi / validate_*；
  # - docs/api/** → G4 与快照比对，否则快照可单方面提交而无人校验；
  # - scripts/**  → gen_delivery_manifest（清单生成器）与 check_error_catalog 的真源。
  # 这三类 diff 通常是几 KB，不会显著抬升额度。
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'apps/adapter/**'
      - 'deploy/**'
      - 'docs/api/**'
      - 'scripts/**'
      - '.github/workflows/ci-adapter.yml'
  pull_request:
    paths:
      - 'apps/adapter/**'
      - 'deploy/**'
      - 'docs/api/**'
      - 'scripts/**'
      - '.github/workflows/ci-adapter.yml'
  workflow_dispatch:

concurrency:
  group: ci-adapter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/adapter

jobs:
  quality-gate:
    name: Lint / 类型 / 测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ==================================================================
    # 真实 PostgreSQL 服务（审计 OA-AUDIT-001 / P0-4）
    #
    # 此前本 workflow **没有 PG 服务**，注释里写着"integration 用例一律 SKIP"，
    # 后果是 141 条 PG 用例（含 test_tenant_isolation.py 的 15 条租户隔离用例）
    # 在 CI 中从未执行，而无 PG 口径的覆盖率实测只有 **84.19% < 85%** ——
    # 门禁**不可能通过**，且多租户隔离这条最高红线在 CI 里等于没验。
    #
    # 镜像必须带 pgvector：迁移 0009 第一步就是 `CREATE EXTENSION vector`，
    # 纯 `postgres:18.6-alpine` 缺该扩展，会让记忆内核的用例在 CI 里必然红。
    # 与 `deploy/images.lock` 的 `pgvector/pgvector` 条目保持一致。
    #
    # R2-ARC-14（审计 2026-10-29）：tag 必须**精确**，不能再用滚动别名 `pg18`。
    # `pg18` 会随 PG 18.x 补丁滚动，CI 测的库与部署交付的库可以不是同一个版本；
    # 而 images.lock 已锁 `0.8.7-pg18-bookworm`（镜像内 PG 18.6，实测可拉取）。
    # 这处与 compose/lock 同源，否则「CI 全绿」证明不了交付物。
    # ==================================================================
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: officeai
          POSTGRES_PASSWORD: oa_ci_pw
          POSTGRES_DB: officeai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U officeai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # 测试库连接串：**必须是原生 `postgresql://`**
      # （`test_pg_error_surfacing.py` 直接把它交给 asyncpg，带 `+asyncpg` 会报
      #  invalid DSN；SQLAlchemy 一侧由 `to_async_dsn` 自行改写，两边都兼容。）
      OA_TEST_DATABASE_URL: postgresql://officeai_app:oa_ci_pw@localhost:5432/officeai
      OA_TEST_SUPERUSER_DATABASE_URL: postgresql://officeai:oa_ci_pw@localhost:5432/officeai
      # 缺陷台账的"当前批次"：`tests/expected_xfail.py::current_batch()` 未设置时
      # 默认回落 B21（与本地裸跑一致）。**批次推进时必须同步上调本值**——一旦调到 B30，
      # 台账中 3 条 `due_batch=B30` 的 open 缺陷会正确地判为「已过期」并报红。
      # 批次到期时钟由本值决定，升批需与 expected_xfail.py 同步（两处不同步时，
      # 要么过期缺陷被放过、要么未到期缺陷被误判为过期，两种都比不设时钟更糟）。
      OA_BATCH: B21

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # **必须全量历史**：交付清单门禁（`scripts/gen_delivery_manifest.py --check`）
          # 的证据列是「引入该文件的短 SHA」，它用 `git log --diff-filter=A -1` 反查。
          # 浅克隆（默认 fetch-depth: 1）查不到旧提交 → 证据算成 `待补` → 与清单不一致 → 恒定红。
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      # H-2（审计 2026-10-28）：改用 uv 锁定安装——uv.lock 是依赖版本的唯一
      # 事实源，`--frozen` 禁止现场重新解析，CI 环境与本地锁定环境一致。
      - name: 安装依赖（uv sync --frozen）
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/adapter/uv.lock

      # R2-QA-08（审计 2026-10-29）：`--frozen` 只保证「不更新锁文件」，
      # **不校验锁与 pyproject 是否一致**（那是 `--locked` / `uv lock --check` 的职责）。
      # 缺这一步时，「有人改了 pyproject 依赖但忘了 uv lock」这类漂移会在 CI 里
      # 静默放行——本地可复现性破口，而 CI 全绿。成本实测约 3ms。
      - name: 校验锁新鲜度（uv lock --check）
        run: uv lock --check

      - run: uv sync --frozen --extra dev

      # R2-QA-01（审计 2026-10-29）：`astral-sh/setup-uv` **只把 `uv` 本身加入 PATH**
      # （其 `activate-environment` 参数默认 false），而 `uv sync` 把依赖装进
      # `apps/adapter/.venv` 后并不会把该目录导出。于是下面所有 `ruff` / `mypy` /
      # `pytest` 裸命令在 runner 上都会 `command not found` —— 门禁在第 1 个 step
      # 就红，后面 20 余道门禁一步都跑不到。
      #
      # 这里显式导出而不是依赖 action 的参数名：`$GITHUB_PATH` 是 GitHub 的稳定
      # 契约，action 的入参名会随版本变。`$PWD` 是 job 的 working-directory
      # （apps/adapter），与 uv 创建 venv 的位置一致。
      - name: 把项目 venv 加入 PATH（R2-QA-01）
        shell: bash
        run: |
          set -euo pipefail
          test -d "$PWD/.venv/bin" || {
            echo "[FAIL] $PWD/.venv/bin 不存在：uv sync 未按预期创建 venv，门禁命令将不可用" >&2
            exit 1
          }
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          # 自检证据：写进日志，便于远端核对 PATH 是否生效
          ls -1 "$PWD/.venv/bin" | grep -E '^(ruff|mypy|pytest)$' || {
            echo "[FAIL] venv 内缺 ruff/mypy/pytest：请确认 uv sync 带了 --extra dev" >&2
            exit 1
          }

      # ------------------------------------------------------------------
      # 准备 PostgreSQL（审计 OA-AUDIT-001 / P0-4）
      #
      # 次序：基线 schema（phase2 / phase3）→ phase4 → 应用角色 → 迁移。
      # 与 `deploy/docker-entrypoint-initdb.d` **有一处置换**（已实测等价）：
      # initdb 里 `30-init-app-role.sql` 按字典序先于 `30-init-schema-phase4.sql`
      # （compose:64-70 明确要求如此，否则 phase4 的显式 `GRANT ... TO officeai_app`
      # 在角色不存在时只有一行 NOTICE 就静默跳过）。这里把 phase4 提到前面，靠
      # `init-app-role.sql` 的 `GRANT ... ON ALL TABLES IN SCHEMA public` +
      # `ALTER DEFAULT PRIVILEGES` 覆盖 phase4 建的表；两序实测均为 41 张表、
      # 应用角色对 phase4 六张表 DML 齐全，相关 8 个模块 67 条用例两序都绿。
      # 应用角色必须是 `NOSUPERUSER NOBYPASSRLS`：超级用户永久绕过 RLS，
      # 用它跑隔离用例会"全绿但无效"，夹具的 `assert_rls_not_bypassed` 会直接 fail。
      # ------------------------------------------------------------------
      - name: 准备 PostgreSQL（应用角色 + 基线 schema + 迁移）
        run: |
          set -euo pipefail

          # runner 通常自带 psql，但不做隐式假设：缺了就装（幂等，约 10s）
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          }

          export PGPASSWORD=oa_ci_pw
          PSQL="psql -h localhost -U officeai -d officeai -v ON_ERROR_STOP=1 -q"

          $PSQL -f ../../deploy/init-schema-phase2.sql
          $PSQL -f ../../deploy/init-schema-phase3.sql
          # 阶段四 schema：`background_job` / `tenant_budget` / `memory_*` 的建表者。
          # 缺这一步时迁移 0010 会以「角色不是库属主」失败——那是守卫的 fail-closed
          # 正确行为，不是 0010 的 bug（2026-10-27 真库实测：缺 phase4 → 52 条红）。
          $PSQL -f ../../deploy/init-schema-phase4.sql
          $PSQL -f ../../deploy/init-app-role.sql

          # `init-app-role.sql` 用占位口令建角色，该文件自身的运维要求就是
          # 「首次部署后必须立即改密」。这里改成与超级用户同口令——测试夹具
          # 派生 scratch 库时依赖「两者同口令」这一既有约定（派生规则见
          # `tests/integration/pg_fixture.py::_derive_superuser_dsn`）。
          $PSQL -c "ALTER ROLE officeai_app PASSWORD 'oa_ci_pw';"

          # glob 必须是 `0*.sql`：`000*.sql` 匹配不到 0010/0011（它们以 `001` 开头），
          # 而这两个迁移正是 phase4 表的「已存在则零 DDL」路径（2026-10-27 实测漏匹配）。
          for f in ../../deploy/migrations/0*.sql; do
            echo "== 应用迁移：$f"
            $PSQL -f "$f"
          done

          # 自检证据：应用角色必须 bypassrls=f
          $PSQL -tAc "SELECT 'app_role_bypassrls=' || rolbypassrls FROM pg_roles WHERE rolname='officeai_app'"
          $PSQL -tAc "SELECT 'app_role_bypassrls=' || rolbypassrls FROM pg_roles WHERE rolname='officeai_app'" | grep -q 'bypassrls=f'
          $PSQL -tAc "SELECT 'tables=' || count(*) FROM information_schema.tables WHERE table_schema='public'"
          $PSQL -tAc "SELECT 'policies=' || count(*) FROM pg_policies"

      # ------------------------------------------------------------------
      # 门禁 0：批次时钟（R2-QA-16，审计 2026-10-29；P1-5 于 2026-10-30 固化口径）
      #
      # `OA_BATCH` 是硬编码批次号，台账用 `due_batch` 表达"最迟哪批前必须处理完"。
      # 两者过去靠人记得同步：把 B21 一直留着永远合法、永远绿，而台账里
      # `due_batch=B30` 的到期缺陷就永远不会被判过期（静默放行）。
      # 本步把"时钟停了"变成红。
      #
      # `--check-docs` 再加一道：文档/本地脚本里硬编码的批次号（README ×2、
      # apps/adapter/README、qa/phase4-verify.sh）必须与 CI 这个值一致。
      # 升批时**每处都要改**，漏一处即红并列出具体行号——否则文档讲 B21、
      # 门禁按 B30 判，两套口径都自洽，评审无法判断哪个是真的。
      # ------------------------------------------------------------------
      - name: 批次时钟校验（OA_BATCH vs 台账 due_batch + 文档口径）
        run: python ../../deploy/validate_batch_clock.py --check-docs

      # 自检：**期望退出码 1**（落后 / 格式非法 / fixed 豁免 / 文档漂移 四类负样本必须命中）
      - name: 批次时钟门禁自检（期望退出码 1）
        run: |
          set +e
          python ../../deploy/validate_batch_clock.py --self-test
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "[FAIL] 批次时钟自检退出码 $code，期望 1（0 说明门禁失效）"
            exit 1
          fi
          echo "[PASS] 批次时钟自检命中全部负样本（落后/格式/豁免/文档漂移）"

      # ------------------------------------------------------------------
      # 门禁 1：Lint（ruff check）
      # ------------------------------------------------------------------
      - name: ruff check
        run: ruff check . --output-format=github

      # ------------------------------------------------------------------
      # 门禁 2：格式化校验（ruff format --check）
      # ------------------------------------------------------------------
      - name: ruff format --check
        run: ruff format --check .

      # ------------------------------------------------------------------
      # 门禁 2b：deploy/ 的**门禁脚本自己**也必须过 lint / format
      #
      # 工作流级 `defaults.run.working-directory` 是 `apps/adapter`，所以上面两步的
      # `ruff check .` 只扫适配层——`deploy/` 下 14 个校验脚本**从未被 lint 过**。
      # 后果是"守门的脚本自己是唯一无人看守的死角"：脚本里写了永远不生效的
      # `# noqa`（RUF100 会抓）、超长行淹没真正的 review 意见，都没有任何流程会发现。
      # 因此这里用 `../../deploy` + 适配层那份唯一的 ruff 配置（口径与生产代码一致，
      # 不另建第二份 pyproject）把 deploy/ 纳入同一道门禁。
      #
      # 当前基线是 **0 error / 0 待格式化**，这是 W3 收敛的结果（历史 61 条：
      # E501 38 / RUF100 13 / S310 3 / S603 2 / B905 2 / S112 1 / RUF005 1 / S607 1）。
      # 其中仅新增 6 处 `# noqa`（S310×3、S603×2、S607×1，均为"参数全为常量、
      # 无外部输入"的误报，逐条带理由），其余按语义修复（B905 补 strict=、
      # RUF100 删无效豁免、S112 改写为哨兵赋值、RUF005 改写为解包）。
      # **不允许**加 `--exit-zero`、放宽规则或扩大 exclude 把红变绿。
      # ------------------------------------------------------------------
      - name: ruff check (deploy/)
        run: ruff check ../../deploy --config pyproject.toml --output-format=github

      - name: ruff format --check (deploy/)
        run: ruff format --check ../../deploy --config pyproject.toml

      # ------------------------------------------------------------------
      # 门禁 2c：scripts/ 同样必须过 lint / format（与 2b 同源，紧邻其后）
      #
      # 为什么和 deploy/ 分开写而不合并成一步：两者的"红"指向不同的责任面
      # （deploy/ 是交付脚本，scripts/ 是仓库内工具与门禁生成器），合成一步后
      # 一个失败会盖住另一个的报告；分步则两步都报，修完一起绿。
      #
      # 死角成因与 2b 完全一样：工作流级 working-directory 是 `apps/adapter`，
      # 所以 `ruff check .` 扫不到 `scripts/`；而 `scripts/gen_delivery_manifest.py`
      # 是**清单门禁自己的生成器**——它错了，整份交付清单就跟着错。
      # 这类"没有人看守的脚本层"必须由 CI 显式点名，否则同类死角会一直平移。
      #
      # 当前基线是 **0 error / 0 待格式化**（历史 11 条：probe.py 5 条为既有历史债
      # —— S603×2 / S310×2 / RUF100×1；gen_delivery_manifest.py 6 条 —— E501×5 /
      # S603×1；另有一份 CRLF 待转 LF，仓库 `[tool.ruff.format] line-ending = "lf"`）。
      # 其中仅新增 4 处 `# noqa`（S310×2、S603×2），逐条带行尾理由：命令与 URL
      # 都是脚本内字面量/常量表，无外部输入。**不允许**加 `--exit-zero`、放宽规则
      # 或扩大 exclude 把红变绿；S310 若遇到"URL 来自参数/环境"就必须做 scheme
      # 白名单校验，不能用 noqa 掩盖。
      # ------------------------------------------------------------------
      - name: ruff check (scripts/)
        run: ruff check ../../scripts --config pyproject.toml --output-format=github

      - name: ruff format --check (scripts/)
        run: ruff format --check ../../scripts --config pyproject.toml

      # ------------------------------------------------------------------
      # 门禁 3：类型检查（mypy 零 error）
      # ------------------------------------------------------------------
      - name: mypy
        run: mypy app

      # ------------------------------------------------------------------
      # 门禁 4：错误码三处一致（G-13 / QA-P3-04）
      # 架构文档 §7.1 新增码 ⊆ errors.py；errors.py 码 ⊆ business-errors.ts；
      # ErrorCode 每个成员都必须在 ERROR_REGISTRY 注册。
      # B08（14005-14008）与 B09（15001-15009）均已落地 → 改用 --strict，
      # 不再放行任何批次：架构文档登记即必须落地，防止缺失码被静默掩盖成绿。
      # ------------------------------------------------------------------
      - name: 错误码三处一致（G-13）
        run: python scripts/check_error_catalog.py --strict

      # ------------------------------------------------------------------
      # 门禁 4a：编排配置名与 Settings 字段一致（G-35，配置名漂移）
      #
      # 起因：三套编排注入 `OA_KEYCLOAK_URL`，而字段是 `keycloak_base_url`
      # （环境变量 `OA_KEYCLOAK_BASE_URL`），pydantic 静默丢弃 → 配了等于没配。
      # 自检口径与 validate_deploy.py 那类**相反**：本脚本通过 0 / 拦截 1，
      # 所以直接跑即可，不要套 `-ne 1` 的断言（那会把健康门禁判成红）。
      # ------------------------------------------------------------------
      - name: 编排配置名一致性（G-35）
        working-directory: .
        run: python deploy/validate_config_names.py

      - name: 编排配置名门禁自检（G-35 可红证明）
        working-directory: .
        run: python deploy/validate_config_names.py --self-test

      # ------------------------------------------------------------------
      # 门禁 4b：依赖 PG 夹具的用例必须带 pg 标记（审计 P2-16）
      #
      # 未加 `--run-pg` 时 conftest 只跳过带 pg 标记的用例；缺标记的 PG 用例
      # 会在运行时由夹具静默跳过——既不在 `-m pg` 集合里，也不在带库
      # skipped=0 断言的覆盖范围内，形成「本地永远跳过、账面无感知」的黑洞。
      # ------------------------------------------------------------------
      - name: PG 标记一致性（P2-16）
        working-directory: .
        run: python deploy/validate_pg_markers.py

      - name: PG 标记门禁自检（可红证明）
        working-directory: .
        run: python deploy/validate_pg_markers.py --self-test

      # ------------------------------------------------------------------
      # 门禁 4c：分层依赖方向（G-37，审计 P1-3 ~ P1-7 / P2-9 ~ P2-11）
      #
      # `app/` 的二级包就是分层，§9.6 允许矩阵此前只是文档、没有机械校验：
      # 「顺手 import 一下」就能把方向反过来，而**测试全绿**（审计实测 28 处）。
      # 基线 `deploy/import_direction_baseline.txt` 登记的是「已评审、有消除计划」
      # 的存量违规（WARN 不阻断）；基线外违规、或基线行已消失（stale）都判红。
      # 脚本**没有** --update-baseline：只许减不许增。
      # ------------------------------------------------------------------
      - name: 分层依赖方向（P1-3~7）
        working-directory: .
        run: python deploy/validate_import_directions.py --baseline deploy/import_direction_baseline.txt

      # 第二条是「门禁必须能红」的机械证明：自检内部已在临时目录验证
      # 「基线外违规 exit 1 / stale exit 1 / 格式错误 exit 2 / 基线命中 WARN exit 0」，
      # 全部符合才是 exit 0；直接跑即可，不要套 `-ne 1`（本脚本自检成功 = 0）。
      - name: 依赖方向门禁自检（可红证明）
        working-directory: .
        run: python deploy/validate_import_directions.py --self-test

      # ------------------------------------------------------------------
      # 门禁 4c-2：仓储双实现一致性（G-38，审计 P1-8 / P1-8b）
      #
      # 每个仓储单元都是「内存实现 + PG 实现」，测试只跑内存、生产只跑 PG——两条路径
      # 只在线上才分叉。协议新增方法只补一侧、同名方法参数名/默认值不一致、同一 record
      # 在一侧少写字段，都**不会让任何用例变红**（实测 P1-8b：内存 `get_role` 的
      # `member_count` 恒 0，PG 返回真实计数）。本门禁把"形状一致"变成可执行的判据。
      #
      # 基线 `deploy/repository_parity_baseline.txt` 只许减不许增、无 --update-baseline；
      # 基线外违规与 stale 条目都判红。脚本自带 fail-closed（目录不存在 / 单元数 < 15
      # → exit 2），避免目录被移动后打印"违规 0 条"变绿。
      # ------------------------------------------------------------------
      - name: 仓储双实现一致性（P1-8）
        working-directory: .
        run: python deploy/validate_repository_parity.py --baseline deploy/repository_parity_baseline.txt

      # 同 G-37 的口径：自检成功 = exit 0（内部已逐条验证会红/会白/fail-closed），
      # 不要套 `-ne 1`。自检覆盖 12 类样本：三方一致、协议缺方法（两侧）、PG 多方法、
      # 内存多 clear 放行、PG 出现 clear、参数名/默认值/同步性不一致、基线三态、
      # 基线格式错 5 态、fail-closed 3 态、包形态召回与「壳里长类」拦截。
      - name: 双实现一致性门禁自检（可红证明）
        working-directory: .
        run: python deploy/validate_repository_parity.py --self-test

      # ------------------------------------------------------------------
      # 门禁 4d：交付清单与磁盘/任务表一致（阶段四 D-28 / LED-043）
      #
      # 曾出现 9 个已建交付物被标"待建"。清单由脚本从任务表生成，`--check`
      # 只校验不写盘。**注意脚本输出走 stderr**，CI 里不要用 `2>/dev/null`
      # 把它吞掉——红的时候那段文字是唯一能定位"哪一行失真"的信息。
      # ------------------------------------------------------------------
      - name: 交付清单一致性（--check 不写盘）
        working-directory: .
        run: python scripts/gen_delivery_manifest.py --check

      # ------------------------------------------------------------------
      # 门禁 4b：插件声明（G-26，阶段三 B16）
      # 6 段 schema + 能力/原语白名单 + 文案禁词 + 禁用键名 + 版本重复拒绝。
      # 第二条是「门禁必须能红」的机械证明：注入 6 条负样本全部被拦截时，
      # 脚本退出码为 1（这是**预期**的结果），所以要用 `-eq 1` 断言，
      # 直接跑会让"自检成功"看起来像失败。
      # ------------------------------------------------------------------
      - name: 插件声明校验（G-26）
        run: python ../../deploy/validate_plugins.py

      - name: 插件声明门禁自检（G-26 可红证明）
        run: |
          set +e
          python ../../deploy/validate_plugins.py --self-test
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "G-26 自检未按预期命中负样本（退出码 $code，期望 1）"
            exit 1
          fi
          echo "G-26 自检通过：6 条负样本全部被拦截"

      # ------------------------------------------------------------------
      # 门禁 4c：迁移脚本（B21）
      # 钉住 0004 那两次事故：① `END $$` 与 `DO $guard$` 标签不配 → 空库语法崩；
      # ② 无条件 `ALTER TABLE` → 已初始化库属主崩。
      #
      # 审计 OA-AUDIT-001 / P0-4：本 workflow 现已提供 PostgreSQL 服务，
      # 因此**双路径实跑进入 CI**（此前注释写着"没有 PG 服务、只跑静态"）。
      # 少跑这一条 = 只验了一条路径，等于没验：
      # 空库暴露语法崩、已初始化库暴露属主崩。
      # ------------------------------------------------------------------
      - name: 迁移门禁（静态 + 双路径实跑）
        run: python ../../deploy/validate_migrations.py --run-pg

      # ------------------------------------------------------------------
      # 门禁 4c-3：产物留存（G-31，阶段三 B28 第 7 项）
      #
      # 此前 `deploy/validate_schema_retention.py` 有完整判据与 `--self-test`，
      # 但**从未挂进任何 workflow**（`grep -n validate_schema_retention
      # .github/workflows/*.yml` 零命中）：判据写得再准，不跑就等于零——这与
      # 「有 PG 服务却没人带 --run-pg」是同一类死角（审计 OA-AUDIT-001 / P0-4）。
      #
      # 判据：`plugin_task.expires_at` / `plugin_artifact.expires_at` 列在、
      # 类型是 `timestamptz`、默认值是 `now() + INTERVAL '180 days'`
      # （PRD Q3-5 / ADJ-8 唯一口径，改天数属法规变更须评审）。
      #
      # **必须带 `--run-pg`**：静态解析只能证明 .sql 文本写对了，证明不了库里的列
      # 真长那样——迁移没跑到、或有人手工 `ALTER` 过，静态检查照样全绿。
      # 本 workflow 已有 PostgreSQL 服务且 `OA_TEST_DATABASE_URL` 在 job env 里；
      # 缺该变量时脚本以 **exit 2** 失败（明确"不视为通过"），不会静默变绿。
      # ------------------------------------------------------------------
      - name: 产物留存门禁（静态 + 真库）
        run: python ../../deploy/validate_schema_retention.py --run-pg

      - name: 产物留存门禁自检（G-31 可红证明）
        run: |
          set +e
          python ../../deploy/validate_schema_retention.py --self-test
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "G-31 自检未按预期命中负样本（退出码 $code，期望 1）"
            exit 1
          fi
          echo "G-31 自检通过：90 天 / 缺列 / timestamp 三类负样本全部被拦截"

      # ------------------------------------------------------------------
      # 门禁 4c-4：门禁接线体检（C-1 / C-4，第三波「判据存在 ≠ 判据在跑」）
      #
      # 本 workflow 自己就曾是这个门禁要抓的对象：`validate_schema_retention.py`
      # 判据齐全但从未被任何 workflow 引用（`grep` 零命中）；PG 初始化缺 phase4、
      # 迁移 glob 写成 `000*.sql`（匹配不到 0010/0011）。三条死角的共同点是
      # **绿的理由是"没检查"**，而日志里看不出来——所以必须有机械判据：
      #   C-1 反向遍历 `deploy/validate_*.py`，逐个查是否被引用（不排除自身）；
      #   C-4 仓库 SQL 与 CI 实际执行集合做差集（glob 展开成实际文件再比）。
      # 退出码：0 通过 / 1 有发现 / 2 自身无法判定（workflow 缺失，fail-closed）。
      #
      # **本 step 必须先于主体检存在**：脚本未挂 CI 时它会正确地报自己红
      # （self-test 的负样本 2 就是这条自指样本），挂上后即绿——这不是巧合，
      # 而是"遍历而非白名单"的反证。
      # ------------------------------------------------------------------
      - name: 门禁接线体检（C-1 反向遍历 + C-4 初始化差集）
        run: python ../../deploy/validate_gate_wiring.py

      - name: 门禁接线体检自检（可红证明）
        run: |
          set +e
          python ../../deploy/validate_gate_wiring.py --self-test
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "门禁接线自检未按预期命中负样本（退出码 $code，期望 1）"
            exit 1
          fi
          echo "门禁接线自检通过：6 条样本（含自指）全部符合预期"

      - name: 迁移门禁自检（可红证明）
        run: |
          set +e
          python ../../deploy/validate_migrations.py --self-test
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "迁移门禁自检未按预期命中负样本（退出码 $code，期望 1）"
            exit 1
          fi
          echo "迁移门禁自检通过：3 类负样本全部被拦截"

      # ------------------------------------------------------------------
      # 门禁 4d：打包完整性（G-32，审计 OA-AUDIT-001 P0-1）
      # 钉住的事故：`pyproject.toml` 手工枚举 `packages`，漏登 `app.business` /
      # `app.db` / `app.plugins` → `pip wheel` 产物里这三个包 0 个文件。
      # Dockerfile 用 `pip install .`（**非 editable**），容器启动即 ImportError；
      # 而本地 editable 安装把缺陷完全掩盖，全量测试照常全绿。
      # 三条判据：包齐全 / 包内资源已声明 / 声明非空。
      # ------------------------------------------------------------------
      - name: 打包完整性门禁（G-32）
        run: python ../../deploy/validate_packaging.py

      - name: 打包门禁自检（可红证明）
        run: |
          set +e
          python ../../deploy/validate_packaging.py --self-test
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "打包门禁自检未按预期命中负样本（退出码 $code，期望 1）"
            exit 1
          fi
          echo "打包门禁自检通过：3 类负样本全部被拦截"

      # ------------------------------------------------------------------
      # 门禁 5：测试 + 覆盖率 ≥ 85%（G-05 硬地板）
      # 阶段二测试方案 §2.1 G-05：总覆盖率下限 85%，业务层（app/business）
      # 阶段门目标 90.5%；此前的 80% 是阶段一口径，W-01 豁免单已到期。
      # 说明：当前批次实测值见 docs/archive/qa-phase2-w1-r03-report.md；未达标即禁合并，
      # 不允许用 --cov-fail-under 参数临时放宽（W-01 单约束）。
      #
      # 审计 OA-AUDIT-001 / P0-4：**必须带 `--run-pg`**。不带时 PG 用例整批跳过
      # （当前 212 skipped），且隔离用例一条都没跑；历史上无 PG 口径的覆盖率实测
      # 只有 84.19%（<85%，旧口径），门禁不可能通过。
      #
      # 带 PG 后实测（2026-10-27，QA 真库，JUnit 权威计数）：
      #   `tests=2325 skipped=0 failures=0 errors=0`（593.78s）。
      #   此前的「1597 passed / 0 skipped / 覆盖率 89.81%」**已过期**：用例数从
      #   1597 涨到 2325，覆盖率分母随之变化，旧百分比不可直接沿用。
      # 覆盖率：**待 CI 首次实跑确认**——以本步骤带 `--cov-fail-under=85` 的首次
      #   真实结果为准，不预先写数字（写成"已知达标"会让首次实跑的失败无人预期）。
      #
      # 另：`--run-pg` 下**不允许有 skip**（QA 口径：带 PG 时 skipped 即红），
      # 因此这里额外断言 skipped=0，防止将来某个 PG 夹具静默退化成 skip。
      # ------------------------------------------------------------------
      - name: pytest（含覆盖率门禁）
        run: |
          pytest tests -q \
            --run-pg \
            --junitxml=junit.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      - name: 断言无静默跳过（带 PG 口径 skipped 必须为 0）
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)

          print(f"用例 {tests} / 跳过 {skipped} / 失败+错误 {failures}")
          # QA 口径：带 --run-pg 时 skipped 必须为 0（夹具静默退化成 skip = 假绿）
          if skipped:
              print(f"[FAIL] 带 --run-pg 仍有 {skipped} 条用例被跳过，PG 夹具可能已退化")
              sys.exit(1)
          if failures:
              print(f"[FAIL] 存在 {failures} 条失败/错误")
              sys.exit(1)
          print("[OK] 带 PG 口径 0 跳过、0 失败")
          PY

      # ------------------------------------------------------------------
      # 门禁 5b：PG 仓储实现覆盖下限（P1，审计 2026-10-30 M1 收口）
      #
      # 钉住的盲区：无 PG 口径下 `db/repositories/*/postgres.py` 覆盖仅
      # 16%~31%（task 16.48 / billing 22.61 / plugin 25.38 / org 26.87 /
      # usage 30.61），总覆盖率 85% 门禁由内存实现撑起——生产主路径（PG）
      # 反而是本地覆盖盲区。本步骤在**带 PG 的覆盖率数据**上单算 postgres.py
      # 分项合计，低于下限即红，防止总指标好看但 PG 实现裸奔。
      #
      # 下限 88 来源（审计 2026-11-02 M2 收口，2026-11-02 拍板）：带 PG 口径
      # **实测 90.66%**，取 88 = 实测 − 2.66pp 余量（不是拍的数字）。原保守起点
      # 50 已完成使命——它只能证明"PG 用例跑过"，证明不了"PG 实现被覆盖"。
      # 只升不降（与 G-05 同纪律）：实测上移后按「实测 − 2~3pp」再校准。
      # ------------------------------------------------------------------
      - name: PG 仓储覆盖下限（db/repositories/*/postgres.py ≥ 88%）
        run: |
          coverage report \
            --include="*/db/repositories/*/postgres.py" \
            --show-missing \
            --fail-under=88

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adapter-junit
          path: apps/adapter/junit.xml
          retention-days: 14

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adapter-coverage
          path: apps/adapter/coverage.xml
          retention-days: 14

  registry-validation:
    name: 注册表配置校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: 校验 YAML/JSON 语法与注册表语义
        working-directory: .
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import json
          import pathlib
          import sys

          import yaml

          root = pathlib.Path('.')
          failed = False

          # 1) YAML 语法校验
          for path in sorted(root.glob('**/*.yml')) + sorted(root.glob('**/*.yaml')):
              if 'node_modules' in path.parts:
                  continue
              try:
                  # multi-doc（k8s 清单常用 `---` 一分隔多资源）必须按 safe_load_all
                  # 逐文档校验：safe_load 遇多文档会报 "expected a single document"
                  #（M3 取证发现：k8s/base/ingress.yaml 双 Ingress 被误判语法错）
                  for _doc in yaml.safe_load_all(path.read_text(encoding='utf-8')):
                      pass
                  print(f'[OK]   yaml  {path}')
              except yaml.YAMLError as exc:
                  print(f'[FAIL] yaml  {path}: {exc}')
                  failed = True

          # 2) JSON 语法校验
          for path in sorted(root.glob('**/*.json')):
              if 'node_modules' in path.parts or '.next' in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
                  print(f'[OK]   json  {path}')
              except json.JSONDecodeError as exc:
                  print(f'[FAIL] json  {path}: {exc}')
                  failed = True

          sys.exit(1 if failed else 0)
          PY

      - name: 校验工具注册表与连接器实现一致
        # 工作流级 defaults 已把 cwd 设为 apps/adapter，本步显式回到仓库根，
        # 再由脚本内 `cd apps/adapter` 进入适配层目录（与后续各步同风格）。
        working-directory: .
        run: |
          # 内联脚本要 import app 包（连接器靠 import 副作用完成注册），
          # 需先安装适配层运行时依赖。仓库根无 Python 工程（唯一工程在
          # apps/adapter），故按路径显式安装；此前本 job 只装了 pyyaml，
          # 脚本必死于 ModuleNotFoundError。检查判定逻辑与修复前逐字一致。
          python -m pip install -e apps/adapter
          cd apps/adapter
          python - <<'PY'
          import importlib
          import sys

          from app.registry.loader import get_tool_registry
          from app.services.tool_service import _CONNECTOR_MODULES
          from app.tools.base import ConnectorRegistry

          # 连接器模块清单的单一真源是 tool_service._CONNECTOR_MODULES：
          # 新增连接器只需在那一处登记模块路径，本门禁与
          # ToolService._load_connectors 自动跟随同一份清单，
          # 杜绝「注册表登记了却没人 import」的静默缺口（审计 P0-1）。
          # 本脚本是 CI 一次性内联脚本、不属 app 包，读取该内部常量不受 SLF 约束。
          for module_path in _CONNECTOR_MODULES:
              importlib.import_module(module_path)

          registry = get_tool_registry()
          registered = ConnectorRegistry.all()
          failed = False

          for spec in registry.tools:
              if spec.connector_impl not in registered:
                  print(f'[FAIL] 注册条目 {spec.tool_type} 的连接器未实现: {spec.connector_impl}')
                  failed = True
                  continue
              connector_cls = registered[spec.connector_impl]
              supported = set(getattr(connector_cls, 'SUPPORTED_OPERATIONS', ()))
              declared = set(spec.operation_names())
              if not supported:
                  print(f'[WARN] {spec.tool_type} 未声明 SUPPORTED_OPERATIONS')
              elif supported != declared:
                  print(f'[FAIL] {spec.tool_type} 能力清单不一致: 注册表={sorted(declared)} 连接器={sorted(supported)}')
                  failed = True
              else:
                  print(f'[OK]   {spec.tool_type} 能力清单一致')

          sys.exit(1 if failed else 0)
          PY

      - name: 校验 ADR 编号唯一（防重号）
        working-directory: .
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys
          from collections import defaultdict

          adr_dir = pathlib.Path('docs/adr')
          numbers: dict[str, list[str]] = defaultdict(list)

          for path in sorted(adr_dir.glob('*.md')):
              match = re.match(r'^(\d{4})-', path.name)
              if match:
                  numbers[match.group(1)].append(path.name)

          failed = False
          for number, files in sorted(numbers.items()):
              if len(files) > 1:
                  print(f'[FAIL] ADR 编号 {number} 重号：{files}')
                  failed = True
              else:
                  print(f'[OK]   ADR {number} 唯一：{files[0]}')

          sys.exit(1 if failed else 0)
          PY

      - name: 校验基础设施镜像清单（P0）
        working-directory: .
        run: |
          python -m pip install pyyaml
          python deploy/validate_images.py

      - name: 校验依赖清单一致性与加固约束
        working-directory: .
        run: |
          python -m pip install pyyaml
          python deploy/validate_deps.py

      - name: 校验部署形态一致性（G-34）
        working-directory: .
        run: |
          python -m pip install pyyaml
          python deploy/validate_deploy.py
          set +e
          python deploy/validate_deploy.py --self-test
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "部署形态门禁自检未按预期命中负样本（退出码 $code，期望 1）"
            exit 1
          fi
          echo "部署形态门禁自检通过：负样本行为符合预期"

      # ------------------------------------------------------------------
      # 门禁 4f：告警规则与投递链路自证（H-01，审计 2026-11-07）
      #
      # 此前 `alert.rules.yml` 与 `prometheus.yml` 在 CI **零引用**（M-05）：
      # 规则表达式写错、`alerting.alertmanagers` 没接线，都能一路绿到交付。
      # 三道都必须过：
      #   1) promtool check rules  —— 规则语法/持续时间/标签；
      #   2) promtool check config —— `rule_files` 可达 + `alerting` 接线合法；
      #   3) amtool check-config   —— Alertmanager 基线 + 入口脚本渲染后的两态
      #      （无 webhook → critical 回落 null；有 webhook → URL 含 `&` 不被写坏）。
      # 镜像 tag 与 compose / images.lock 一致：门禁证明的就是交付物本身。
      # ------------------------------------------------------------------
      - name: 告警规则与投递链路自证（H-01）
        working-directory: .
        run: |
          set -euo pipefail
          PROM_IMAGE=prom/prometheus:v3.15.0
          AM_IMAGE=prom/alertmanager:v0.28.1

          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy:/deploy:ro" "$PROM_IMAGE" \
            check rules /deploy/alert.rules.yml

          # 11 组确定性回归（含负样本）：规则的时间语义/阈值边界/标签保留，
          # 改表达式或 `for` 时这里会先红，而不是等故障时才发现。
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy:/etc/prometheus:ro" "$PROM_IMAGE" \
            test rules /etc/prometheus/alert.rules.test.yml

          docker run --rm --entrypoint /bin/promtool -e OA_DEPLOY_MODE=private \
            -v "$PWD/deploy/prometheus.yml:/deploy/prometheus.yml:ro" \
            -v "$PWD/deploy/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro" \
            "$PROM_IMAGE" check config /deploy/prometheus.yml

          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/deploy:/etc/alertmanager:ro" "$AM_IMAGE" \
            check-config /etc/alertmanager/alertmanager.yml

          for url in "" "https://example.com/hook?a=1&b=2"; do
            echo "== Alertmanager 渲染态：OA_ALERT_WEBHOOK_URL=[${url}]"
            docker run --rm \
              -e OA_ALERT_WEBHOOK_URL="$url" \
              -e ALERTMANAGER_OUT=/tmp/alertmanager.yml \
              -v "$PWD/deploy:/etc/alertmanager:ro" \
              --entrypoint /bin/sh "$AM_IMAGE" \
              -c "sh /etc/alertmanager/alertmanager-entrypoint.sh --render-only && \
                  /bin/amtool check-config /tmp/alertmanager.yml"
          done

      - name: 依赖漏洞扫描（pip-audit，独立 venv）
        working-directory: .
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/python -m pip install --quiet pip-audit
          # 注意：GitHub Actions 的 bash 支持进程替换，但为与本地 Windows 环境
          # 保持一致，统一走临时文件（tomllib 提取，不能用正则——extras 的
          # 方括号会提前截断）。
          /tmp/audit-venv/bin/python - <<'PY'
          import subprocess, sys, tempfile, tomllib
          from pathlib import Path
          data = tomllib.loads(Path("apps/adapter/pyproject.toml").read_text(encoding="utf-8"))
          deps = data["project"]["dependencies"]
          with tempfile.TemporaryDirectory() as tmp:
              req = Path(tmp) / "requirements.txt"
              req.write_text("\n".join(deps) + "\n", encoding="utf-8")
              sys.exit(subprocess.run(
                  [sys.executable, "-m", "pip_audit", "-r", str(req), "--progress-spinner", "off"]
              ).returncode)
          PY

  openapi-export:
    name: 导出 OpenAPI 接口规范
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gate

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      # 契约门禁脚本是零依赖 Node 脚本（只用 node:fs / node:path），
      # 因此只需 Node 运行时，不必 `npm ci`（省 2-3 分钟与一次 lock 校验）。
      - name: 安装 Node.js（契约门禁用）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: 安装依赖
        working-directory: apps/adapter
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 端点基线门禁（G1-G7）
        # D-09 / D-21：五套基线 —— 核心 30（冻结）+ 阶段二新域 38（冻结）
        # + 阶段三插件域 16 + 阶段四 10 + W1 2，**全部严格**（无放宽参数）。
        # `--allow-missing-phase2` 已于 W2 移除：阶段二 38 条早已全部交付，
        # "已登记但未实现"的中间态不再存在；留一个"允许缺项"的参数，等于给
        # "删端点让 CI 变绿"留合法通道（见 deploy/validate_openapi.py 文档头）。
        # 不允许为了过门禁而删除参数或改写基线文件（baseline-core-30.json 受保护）。
        # `--strict`：阶段四/W1 的「已登记未实现」也判红。W2 起这两批全部落地
        # （本地实测 phase4 10/10、w1 2/2，strict 仍 exit 0），此后回到严格口径，
        # 避免 PENDING 行长期只打印不判红。
        working-directory: .
        run: |
          python deploy/validate_openapi.py --strict

      # W-01 契约换源（§7-4 裁决：gen 门禁放本 job，不放 ci-web）：
      # 1) `--check` 证明入库的 gen 文件与后端 OpenAPI 一致（后端改了没重生成 → 红）；
      # 2) `--generated` 证明 gen ↔ types.ts ↔ 手写快照三方键集合一致。
      # 脚本零依赖（只 node 内建），故只需 Node 运行时，不必 `npm ci`。
      - name: 插件域契约换源门禁（gen ↔ 后端 / gen ↔ 前端）
        working-directory: .
        run: |
          python deploy/export_plugin_contract.py --check
          node apps/web/scripts/check-plugin-contract.mjs --generated

      - name: 插件域契约门禁自检（期望退出码 1）
        working-directory: .
        run: |
          set +e
          node apps/web/scripts/check-plugin-contract.mjs --generated --self-test
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "[FAIL] 生成契约门禁自检退出码 $status，期望 1"
            exit 1
          fi
          echo "[PASS] 生成契约门禁抓到全部负样本（缺键/多键/接口缺失/白名单外快照接口）"

      - name: 对外文档禁止泄露底座术语
        # 保留阶段一既有扫描（G5 已在 validate_openapi.py 内覆盖，
        # 此步骤作为独立可读的兜底，禁止删除）
        working-directory: .
        run: |
          python - <<'PY'
          import json
          import pathlib

          text = pathlib.Path('docs/api/openapi.json').read_text(encoding='utf-8').lower()
          leaked = [w for w in ('dify', 'milvus', 'litellm', 'chat-messages') if w in text]
          if leaked:
              print(f'[FAIL] 对外文档泄露底座术语: {leaked}')
              raise SystemExit(1)
          print('[OK]   对外文档未泄露底座术语')
          PY

      - name: 上传接口规范
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-spec
          path: docs/api/openapi.json
          retention-days: 30
