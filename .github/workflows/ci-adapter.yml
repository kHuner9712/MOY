# ===========================================================================
# 适配层 CI 门禁（架构文档 9.6）
#
# 强制项：ruff（lint + format）、mypy（类型检查）、pytest（覆盖率 ≥ 85%）
# 任一不过禁合并。
# ===========================================================================

name: CI Adapter

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'apps/adapter/**'
      - '.github/workflows/ci-adapter.yml'
  pull_request:
    paths:
      - 'apps/adapter/**'
      - '.github/workflows/ci-adapter.yml'
  workflow_dispatch:

concurrency:
  group: ci-adapter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/adapter

jobs:
  quality-gate:
    name: Lint / 类型 / 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/adapter/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ------------------------------------------------------------------
      # 门禁 1：Lint（ruff check）
      # ------------------------------------------------------------------
      - name: ruff check
        run: ruff check . --output-format=github

      # ------------------------------------------------------------------
      # 门禁 2：格式化校验（ruff format --check）
      # ------------------------------------------------------------------
      - name: ruff format --check
        run: ruff format --check .

      # ------------------------------------------------------------------
      # 门禁 3：类型检查（mypy 零 error）
      # ------------------------------------------------------------------
      - name: mypy
        run: mypy app

      # ------------------------------------------------------------------
      # 门禁 4：错误码三处一致（G-13 / QA-P3-04）
      # 架构文档 §7.1 新增码 ⊆ errors.py；errors.py 码 ⊆ business-errors.ts；
      # ErrorCode 每个成员都必须在 ERROR_REGISTRY 注册。
      # B08（14005-14008）与 B09（15001-15009）均已落地 → 改用 --strict，
      # 不再放行任何批次：架构文档登记即必须落地，防止缺失码被静默掩盖成绿。
      # ------------------------------------------------------------------
      - name: 错误码三处一致（G-13）
        run: python scripts/check_error_catalog.py --strict

      # ------------------------------------------------------------------
      # 门禁 5：测试 + 覆盖率 ≥ 85%（G-05 硬地板）
      # 阶段二测试方案 §2.1 G-05：总覆盖率下限 85%，业务层（app/business）
      # 阶段门目标 90.5%；此前的 80% 是阶段一口径，W-01 豁免单已到期。
      # 说明：当前批次实测值见 docs/qa-phase2-w1-report.md；未达标即禁合并，
      # 不允许用 --cov-fail-under 参数临时放宽（W-01 单约束）。
      # ------------------------------------------------------------------
      - name: pytest（含覆盖率门禁）
        run: |
          pytest tests -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-coverage
          path: apps/adapter/coverage.xml
          retention-days: 14

  registry-validation:
    name: 注册表配置校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 校验 YAML/JSON 语法与注册表语义
        working-directory: .
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import json
          import pathlib
          import sys

          import yaml

          root = pathlib.Path('.')
          failed = False

          # 1) YAML 语法校验
          for path in sorted(root.glob('**/*.yml')) + sorted(root.glob('**/*.yaml')):
              if 'node_modules' in path.parts:
                  continue
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
                  print(f'[OK]   yaml  {path}')
              except yaml.YAMLError as exc:
                  print(f'[FAIL] yaml  {path}: {exc}')
                  failed = True

          # 2) JSON 语法校验
          for path in sorted(root.glob('**/*.json')):
              if 'node_modules' in path.parts or '.next' in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
                  print(f'[OK]   json  {path}')
              except json.JSONDecodeError as exc:
                  print(f'[FAIL] json  {path}: {exc}')
                  failed = True

          sys.exit(1 if failed else 0)
          PY

      - name: 校验工具注册表与连接器实现一致
        run: |
          cd apps/adapter
          python - <<'PY'
          import sys

          from app.registry.loader import get_tool_registry
          from app.tools.base import ConnectorRegistry
          import app.tools.email_connector  # noqa: F401
          import app.tools.github_connector  # noqa: F401

          registry = get_tool_registry()
          registered = ConnectorRegistry.all()
          failed = False

          for spec in registry.tools:
              if spec.connector_impl not in registered:
                  print(f'[FAIL] 注册条目 {spec.tool_type} 的连接器未实现: {spec.connector_impl}')
                  failed = True
                  continue
              connector_cls = registered[spec.connector_impl]
              supported = set(getattr(connector_cls, 'SUPPORTED_OPERATIONS', ()))
              declared = set(spec.operation_names())
              if not supported:
                  print(f'[WARN] {spec.tool_type} 未声明 SUPPORTED_OPERATIONS')
              elif supported != declared:
                  print(f'[FAIL] {spec.tool_type} 能力清单不一致: 注册表={sorted(declared)} 连接器={sorted(supported)}')
                  failed = True
              else:
                  print(f'[OK]   {spec.tool_type} 能力清单一致')

          sys.exit(1 if failed else 0)
          PY

      - name: 校验 ADR 编号唯一（防重号）
        working-directory: .
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys
          from collections import defaultdict

          adr_dir = pathlib.Path('docs/adr')
          numbers: dict[str, list[str]] = defaultdict(list)

          for path in sorted(adr_dir.glob('*.md')):
              match = re.match(r'^(\d{4})-', path.name)
              if match:
                  numbers[match.group(1)].append(path.name)

          failed = False
          for number, files in sorted(numbers.items()):
              if len(files) > 1:
                  print(f'[FAIL] ADR 编号 {number} 重号：{files}')
                  failed = True
              else:
                  print(f'[OK]   ADR {number} 唯一：{files[0]}')

          sys.exit(1 if failed else 0)
          PY

      - name: 校验基础设施镜像清单（P0）
        working-directory: .
        run: |
          python -m pip install pyyaml
          python deploy/validate_images.py

      - name: 校验依赖清单一致性与加固约束
        working-directory: .
        run: |
          python -m pip install pyyaml
          python deploy/validate_deps.py

      - name: 依赖漏洞扫描（pip-audit，独立 venv）
        working-directory: .
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/python -m pip install --quiet pip-audit
          # 注意：GitHub Actions 的 bash 支持进程替换，但为与本地 Windows 环境
          # 保持一致，统一走临时文件（tomllib 提取，不能用正则——extras 的
          # 方括号会提前截断）。
          /tmp/audit-venv/bin/python - <<'PY'
          import subprocess, sys, tempfile, tomllib
          from pathlib import Path
          data = tomllib.loads(Path("apps/adapter/pyproject.toml").read_text(encoding="utf-8"))
          deps = data["project"]["dependencies"]
          with tempfile.TemporaryDirectory() as tmp:
              req = Path(tmp) / "requirements.txt"
              req.write_text("\n".join(deps) + "\n", encoding="utf-8")
              sys.exit(subprocess.run(
                  [sys.executable, "-m", "pip_audit", "-r", str(req), "--progress-spinner", "off"]
              ).returncode)
          PY

  openapi-export:
    name: 导出 OpenAPI 接口规范
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gate

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        working-directory: apps/adapter
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 端点基线门禁（G1-G5）
        # D-09：核心基线冻结 30 + 阶段二新域 38 = 68；B02-B10 期间用
        # --allow-missing-phase2 放宽「已登记但尚未实现」的新域端点。
        # 不允许为了过门禁而删除该参数或改写基线文件（baseline-core-30.json 受保护）。
        working-directory: .
        run: |
          python deploy/validate_openapi.py --allow-missing-phase2

      - name: 对外文档禁止泄露底座术语
        # 保留阶段一既有扫描（G5 已在 validate_openapi.py 内覆盖，
        # 此步骤作为独立可读的兜底，禁止删除）
        working-directory: .
        run: |
          python - <<'PY'
          import json
          import pathlib

          text = pathlib.Path('docs/api/openapi.json').read_text(encoding='utf-8').lower()
          leaked = [w for w in ('dify', 'milvus', 'litellm', 'chat-messages') if w in text]
          if leaked:
              print(f'[FAIL] 对外文档泄露底座术语: {leaked}')
              raise SystemExit(1)
          print('[OK]   对外文档未泄露底座术语')
          PY

      - name: 上传接口规范
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/api/openapi.json
          retention-days: 30
