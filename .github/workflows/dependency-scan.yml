# ===========================================================================
# 依赖安全扫描（架构文档 9.6 / 总方案 5.3）
#
# 两道强制门禁：
#   1. SCA 协议扫描：发现 GPL/AGPL/SSPL 黑名单协议即失败；
#   2. 底座直连扫描：apps/web 中出现 dify/milvus/litellm/5001 等字样即失败
#      （架构文档 1.4 红线的代码级防线）。
#
# 触发时机：PR 触发 + 每月全量（cron）。
# ===========================================================================

name: Dependency Scan

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'deploy/**'
      - 'package.json'
      - '.github/workflows/dependency-scan.yml'
  push:
    branches: [main, develop]
  schedule:
    # 每月 1 日 02:00 UTC 全量扫描
    - cron: '0 2 1 * *'
  workflow_dispatch:

concurrency:
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # 门禁 1：底座直连扫描（一票否决级，架构文档 1.4）
  # =========================================================================
  base-layer-isolation:
    name: 底座直连扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 扫描 apps/web 与插件目录中的底座字样
        run: |
          echo "::group::扫描前端与插件代码中的底座直连痕迹"
          # 禁止出现的底座关键词（架构文档 1.4 第 4 条 + 9.6）
          #
          # ⚠️ 规则收窄（审计 OA-AUDIT-001 / P1-2）：原 `5001` 是**裸子串**，
          #    会命中计费域错误码 **`15001`**（"当前套餐不支持该功能"）——
          #    `15001` 里就含 `5001` 这个子串。门禁因此长期误报，
          #    而误报比漏报更危险：团队会习惯性地给它打绿灯或直接跳过。
          #    改为 `\b5001\b`（词界）后，`15001` 不再命中（"5001" 前是数字 1）。
          FORBIDDEN='dify|milvus|litellm|\b5001\b|chat-messages|workflow_run|retriever_resources|datasets/|/v1/'
          TARGETS='apps/web'
          # 未来插件 SDK 目录加入同一门禁
          if [ -d 'plugins' ]; then
            TARGETS="$TARGETS plugins"
          fi

          # 排除构建产物与依赖目录——它们不是本仓库源码，
          # 且其内容来自上游包，可能合法地包含上述字样（如类型定义中的路径）。
          #
          # `scripts/` 一并排除（审计 P1-2）：那是**构建期校验工具**，不随产物分发；
          # 且 `check-banned-terms.mjs` 的负样本表里**必须**写 `milvus` 这类字样
          # （否则无法证明术语门禁能红）。扫描工具自身会把自己扫成违规。
          EXCLUDE='--exclude-dir=node_modules --exclude-dir=.next --exclude-dir=out --exclude-dir=dist --exclude-dir=coverage --exclude-dir=scripts --exclude=*.tsbuildinfo --exclude=package-lock.json'

          MATCHES=$(grep -rniE "$FORBIDDEN" $TARGETS $EXCLUDE 2>/dev/null || true)

          if [ -n "$MATCHES" ]; then
            echo "::error::前端/插件代码中出现底座直连痕迹（违反架构红线 1.4）"
            echo "$MATCHES"
            exit 1
          fi
          echo "::endgroup::"
          echo "[OK] 前端与插件代码未出现任何底座直连字样"

      - name: 校验前端依赖不含底座 SDK
        run: |
          echo "::group::校验前端依赖清单"
          FORBIDDEN_DEPS='dify|milvus|litellm'
          MATCHES=$(grep -niE "\"[^\"]*($FORBIDDEN_DEPS)[^\"]*\":" apps/web/package.json 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::前端依赖中出现底座 SDK（违反架构红线 1.4）"
            echo "$MATCHES"
            exit 1
          fi
          echo "::endgroup::"
          echo "[OK] 前端依赖清单干净"

      - name: 校验适配层是唯一底座调用出口
        run: |
          echo "::group::校验底座调用出口唯一性"
          # 底座 URL 只允许出现在 core/config.py 与 clients/dify_client.py
          OFFENDERS=$(grep -rl 'dify-api\|dify_base_url' apps/adapter/app \
            --include='*.py' \
            | grep -v 'core/config.py' \
            | grep -v 'clients/dify_client.py' \
            || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::以下文件出现了底座地址配置（违反架构文档 6.2 唯一出口约束）"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "::endgroup::"
          echo "[OK] 底座调用出口唯一性校验通过"

  # =========================================================================
  # 门禁 1b：镜像标签存在性校验（P0，QA NEW-P0 / NEW-P1）
  #
  # 镜像标签拼错的后果是「CI 全绿、部署才炸」——代码依赖违规会被 SCA 扫出来，
  # 但镜像标签拼错只有拉取时才发现。因此本门禁独立于协议扫描，
  # 对 images.lock 中每个 tag 做上游存在性核验。
  # =========================================================================
  image-tag-existence:
    name: 镜像标签存在性校验
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 校验一致性 + 精确版本线
        run: |
          python -m pip install pyyaml
          python deploy/validate_images.py

      - name: 校验上游标签真实存在（杜绝合成标签）
        run: |
          python deploy/validate_images.py --check-remote

      - name: 校验 Valkey 健康检查命令（禁用 redis-cli）
        run: |
          echo "::group::校验 Valkey 健康检查命令"
          if grep -rn "redis-cli" deploy/docker-compose*.yml; then
            echo "::error::Valkey 服务的健康检查须使用 valkey-cli（redis-cli 在部分镜像中不存在）"
            exit 1
          fi
          echo "::endgroup::"
          echo "[OK] 健康检查命令合规"

      # ------------------------------------------------------------------
      # 门禁 1c：密钥兜底扫描（G-33，审计 OA-AUDIT-001 P0-3）
      # 钉住的事故：compose 里 PLUGIN_DAEMON_KEY / PLUGIN_DIFY_INNER_API_KEY
      # 写成 `${VAR:-<明文常量>}`（私有化 3 处 + SaaS 4 处），而其余 20+ 枚密钥
      # 都是 `${VAR:?必须在 .env 中设置}`。不配 .env 也能启动 → 部署默认使用
      # 已随仓库公开的常量密钥，内部 API 对任何人敞开。
      # ------------------------------------------------------------------
      - name: 密钥兜底扫描（G-33）
        run: python deploy/validate_secrets.py

      - name: 密钥兜底门禁自检（可红证明）
        run: |
          set +e
          python deploy/validate_secrets.py --self-test
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "密钥兜底门禁自检未按预期命中负样本（退出码 $code，期望 1）"
            exit 1
          fi
          echo "密钥兜底门禁自检通过：负样本行为符合预期"

  # =========================================================================
  # 门禁 2：SCA 协议扫描
  # =========================================================================
  license-scan:
    name: 开源协议扫描（SCA）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # H-2（审计 2026-10-28）：uv 供下方 `uv export --frozen` 从锁文件导出清单。
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/adapter/uv.lock

      # ------------------------------------------------------------------
      # Python 依赖协议扫描
      # ------------------------------------------------------------------
      - name: 扫描 Python 依赖协议
        run: |
          python -m pip install --upgrade pip
          # pyyaml 是下方协议判定脚本解析 images.lock / compose 的硬依赖。
          # 此前只装了 pip-licenses，脚本一执行到 `yaml.safe_load` 就 NameError，
          # 整条合规门禁恒红（S8 故障点③，2026-10-23）。
          pip install pip-licenses pyyaml
          # H-2（审计 2026-10-28）：适配层依赖改走 uv.lock 精确清单——
          # `uv export --frozen` 从锁文件导出 requirements 再照单安装，
          # 与质量门禁（uv sync --frozen）同源，杜绝两处口径漂移。
          uv export --frozen --no-emit-project --format requirements-txt \
            --project apps/adapter -o locked-requirements.txt
          pip install -r locked-requirements.txt
          pip install -e "apps/adapter" --no-deps --quiet
          pip-licenses format=markdown --with-urls --with-license-file \
            > python-licenses.md
          echo "[OK] Python 依赖清单已生成"

      # ------------------------------------------------------------------
      # Node 依赖漏洞扫描（QA-05，审计 2026-10-28）
      # ------------------------------------------------------------------
      - name: npm audit（高危及以上即红）
        # npm workspaces 锁在仓库根（与 ci-web.yml 同口径），必须在根执行；
        # audit 读 package-lock.json 上报 registry 漏洞库比对结果。
        run: npm audit --audit-level=high

      # ------------------------------------------------------------------
      # Node 依赖协议扫描
      # ------------------------------------------------------------------
      - name: 扫描 Node 依赖协议
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund --silent
          npm ls --all --json > /dev/null 2>&1 || true
          npm install -g license-checker --silent
          license-checker --json --production > node-licenses.json
          echo "[OK] Node 依赖清单已生成"

      # ------------------------------------------------------------------
      # 黑名单协议判定（总方案 5.3）
      # ------------------------------------------------------------------
      - name: 协议黑名单判定
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import sys

          import yaml

          # 黑名单：GPL / AGPL / SSPL（含各类变体）
          # ENG-03（审计 2026-10-28）：原 `\b(GPL|AGPL|...)\b` 用精确 token 枚举
          # 匹配自由文本，`GPLv3` 的 L-v 之间不成立词边界、`GPL-2.0-only` 又不在
          # 枚举里——两路都漏。改为**前缀锚定式**：`L?GPL` 前缀同时命中
          # GPLv2/GPLv3/GPL-2.0-only/…；`General Public License` 兜全称写法；
          # AGPL/SSPL 单列避免语义混淆。
          BLACKLIST = re.compile(
              r'(?i)(?:\bAGPL|\bSSPL|\bL?GPL|General\s+Public\s+License|EUPL|OSL)\S*',
              re.IGNORECASE,
          )
          # 灰名单：仅可独立进程调用，不可引入核心代码（需人工确认）。
          # ⚠ 黑名单优先（`L?GPL` 已含 LGPL——判黑不判灰）；灰名单前缀式改写，
          # 兜其余 LGPL 写法之外的 MPL/CDDL/EPL。
          GREYLIST = re.compile(r'(?i)(?:\bMPL|\bCDDL|\bEPL)\S*')

          # ENG-03 负样本自检（与判定同生共死：正则再退化时此步骤直接红）
          _BLACKLIST_POSITIVES = [
              "GPLv3", "GPL-2.0-only", "AGPL-3.0-only", "SSPL-1.0",
              "GNU General Public License v3.0",
          ]
          _BLACKLIST_NEGATIVES = ["MIT", "Apache-2.0", "BSD-3-Clause", "MPL-2.0"]
          assert all(BLACKLIST.search(s) for s in _BLACKLIST_POSITIVES), \
              "ENG-03 自检失败：黑名单正则漏检了已知 GPL 变体"
          assert not any(BLACKLIST.search(s) for s in _BLACKLIST_NEGATIVES), \
              "ENG-03 自检失败：黑名单正则误伤白名单协议（MPL 属灰名单）"

          findings = {'black': [], 'grey': []}

          # ---- Python 依赖 ----
          report = pathlib.Path('python-licenses.md')
          if report.is_file():
              for line in report.read_text(encoding='utf-8').splitlines():
                  if line.startswith('|') and BLACKLIST.search(line):
                      findings['black'].append(f'[python] {line.strip()}')
                  elif line.startswith('|') and GREYLIST.search(line):
                      findings['grey'].append(f'[python] {line.strip()}')

          # ---- Node 依赖 ----
          node_report = pathlib.Path('apps/web/node-licenses.json')
          if node_report.is_file():
              data = json.loads(node_report.read_text(encoding='utf-8'))
              for name, meta in data.items():
                  licenses = meta.get('licenses', '')
                  if isinstance(licenses, list):
                      licenses = ' '.join(licenses)
                  if BLACKLIST.search(licenses or ''):
                      findings['black'].append(f'[node] {name}: {licenses}')
                  elif GREYLIST.search(licenses or ''):
                      findings['grey'].append(f'[node] {name}: {licenses}')

          # ---- 基础设施镜像协议复核（⚠️ D-06）----
          # 说明：镜像判定一律以 deploy/images.lock（唯一事实来源）为准，
          # 不再对编排文件做宽松前缀正则匹配——宽松正则会给**不存在的合成标签**
          # 签发虚假合规通行证（QA NEW-P1）。
          # 标签存在性与一致性校验由独立的 image-tag-existence 门禁负责
          # （deploy/validate_images.py，本地与 CI 同源）。
          compose_dir = pathlib.Path('deploy')
          lock_file = compose_dir / 'images.lock'
          locked_images: set[tuple[str, str]] = set()
          if lock_file.is_file():
              lock_data = yaml.safe_load(lock_file.read_text(encoding='utf-8'))
              for entry in (lock_data or {}).get('images', []):
                  locked_images.add((str(entry.get('name', '')), str(entry.get('tag', ''))))
                  license_name = str(entry.get('license', ''))
                  role = str(entry.get('role', ''))
                  # 「独立容器」豁免：GPL 类协议只要**不进入核心代码库**、仅以独立
                  # 容器进程调用，即符合总方案 5.3 的灰名单口径（ADR-0002 AC-11）。
                  # 判定不看协议文本，只看 images.lock 是否显式声明 distribution——
                  # 缺字段一律按黑名单处理，避免「把 GPL 塞进 GREYLIST 正则」式放水。
                  distribution = str(entry.get('distribution', '') or '')
                  independent = distribution == 'independent-container'
                  if BLACKLIST.search(license_name):
                      if independent:
                          findings['grey'].append(
                              f'[infra] {entry.get("name")}:{entry.get("tag")} '
                              f'协议 {license_name}（{role}），独立容器运行，'
                              f'不进入核心代码库'
                          )
                      else:
                          findings['black'].append(
                              f'[infra] {entry.get("name")}:{entry.get("tag")} '
                              f'协议 {license_name}（{role}）且未声明 independent-container'
                          )
                  elif GREYLIST.search(license_name):
                      findings['grey'].append(
                          f'[infra] {entry.get("name")}:{entry.get("tag")} 协议 {license_name}（{role}）'
                      )
          else:
              findings['black'].append('[infra] 缺少 deploy/images.lock（镜像唯一事实来源）')

          # 说明：MinIO 已按 D-06 全面替换为 SeaweedFS（Apache-2.0），
          # 原「必须登记 minio/minio 且锁定 AGPL 前版本」的死规则已删除——
          # 它会让任何正确删除 MinIO 的仓库恒红（S8 故障点②，2026-10-23）。

          if any(n == 'valkey/valkey' for n, _ in locked_images):
              findings['grey'].append('[infra] 缓存使用 Valkey（BSD-3-Clause），D-06 待决')
          if any(n == 'redis' for n, _ in locked_images):
              findings['grey'].append('[infra] 使用 Redis 7（RSALv2/SSPL），须独立进程运行')

          # ---- 编排文件的镜像引用必须 ⊆ images.lock（精确匹配）----
          compose_refs: set[tuple[str, str]] = set()
          for compose in compose_dir.glob('docker-compose*.yml'):
              compose_data = yaml.safe_load(compose.read_text(encoding='utf-8'))
              for service in (compose_data or {}).get('services', {}).values():
                  image = (service or {}).get('image')
                  if not image or ':' not in image:
                      continue
                  name, tag = image.rsplit(':', 1)
                  # 解析 ${VAR:-default} 模板语法，取默认值参与比对
                  template = re.search(r'\$\{[A-Z_]+:-([^}]+)\}', tag)
                  if template:
                      tag = template.group(1)
                  if '@sha256:' in tag:
                      # digest 锁定形式，视为合规
                      continue
                  compose_refs.add((name, tag))

          for name, tag in sorted(compose_refs):
              if (name, tag) not in locked_images:
                  findings['black'].append(
                      f'[infra] 编排文件引用 {name}:{tag}，但未在 images.lock 中登记'
                  )
          if compose_refs:
              print(f'[INFO] 编排文件镜像引用 {len(compose_refs)} 个，'
                    f'images.lock 登记 {len(locked_images)} 个')

          print('=' * 70)
          print('开源协议扫描结果')
          print('=' * 70)

          if findings['grey']:
              print(f'\n[灰名单] 需人工确认（仅可独立进程调用，不可引入核心代码）：{len(findings["grey"])} 项')
              for item in findings['grey']:
                  print(f'  - {item}')

          if findings['black']:
              print(f'\n[黑名单] 禁止引入核心代码库：{len(findings["black"])} 项')
              for item in findings['black']:
                  print(f'  - {item}')
              print('\n[FAIL] 存在黑名单协议依赖，CI 门禁不通过')
              sys.exit(1)

          print('\n[OK] 未发现黑名单协议依赖')
          PY

      - name: 上传协议扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-scan-report
          path: |
            python-licenses.md
            apps/web/node-licenses.json
          retention-days: 30

  # =========================================================================
  # 门禁 3：依赖清单一致性检查
  # =========================================================================
  dependency-manifest:
    name: 依赖清单架构约束
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ------------------------------------------------------------------
      # 依赖清单与架构文档一致（P2-19：真源唯一化）
      #
      # 此前本 job 用「内联脚本 + 硬编码 ALLOWED 集合」做兜底告警，三处失效
      # （2026-10-27 实测）：
      # ① **只告警不判红**（打印 `[WARN]` 后没有 exit 1）→ 新增依赖永远拦不住；
      # ② **前端 regex 匹配不到**：`\s*"([^"]+)[\[<>=]` 要求版本号紧跟引号后
      #    以 `<>=` 起头，而 package.json 是 `"next": "^16.4.2"` 的 `": "` 形态
      #    → 前端 36 条依赖**一条都没进过这个集合**（"看起来在守、其实没守"）；
      # ③ **对 pyproject 实测就报 3 条黄**（starlette / prometheus-client /
      #    python-docx，三者都合法且已登记在 §8.1）→ 恒黄即恒被无视。
      #
      # 现改为调用 `deploy/validate_deps.py`：真源是架构文档 §8.1 / §8.2 的
      # **表格本身**（脚本内不建第二份包名常量），两处白名单不可能漂移。
      # 该脚本当前是绿的（17 运行时 + 36 前端全部已登记），因此删掉内联白名单
      # **不需要**补 starlette / prometheus-client / python-docx。
      #
      # 注意：本 job **没有** job 级 `defaults.run.working-directory`，
      # 所以每一步都必须显式写 `working-directory: .`（脚本按仓库根定位文档）。
      # ------------------------------------------------------------------
      - name: 依赖清单与架构文档一致（§8.1 + §8.2）
        working-directory: .
        run: python deploy/validate_deps.py

      # 自检：A–G 七条样本证明门禁会红、会白、会 fail-closed（exit 2）。
      # 口径与 validate_config_names 一致：**自检成功 = exit 0**，不要套 `-ne 1`
      # （套了会把健康门禁判成红）。
      - name: 依赖门禁自检（可红证明）
        working-directory: .
        run: python deploy/validate_deps.py --self-test
